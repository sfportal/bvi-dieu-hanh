<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  :root { --g: #15803d; --r: #b91c1c; --mut: #6b7280; --bd: #e5e7eb; }
  * { box-sizing: border-box; }
  body { width: 380px; margin: 0; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; }
  header { background: var(--g); color: #fff; padding: 12px 14px; }
  header h1 { margin: 0; font-size: 14px; }
  header .sub { opacity: .85; font-size: 12px; }
  section { padding: 10px 14px; border-bottom: 1px solid var(--bd); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: #f9fafb; border: 1px solid var(--bd); border-radius: 8px; padding: 6px 8px; }
  .kpi b { display: block; font-size: 18px; }
  .kpi span { color: var(--mut); font-size: 11px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 3px 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; width: 44px; }
  td.d { text-align: right; width: 44px; font-size: 11px; }
  .up { color: var(--r); } .down { color: var(--g); } .same { color: var(--mut); }
  .bar { height: 4px; background: #fee2e2; border-radius: 2px; margin-top: 2px; }
  .bar i { display: block; height: 100%; background: #ef4444; border-radius: 2px; }
  .btns { display: flex; gap: 6px; }
  button { flex: 1; padding: 7px 8px; border: 1px solid var(--bd); border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }
  button.primary { background: var(--g); border-color: var(--g); color: #fff; font-weight: 600; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--r); background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 6px 8px; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .row label { width: 92px; color: var(--mut); }
  select, input[type=time] { font: inherit; padding: 3px 4px; }
  .muted { color: var(--mut); font-size: 12px; }
  details summary { cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Tổng hợp hồ sơ vùng trồng</h1>
  <div class="sub" id="last">Chưa có lần chạy nào</div>
</header>

<section>
  <div class="kpis">
    <div class="kpi"><b id="k-total">—</b><span>Vùng trồng</span></div>
    <div class="kpi"><b id="k-complete">—</b><span>Đủ 12 mục</span></div>
    <div class="kpi"><b id="k-unchecked">—</b><span>Chưa kiểm tra HS</span></div>
  </div>
  <div id="err"></div>
</section>

<section>
  <table id="crit"></table>
  <div class="muted" id="changes" style="margin-top:6px"></div>
</section>

<section class="btns">
  <button class="primary" id="run">Chạy ngay</button>
  <button id="report">Xem báo cáo</button>
  <button id="csv">Tải CSV</button>
</section>

<section>
  <details>
    <summary>Lịch tự động</summary>
    <div class="row"><label>Tần suất</label>
      <select id="freq"><option value="m30">Mỗi 30 phút</option><option value="h1">Mỗi giờ</option><option value="daily">Hằng ngày</option><option value="weekly">Hằng tuần</option><option value="off">Tắt</option></select></div>
    <div class="row" id="wd-row"><label>Thứ</label>
      <select id="weekday"><option value="1">Thứ Hai</option><option value="2">Thứ Ba</option><option value="3">Thứ Tư</option><option value="4">Thứ Năm</option><option value="5">Thứ Sáu</option><option value="6">Thứ Bảy</option><option value="0">Chủ nhật</option></select></div>
    <div class="row" id="tm-row"><label>Giờ chạy</label><input type="time" id="time"></div>
    <div class="row"><label></label><label style="width:auto;color:inherit"><input type="checkbox" id="autoSync"> Tự đồng bộ sang BVI sau mỗi lần chạy</label></div>
    <div class="row"><label></label><label style="width:auto;color:inherit"><input type="checkbox" id="notify"> Hiện thông báo</label></div>
    <div class="row"><label></label><label style="width:auto;color:inherit"><input type="checkbox" id="autoDownload"> Tự tải CSV vào Downloads/FarmBase</label></div>
    <div class="row"><label></label><button id="save" style="flex:0 0 auto">Lưu lịch</button></div>
    <div class="muted" id="next"></div>
    <div class="muted">Chrome cần đang mở và đã đăng nhập admin.farmbase.vn. Nếu máy tắt đúng giờ chạy, extension sẽ chạy bù khi Chrome mở lại.</div>
  </details>
</section>
<script src="lib.js"></script>
<script src="popup.js"></script>
</body>
</html>
