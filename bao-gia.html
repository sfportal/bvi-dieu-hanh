<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f5b3c">
<title>Báo giá, hợp đồng · BVI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Báo giá, hợp đồng: chọn mẫu, sửa, gửi duyệt, quản lý duyệt, sales gửi khách. Logic dùng chung ở quote-core.js. */
:root{--bg:#f3f5f1;--surface:#fff;--sunk:#e8ece5;--line:#d5dbd1;--fg:#17201a;--muted:#5b6a5f;--brand:#1f5b3c;--brand-ink:#fff;
 --good:#2f7d4f;--warn:#b7791f;--bad:#b83a2e;--info:#2f5f8a;--chip:#eef2ea;--f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111613;--surface:#18201b;--sunk:#0d120f;--line:#2b362f;--fg:#e7ede8;--muted:#9aaa9f;--brand:#5fb184;--brand-ink:#0d1a12;
 --good:#5fb184;--warn:#e0a33f;--bad:#e2685b;--info:#7fb0dc;--chip:#202a23;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f);padding-bottom:calc(68px + env(safe-area-inset-bottom))}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top b{font-size:16px;white-space:nowrap}.top .sp{flex:1}
.me{font-size:13px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
@media (max-width:420px){.me{display:none}}
main{max-width:1280px;margin:0 auto;padding:12px}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bot a{flex:1;text-align:center;padding:9px 4px 8px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.bot a span{display:block;font-size:19px;line-height:1.1}.bot a.on{color:var(--brand)}
.topnav{display:none}
h1{font-size:19px;margin:4px 2px 10px}
h2{font-size:15px;margin:16px 2px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.sub{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:var(--chip);color:var(--fg);white-space:nowrap}
.pill.s-pending{background:var(--warn);color:#fff}.pill.s-approved{background:var(--good);color:#fff}.pill.s-sent{background:var(--info);color:#fff}
.ck{margin:8px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px}.ck ul{margin:6px 0 0;padding-left:18px}.ck li{margin:3px 0;overflow-wrap:anywhere}.ck li.e{color:var(--bad);font-weight:600}.ck li.w{color:var(--warn)}
.pill.s-rejected{background:rgba(184,58,46,.14);color:var(--bad)}.pill.s-cancelled{text-decoration:line-through;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
textarea.in{min-height:44px;resize:vertical}
.f{margin-bottom:8px;min-width:0}.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.il span{font-size:11.5px;color:var(--muted);padding-left:2px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 6px}
@media (max-width:520px){.g2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}
.msg{margin:8px 0;padding:8px 10px;border-radius:10px;font-size:13px;overflow-wrap:anywhere}.msg.bad{background:rgba(184,58,46,.12);color:var(--bad)}.msg.ok{background:rgba(47,125,79,.12);color:var(--good)}.msg.warn{background:rgba(183,121,31,.14);color:var(--warn)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:20;display:none;max-width:90vw}
.auth{max-width:380px;margin:40px auto}
.list{display:grid;gap:8px}
.drow{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.drow .nm{font-weight:600;overflow-wrap:anywhere}.drow .mt{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;color:var(--muted);font-size:12.5px}
.tpl{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;margin-bottom:8px}
.tpl.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.sugg{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:4px;max-height:220px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer}
.ed{display:grid;gap:12px}
.blk{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;min-width:0}
.blk-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}.blk-h b{flex:1;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.rte{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:60px;background:var(--surface);overflow-wrap:anywhere;outline:none}
.rte:focus{border-color:var(--brand)}.rte table{border-collapse:collapse;width:100%}.rte td,.rte th{border:1px solid var(--line);padding:3px 5px;overflow-wrap:break-word;font-size:13px}
.tb{display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap}.tb button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12.5px}
.irow{border:1px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.tot{font-size:13px;text-align:right}
.pv{background:var(--sunk);border-radius:12px;padding:10px;overflow-x:auto}
.pv .qd{box-shadow:0 1px 4px rgba(0,0,0,.12);border-radius:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.vtabs{display:flex;gap:6px;margin:6px 0}
.hist{font-size:12.5px;color:var(--muted);margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer}.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--chip)}
.wideonly{display:none}
details.vars summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
details.vars code{background:var(--chip);border-radius:4px;padding:0 4px;font-size:12px}
@media (min-width:900px){
 body{padding-bottom:0}.bot{display:none!important}
 .topnav{display:flex;gap:4px;margin-left:14px}.topnav a{color:inherit;text-decoration:none;padding:5px 12px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:.85}
 .topnav a.on{background:rgba(255,255,255,.2);opacity:1}
 #toast{bottom:24px}
 .split{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:14px;align-items:start}
 .split .pv{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
 .vtabs{display:none}.split>.hide{display:block!important}
 .wideonly{display:table}.narrowonly{display:none}
}
</style>
<style id="qcss"></style>
</head>
<body>
<header class="top" id="top" style="display:none"><b>Báo giá, hợp đồng</b><nav class="topnav" id="tnav"></nav><span class="sp"></span><span class="me" id="meBtn"></span><button class="out" id="bLogout" type="button">Đăng xuất</button></header>
<main id="app"><div class="sub" style="padding:30px;text-align:center">Đang tải…</div></main>
<nav class="bot" id="bot" style="display:none"></nav>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="quote-core.js"></script>
<script src="sales-core.js"></script>
<script>
const SB_URL="https://pkckduidwfcncipwzdxa.supabase.co", SB_KEY="sb_publishable_ZHvz0flMvyIsxmT-tKS_Hw_q_Vz_7RF";
let SB, ME=null, CO={}, TPL=[], DOCS=[], PEOPLE={}, LEADS=null, LTAB="", LF={kind:"",status:"",q:""}, CUR=null, DIRTY=false, SAVING=null, VT="edit", REMIND=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=QC.esc, lab=QC.lab;
const isMgr=()=>QC.isMgr(ME), isViewer=()=>ME&&ME.role==="viewer";
const pname=id=>id?(PEOPLE[id]||(ME&&id===ME.id?ME.name:"")||"Người khác"):"";
const dt=iso=>{ if(!iso) return ""; const s=new Date(Date.parse(iso)+7*36e5).toISOString(); return s.slice(8,10)+"/"+s.slice(5,7)+" "+s.slice(11,16); };
const JSZIP_URL="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js", H2P_URL="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js";
function loadJs(src){ loadJs.c=loadJs.c||{}; return loadJs.c[src]=loadJs.c[src]||new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>{ delete loadJs.c[src]; no(new Error("Không tải được thư viện, kiểm tra mạng")); }; document.head.appendChild(s); }); }
function saveBlob(b,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }
function toast(t){ const e=$("#toast"); e.textContent=t; e.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display="none",2400); }
function shell(on){ $("#top").style.display=on?"":"none"; $("#bot").style.display=on?"":"none"; }
const errText=e=>{ const m=(e&&e.message)||String(e||""); return /locked/.test(m)?"Bản này đang chờ duyệt hoặc đã duyệt, không sửa được. Bấm Sửa lại để mở.":/not_owner/.test(m)?"Bạn không phải người lập bản này.":/not_manager/.test(m)?"Chỉ quản lý được duyệt.":/not_approved/.test(m)?"Bản này chưa được duyệt.":/bad_status/.test(m)?"Trạng thái đã thay đổi, tải lại trang.":/kind_check/.test(m)?"Máy chủ chưa bật văn bản gửi xã. Báo quản lý chạy file sales_letters_remind.sql.":/relation .* does not exist|schema cache|sales_doc/.test(m)?"Máy chủ chưa bật tính năng báo giá. Báo quản lý chạy file sales_quotes.sql.":/fetch|network/i.test(m)?"Mất kết nối, thử lại.":m; };

// ---------- đăng nhập ----------
function showLogin(msg){
 shell(false);
 $("#app").innerHTML='<div class="auth card"><h1 style="margin:0 0 4px">Báo giá, hợp đồng</h1><div class="sub" style="margin-bottom:12px">Đăng nhập bằng tài khoản được cấp</div>'+(msg?'<div class="msg bad">'+esc(msg)+'</div>':'')
  +'<form id="lf"><div class="f"><label for="lem">Email</label><input class="in" id="lem" type="email" autocomplete="username" required></div><div class="f"><label for="lpw">Mật khẩu</label><input class="in" id="lpw" type="password" autocomplete="current-password" required></div>'
  +'<button class="btn pri" style="width:100%">Đăng nhập</button><div class="sub" id="lmsg" style="margin-top:8px"></div></form></div>';
 $("#lf").addEventListener("submit",async e=>{ e.preventDefault(); $("#lmsg").textContent="Đang đăng nhập…";
  const {error}=await SB.auth.signInWithPassword({email:$("#lem").value.trim(),password:$("#lpw").value});
  if(error){ $("#lmsg").textContent=/invalid/i.test(error.message)?"Sai email hoặc mật khẩu.":error.message; return; } start(); });
}
function block(msg){ shell(false); $("#app").innerHTML='<div class="auth card"><div class="msg warn">'+esc(msg)+'</div><button class="btn" id="bOut" style="width:100%">Đăng xuất</button></div>'; $("#bOut").onclick=logout; }
async function logout(){ try{ await SB.auth.signOut({scope:"local"}); }catch(e){} try{ Object.keys(localStorage).filter(k=>/^sb-.*-auth-token$/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){} ME=null; location.hash=""; showLogin(); }
async function start(){
 const {data:{session}}=await SB.auth.getSession(); if(!session){ showLogin(); return; }
 const {data:prof,error}=await SB.from("profiles").select("id,name,email,role,active,must_change_pw").eq("id",session.user.id).single();
 if(error||!prof){ block("Không đọc được tài khoản. Thử tải lại trang."); return; }
 ME=prof; if(!prof.active){ block("Tài khoản đã bị khóa."); return; }
 if(!["owner","manager","staff","ctv","viewer"].includes(prof.role)){ block("Tài khoản chưa được dùng trang báo giá."); return; }
 if(prof.must_change_pw){ block("Đổi mật khẩu lần đầu ở trang sales trước rồi quay lại."); return; }
 shell(true); $("#meBtn").textContent=prof.name||prof.email; drawNav();
 $("#app").innerHTML='<div class="sub" style="padding:30px;text-align:center">Đang tải…</div>';
 const err=await loadBase(); if(err){ $("#app").innerHTML='<div class="msg bad">'+esc(errText(err))+'</div>'; return; }
 route();
}
async function loadBase(){
 const [c,t,p,rm]=await Promise.all([SB.from("sales_companies").select("*").order("sort"),SB.from("sales_templates").select("*").order("sort"),SB.rpc("sales_people"),SB.from("sales_settings").select("value").eq("key","remind").maybeSingle()]);
 REMIND=rm&&rm.data?rm.data.value:null;
 if(c.error) return c.error; if(t.error) return t.error;
 CO={}; (c.data||[]).forEach(x=>CO[x.id]=x); TPL=t.data||[]; PEOPLE={}; (p.data||[]).forEach(x=>PEOPLE[x.id]=x.name);
 return loadDocs();
}
async function loadDocs(){ const d=await SB.from("sales_docs").select("id,kind,number,title,company_id,lead_id,customer,total,status,created_by,created_at,updated_at,submitted_at,reviewed_at,sent_at,sent_via").order("updated_at",{ascending:false}).limit(1000);
 if(d.error) return d.error; DOCS=d.data||[]; drawNav(); return null; }
async function loadLeads(){ if(LEADS) return LEADS; const all=[]; for(let f=0;;f+=1000){ const {data,error}=await SB.from("sales_leads").select("id,name,address,area,province,tax_id,contact_name,contact_title,contact_phone,org_phone,contact_email,owner_id,stage").order("name").range(f,f+999); if(error) break; all.push(...data); if(data.length<1000) break; } LEADS=all; return all; }

// ---------- điều hướng ----------
function navItems(){ const n=DOCS.filter(d=>d.status==="pending").length; const a=[["ds","☰","Danh sách"+(isMgr()&&n?" ("+n+")":"")]]; if(!isViewer()) a.push(["moi","＋","Tạo mới"]); if(isMgr()){ a.push(["mau","▤","Mẫu"]); a.push(["dn","🏢","Doanh nghiệp"]); } return a; }
function drawNav(){ if(!ME) return; const it=navItems();
 $("#tnav").innerHTML=it.map(([k,,t])=>'<a href="#'+k+'" data-r="'+k+'">'+esc(t)+'</a>').join("")+'<a href="sales.html">← Trang sales</a>';
 $("#bot").innerHTML=it.map(([k,i,t])=>'<a href="#'+k+'" data-r="'+k+'"><span>'+i+'</span>'+esc(t.replace(/ \(\d+\)$/,""))+'</a>').join("")+'<a href="sales.html"><span>←</span>Sales</a>';
 markNav(); }
function markNav(){ const r=(location.hash||"#ds").slice(1).split("/")[0]; const cur=r==="doc"?"ds":r; $$(".bot a,.topnav a").forEach(a=>a.classList.toggle("on",a.dataset.r===cur)); }
async function route(){
 if(!ME) return; if(DIRTY&&CUR) await saveNow();
 CUR=null; markNav(); const [r,id]=(location.hash||"#ds").slice(1).split("/"); window.scrollTo(0,0);
 if(r==="doc"&&id) return vDoc(decodeURIComponent(id));
 if(r==="moi"&&!isViewer()) return vNew(id?decodeURIComponent(id):null);
 if(r==="mau"&&isMgr()) return id?vTpl(decodeURIComponent(id)):vTpls();
 if(r==="dn"&&isMgr()) return id?vCo(decodeURIComponent(id)):vCos();
 vList();
}
window.addEventListener("hashchange",route);
window.addEventListener("beforeunload",e=>{ if(DIRTY){ e.preventDefault(); e.returnValue=""; } });

// ---------- danh sách ----------
const stPill=s=>'<span class="pill s-'+esc(s)+'">'+esc(lab(QC.STATUS,s))+'</span>';
const coName=id=>(CO[id]&&(CO[id].short_name||CO[id].name))||"";
function vList(){
 if(!LTAB) LTAB=isMgr()&&DOCS.some(d=>d.status==="pending")?"pending":isMgr()?"all":"mine";
 const T=isMgr()||isViewer()?[["pending","Chờ duyệt"],["all","Tất cả"],["mine","Của tôi"]]:[["mine","Của tôi"]];
 let arr=DOCS.filter(d=>LTAB==="pending"?d.status==="pending":LTAB==="mine"?d.created_by===ME.id:true);
 if(LF.kind) arr=arr.filter(d=>d.kind===LF.kind); if(LF.status) arr=arr.filter(d=>d.status===LF.status);
 if(LF.q){ const q=LF.q.toLowerCase(); arr=arr.filter(d=>[d.number,d.title,(d.customer||{}).name,coName(d.company_id),pname(d.created_by)].join(" ").toLowerCase().includes(q)); }
 const sent=DOCS.filter(d=>d.status==="sent"), sum=sent.filter(d=>d.kind==="quote").reduce((s,d)=>s+Number(d.total||0),0);
 let h='<div class="row" style="justify-content:space-between"><h1>Báo giá, hợp đồng</h1>'+(isViewer()?'':'<a class="btn pri" href="#moi">＋ Tạo mới</a>')+'</div>';
 if(isMgr()) h+='<div class="sub" style="margin:-4px 2px 10px">'+DOCS.filter(d=>d.status==="pending").length+' chờ duyệt · '+sent.length+' đã gửi khách · tổng báo giá đã gửi '+QC.money(sum)+' đ</div>';
 h+=(T.length>1?'<div class="tabs">'+T.map(([k,t])=>'<button data-lt="'+k+'" class="'+(LTAB===k?"on":"")+'">'+t+' ('+DOCS.filter(d=>k==="pending"?d.status==="pending":k==="mine"?d.created_by===ME.id:true).length+')</button>').join("")+'</div>':'')
  +'<div class="g3" style="margin-bottom:8px"><input class="in" id="lq" type="search" placeholder="Tìm số, khách, người lập" value="'+esc(LF.q)+'">'
  +'<select class="in" id="lk" aria-label="Loại"><option value="">Mọi loại</option>'+QC.KINDS.map(([k,t])=>'<option value="'+k+'"'+(LF.kind===k?" selected":"")+'>'+t+'</option>').join("")+'</select>'
  +'<select class="in" id="ls" aria-label="Trạng thái"><option value="">Mọi trạng thái</option>'+QC.STATUS.map(([k,t])=>'<option value="'+k+'"'+(LF.status===k?" selected":"")+'>'+t+'</option>').join("")+'</select></div>';
 if(!arr.length) h+='<div class="card sub">Chưa có bản nào.'+(isViewer()?'':' Bấm <a href="#moi">Tạo mới</a> để chọn mẫu.')+'</div>';
 else {
  h+='<table class="tbl wideonly"><thead><tr><th>Số</th><th>Tiêu đề</th><th>Khách hàng</th><th>Đơn vị</th><th style="text-align:right">Tổng (đ)</th><th>Trạng thái</th><th>Người lập</th><th>Cập nhật</th></tr></thead><tbody>'

async function syncLead(d){
 try{
  const c=d.customer||{}, ph=String(c.contact_phone||"").trim(), dg=ph.replace(/\D/g,""), nk=x=>String(x||"").toLowerCase().replace(/\s+/g," ").trim();
  const L=await loadLeads();

   let l=L.find(x=>nk(x.name)===nk(c.name))||(dg.length>=9?L.find(x=>[x.contact_phone,x.org_phone].some(p=>String(p||"").replace(/\D/g,"").includes(dg))):null);
   if(!l){ const du=await SB.rpc("sales_dup",{p_phone:ph,p_tax:c.tax_id||"",p_name:c.name});
    if(!du.error&&du.data==="none"){ const {data}=await SB.from("sales_leads").insert({name:String(c.name).trim(),province:c.province||null,address:c.address||null,tax_id:c.tax_id||null,
      contact_name:c.contact_name||null,contact_title:c.contact_title||null,contact_phone:ph||null,contact_email:c.email||null,stage:2,owner_id:ME.id,source:"Báo giá, văn bản"}).select().single();
     if(data){ l=data; L.push(data); } } }
   if(l){ d.lead_id=l.id; DIRTY=true; await saveNow(); }
  }
  if(!d.lead_id) return;
  const l=L.find(x=>x.id===d.lead_id)||{}, p={};
  [["contact_name","contact_name"],["contact_title","contact_title"],["contact_phone","contact_phone"],["email","contact_email"]].forEach(([a,b])=>{ const v=String(c[a]||"").trim(); if(v&&!String(l[b]||"").trim()) p[b]=v; });
  if(Object.keys(p).length){ const {error}=await SB.from("sales_leads").update(p).eq("id",d.lead_id); if(!error) Object.assign(l,p); }
  const who=[c.contact_name,c.contact_title,ph].map(x=>String(x||"").trim()).filter(Boolean).join(", ");
  if(who||String(c.note||"").trim()) await SB.from("sales_acts").insert({lead_id:d.lead_id,kind:"note",note:"Gửi duyệt "+lab(QC.KINDS,d.kind).toLowerCase()+' "'+(d.title||"")+'"'+(who?". Đầu mối: "+who:"")+(String(c.note||"").trim()?". Ghi chú: "+String(c.note).trim():"")});
 }catch(e){}
}

  $("#tName").oninput=e=>{ T.name=e.target.value; changed(); }; $("#tKind").onchange=e=>{ T.kind=e.target.value; changed(); const y=window.scrollY; draw(); window.scrollTo(0,y); };
  bindHead(T.body,changed,"t",()=>{ const y=window.scrollY; draw(); window.scrollTo(0,y); });
  $("#tCo").onchange=e=>{ T.company_id=e.target.value||null; changed(); }; $("#tDesc").oninput=e=>{ T.description=e.target.value; changed(); };
  $("#tAct").onchange=e=>{ T.active=e.target.checked; changed(); };
  $("#tSave").onclick=async()=>{ const row={name:T.name,kind:T.kind,company_id:T.company_id,description:T.description,active:T.active,body:T.body,updated_at:new Date().toISOString(),updated_by:ME.id};
   const {error}=await SB.from("sales_templates").update(row).eq("id",T.id); if(error){ $("#tMsg").textContent=errText(error); return; } Object.assign(t,QC.clone(row)); dirty=false; $("#tMsg").textContent="Đã lưu"; toast("Đã lưu mẫu"); };
  $("#tDel").onclick=()=>{ $("#tBox").innerHTML='<div class="card"><div class="sub">Xóa mẫu này? Các bản đã tạo từ mẫu vẫn giữ nguyên. Muốn tạm ẩn thì bỏ chọn "Bật cho nhân sự dùng".</div><div class="row" style="margin-top:8px"><button class="btn bad" id="tdGo">Xóa mẫu</button><button class="btn" id="tdX">Thôi</button></div></div>';
   $("#tdX").onclick=()=>$("#tBox").innerHTML=""; $("#tdGo").onclick=async()=>{ const {error}=await SB.from("sales_templates").delete().eq("id",T.id); if(error){ toast(errText(error)); return; } TPL=TPL.filter(x=>x.id!==T.id); location.hash="#mau"; }; };
 };
 draw();
}

// ---------- doanh nghiệp (quản lý) ----------
function vCos(){
 const a=Object.values(CO).sort((x,y)=>x.sort-y.sort);
 $("#app").innerHTML='<div class="row" style="justify-content:space-between"><h1>Đơn vị cung cấp dịch vụ</h1><button class="btn pri" id="cNew">＋ Thêm</button></div><div class="sub" style="margin:-4px 2px 10px">Thông tin hiện ở đầu báo giá, phần hai bên của hợp đồng và mục thanh toán.</div>'
  +a.map(c=>'<a class="drow" href="#dn/'+esc(c.id)+'"><div class="nm">'+esc(c.name)+(c.active?'':' <span class="pill s-cancelled">Đang tắt</span>')+'</div><div class="mt"><span>'+(c.tax_id?"MST "+esc(c.tax_id):"Chưa có MST")+'</span><span>'+((c.banks||[]).length?(c.banks||[]).length+" tài khoản":"Chưa có tài khoản")+'</span>'+(c.note?'<span>'+esc(c.note)+'</span>':'')+'</div></a>').join("");
 $("#cNew").onclick=async()=>{ const {data,error}=await SB.from("sales_companies").insert({name:"Đơn vị mới",sort:900}).select().single(); if(error){ toast(errText(error)); return; } CO[data.id]=data; location.hash="#dn/"+data.id; };
}
function vCo(id){
 const c0=CO[id]; if(!c0){ $("#app").innerHTML='<div class="msg bad">Không thấy đơn vị.</div><a class="btn" href="#dn">← Doanh nghiệp</a>'; return; }
 const c=QC.clone(c0); c.banks=Array.isArray(c.banks)?c.banks:[];
 const F=[["name","Tên đầy đủ"],["short_name","Tên ngắn (hiện ở khung ký)"],["tax_id","Mã số thuế"],["address","Địa chỉ"],["phone","Điện thoại"],["email","Email"],["website","Website"],["rep_name","Người đại diện"],["rep_title","Chức vụ"]];
 const draw=()=>{
  $("#app").innerHTML='<div class="row" style="justify-content:space-between"><a class="sub" href="#dn">← Doanh nghiệp</a><span class="sub" id="cMsg"></span></div><h1>'+esc(c.name)+'</h1>'
   +'<div class="card" style="max-width:760px"><div class="g2">'+F.map(([k,t])=>'<div class="f"><label>'+t+'</label><input class="in" data-cf="'+k+'" value="'+esc(c[k]||"")+'"></div>').join("")+'</div>'
   +'<h2>Tài khoản ngân hàng</h2>'+c.banks.map((b,i)=>'<div class="irow"><div class="g2">'+[["number","Số tài khoản"],["bank","Ngân hàng"],["branch","Chi nhánh"],["holder","Tên chủ tài khoản"]].map(([k,t])=>'<div class="f"><label>'+t+'</label><input class="in" data-bk="'+i+'" data-k="'+k+'" value="'+esc(b[k]||"")+'"></div>').join("")+'</div><button class="btn sm bad" data-brm="'+i+'">Xóa tài khoản</button></div>').join("")
   +'<button class="btn sm" id="bAdd">＋ Thêm tài khoản</button>'
   +'<div class="f" style="margin-top:10px"><label>Ghi chú nội bộ</label><input class="in" data-cf="note" value="'+esc(c.note||"")+'"></div>'
   +'<label class="row"><input type="checkbox" id="cAct"'+(c.active?" checked":"")+'> Cho chọn khi tạo báo giá</label>'
   +'<div class="row" style="margin-top:12px"><button class="btn pri" id="cSave">Lưu</button></div></div>';
  $$("[data-cf]").forEach(e=>e.oninput=()=>{ c[e.dataset.cf]=e.value; $("#cMsg").textContent="Chưa lưu"; });
  $$("[data-bk]").forEach(e=>e.oninput=()=>{ c.banks[+e.dataset.bk][e.dataset.k]=e.value; $("#cMsg").textContent="Chưa lưu"; });
  $$("[data-brm]").forEach(b=>b.onclick=()=>{ c.banks.splice(+b.dataset.brm,1); draw(); $("#cMsg").textContent="Chưa lưu"; });
  $("#bAdd").onclick=()=>{ c.banks.push({number:"",bank:"",branch:"",holder:c.name||""}); draw(); };
  $("#cAct").onchange=e=>{ c.active=e.target.checked; };
  $("#cSave").onclick=async()=>{ const row={}; F.forEach(([k])=>row[k]=(c[k]||"").trim()||null); row.name=row.name||"Đơn vị chưa đặt tên"; row.note=(c.note||"").trim()||null; row.active=!!c.active;
   row.banks=c.banks.filter(b=>(b.number||"").trim()).map(b=>({number:b.number.trim(),bank:(b.bank||"").trim(),branch:(b.branch||"").trim(),holder:(b.holder||"").trim()})); row.updated_at=new Date().toISOString(); row.updated_by=ME.id;
   const {error}=await SB.from("sales_companies").update(row).eq("id",c.id); if(error){ $("#cMsg").textContent=errText(error); return; } Object.assign(c0,row); c.banks=QC.clone(row.banks); toast("Đã lưu"); draw(); $("#cMsg").textContent="Đã lưu"; };
 };
 draw();
}

// ---------- khởi động ----------
$("#qcss").textContent=QC.CSS;
$("#bLogout").onclick=logout;
SB=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
start();
</script>
