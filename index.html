  "Cấu trúc 3 tầng: Epic (mục tiêu lớn, ví dụ Ưu tiên 1 có mã trước 20/11) → Công việc (thường là một vùng hoặc một đầu việc) → Việc con (từng bước nhỏ, 1 người làm, 1 hạn).",
  "Tạo Epic: trang Công việc → \"Thêm Epic\". Tạo công việc trong Epic: bấm \"Thêm công việc\" ở cuối Epic. Tạo việc con: bấm dấu + ở cuối dòng công việc.",
  "Tên việc: động từ + kết quả, ví dụ \"Nộp hồ sơ cứng Quyết Tiến 1 cho Phòng Kinh tế\". Tránh tên chung chung như \"Làm hồ sơ\".",
  "RACI: R là người làm (một người), A là người chịu trách nhiệm cuối và nghiệm thu (một người), C là người cần hỏi ý kiến, I là người cần được báo.",
  "SMART: ghi kết quả cụ thể (S), đo bằng gì là đạt (M), cần gì để làm được (A), vì sao cần (R). Hạn hoàn thành là T, bắt buộc phải có.",
  "Chọn Độ ưu tiên (cao, vừa), Nhóm, Vùng trồng nếu việc gắn với một vùng. Ô \"Bên phụ trách\" sẽ hiện trong báo cáo gửi khách.",
  "Khung \"Góp ý SMART · RACI · độ rõ\" chấm điểm ngay khi bạn gõ. Cố đạt hết các mục xanh trước khi bấm Lưu."]},
 {k:"task-man",t:"Quản lý công việc hằng ngày",s:[
  "Tick ô vuông đầu dòng là đánh dấu Xong. Bỏ tick là mở lại. Việc xong tự vào báo cáo cuối ngày của bạn.",
  "Bấm vào tên việc để mở chi tiết: sửa hạn, đổi người, đổi trạng thái (Chưa làm, Đang làm, Chờ người khác, Xong), ghi mô tả.",
  "Bộ lọc: Việc của tôi; Đang mở, Quá hạn, Tất cả; theo người thực hiện (R); theo mức ưu tiên; theo ngày (sửa hôm nay, tạo hôm nay); theo nhóm.",
  "Cuối màn hình chi tiết việc có mục Lịch sử: ai tạo, ai sửa gần nhất, xong lúc nào. Owner và quản lý xem được từng lần sửa.",
  "Việc im lặng: việc đang làm hoặc sắp đến hạn mà 3 ngày không ai cập nhật sẽ bị đánh dấu. Chỉ cần mở việc và cập nhật trạng thái hoặc ghi chú.",
  "Không xóa việc làm sai hướng. Đổi tên hoặc ghi rõ \"không cần nữa\" để còn lịch sử."]},
 {k:"progress",t:"Theo dõi tiến độ: biểu đồ, đội, vướng mắc",s:[
  "Trang Công việc → \"Biểu đồ tiến độ\": Tuần này từng ngày; Tuần này theo người; Việc còn mở theo ngày (thực tế so với kế hoạch); Việc đến hạn theo tuần; Tiến độ theo người; Tiến độ từng epic.",
  "Chọn Phạm vi (một epic) và Ưu tiên để xem riêng phần quan trọng. Với biểu đồ tuần có thể xem tuần trước, tuần này, tuần sau.",
  "Đường thực tế nằm trên đường kế hoạch nghĩa là đang chậm. Thanh epic màu vàng là chậm hơn thời gian đã trôi qua, màu đỏ là quá hạn.",
  "Quản lý: ô \"Theo dõi cập nhật của đội\" trên Tổng quan cho biết ai có việc quá hạn, việc im lặng, chưa gửi báo cáo. Bấm tên để xem chi tiết và chép tin nhắc gửi Zalo.",
  "Trang Hỗ trợ → nút \"Vướng mắc\": gom mọi vướng mắc từ việc đang chờ, vướng của vùng và báo cáo 7 ngày gần nhất. Từ đó tạo yêu cầu hỗ trợ hoặc mở việc, mở vùng."]},
 {k:"plan",t:"Kế hoạch tuần: lên lịch, xếp buổi, dời việc",s:[
  "Kế hoạch là quyền riêng, Owner bật trong Quản trị › Tài khoản (ô \"Kế hoạch tuần\"). Người không có quyền vẫn thấy \"Lịch hôm nay của tôi\" ở Tổng quan.",
  "Dán lịch tuần: Công việc › Kế hoạch › \"Dán lịch tuần\". Đọc 6 quy tắc, bấm \"Chèn mẫu trống\", bấm tên vùng để chèn đúng chính tả. Dòng buổi ghi người đi trong ngoặc: \"Buổi sáng – Tên vùng (Huy):\".",
  "Bấm \"Tách lịch\" rồi duyệt từng dòng: vùng, người làm, gắn vào việc có sẵn hay tạo việc con mới. Dòng có ⚠ là có thể trùng: chọn gắn vào việc có sẵn hoặc bỏ tick. Chưa bấm Lưu thì chưa ghi gì.",
  "Khung vàng \"Việc có hạn tuần này, chưa xếp buổi\": bấm \"Xếp lịch\" để đặt ngày, buổi, người làm cho việc đã có trong trang Công việc.",
  "Không kịp thì bấm \"Dời\", chọn ngày mới và ghi lý do. Lý do tự vào báo cáo cuối ngày.",
  "\"Kế hoạch so với thực tế\": chọn ngày, bấm Sao chép để gửi nhóm Zalo (chỉ có tên việc, vùng).",
  "Tab \"Rà soát công việc\" (điều phối, quản lý): ai đang trễ và ảnh hưởng vùng nào; việc trùng, bị ẩn, lệch hạn cha con, thiếu người, thiếu hạn, dời nhiều lần."]},
 {k:"hoso",t:"Hồ sơ vùng trồng: bản cứng, ai giữ, Drive, FarmBase",s:[
  "Vào Vùng, khách hàng › Hồ sơ. Mỗi vùng theo dõi 10 bộ hồ sơ chính: CCCD, sổ đỏ, giấy ủy quyền, giấy đăng ký vùng trồng NQ36, hồ sơ liên kết đơn vị thu mua với hộ dân, khảo sát Trung Quốc, flycam, hình kho, thùng thuốc, bẫy, 5 bộ nhật ký canh tác, văn bản xã xác nhận kiểm tra vùng trồng.",
  "Mỗi ô có 3 chấm: C bản cứng, D đã scan lưu Drive, F đã nhập FarmBase. Xanh là xong, vàng là bản cứng còn thiếu một phần. Chữ nhỏ dưới ô là người hoặc nơi đang giữ bản cứng.",
  "Ghi nhanh: chọn chế độ Bản cứng, Drive, FarmBase hoặc Người giữ rồi bấm lần lượt các ô, không cần mở từng vùng. Chế độ Xem chi tiết thì bấm ô để mở hồ sơ của vùng.",
  "Bảng Tổng hợp cho biết mỗi loại hồ sơ đủ bao nhiêu vùng, bản cứng đang ở đâu. Bấm tên loại để chỉ xem vùng còn thiếu loại đó. Lọc Ai giữ bản cứng để biết một người đang cầm hồ sơ của những vùng nào.",
  "Có thể dán link thư mục Drive của vùng trong khung hồ sơ nếu cần. Nút Cập nhật bộ 19 thành phần đánh dấu Đã có và Scan cho các thành phần mà hồ sơ chính đã đủ bản cứng và đã lên Drive.",
  "Chỉ ghi trạng thái. Không ghi số CCCD, số sổ đỏ, số điện thoại bà con vào ghi chú."]},
 {k:"hsdrv",t:"Thư mục Drive của vùng và tải nhiều file lên",s:[
  "Mỗi vùng ưu tiên 1 và 2 có sẵn một thư mục trên Drive, chia 5 nhóm: 01 Bộ hồ sơ mã vùng trồng, 02 Hồ sơ nộp Trung Quốc, 03 CCCD, 04 Sổ đỏ, 05 Hình ảnh thực tế (Flycam, Kho thuốc, Thùng thuốc, Bẫy côn trùng).",
  "Nhóm 01 và 02 có 3 thư mục con: Bản xuất để ký (file in ra đưa dân), Bản scan đã ký (scan bản cứng đã ký), Ảnh bản cứng đã ký (chụp bộ hồ sơ có chữ ký làm bằng chứng).",
  "Hồ sơ › tab Thư mục Drive: bảng số file của từng thư mục, Rỗng là chưa có gì. Chọn một thư mục ở ô lọc rồi bấm Còn rỗng để biết vùng nào còn thiếu. Bấm số để mở đúng thư mục trên Drive.",
  "Tải lên: mở hồ sơ của vùng, phần Thư mục Drive, chọn thư mục rồi bấm Chọn ảnh, file để tải. Chọn được nhiều file một lần, ảnh lớn tự thu nhỏ, tên file có thêm ngày tải ở đầu. Đi thực địa thì mở việc của vùng (bay flycam, chụp kho và thùng thuốc, đặt bẫy, thu hoạch) và tải ngay trong việc đó.",
  "Vùng đã nối kho Drive thì không tick tay Đã scan lưu Drive nữa. Mục này chỉ xanh khi có file thật: CCCD, Sổ đỏ, Khảo sát TQ (Bản scan hồ sơ TQ), Flycam, Kho thùng bẫy lấy theo số file trong thư mục. Các loại còn lại (ủy quyền, NQ36, liên kết, nhật ký, xã xác nhận) xanh khi đã bấm Tải file lên ở đúng loại đó, file vào thư mục Bản scan đã ký.",
  "Xóa hết file trong thư mục trên Drive rồi bấm Quét lại thì mục tương ứng tự chuyển về chưa có.",
  "Liên kết theo mã thư mục, không theo tên. Đổi tên vùng trên web không làm mất liên kết; quản lý đổi tên thì thư mục vùng trên Drive cũng đổi theo, giữ mã Z ở đầu. Web không xóa, không di chuyển file trên Drive.",
  "Hệ thống chỉ đếm số file, không lưu tên file. Ảnh CCCD, sổ đỏ chỉ để trong thư mục 03, 04, không gửi nhóm Zalo."]},
 {k:"hsbc",t:"Theo dõi bản cứng đưa dân ký",s:[
  "Hồ sơ › tab Bản cứng đưa dân ký: mỗi vùng đi qua 6 bước: Đủ bìa, Đã in, Đưa dân ký, Đã lấy lại, Đã scan, Đã nộp. Bấm ô để đánh dấu xong (ghi ngày hôm nay), bấm lại để bỏ.",
  "Cột Việc tiếp theo tự gợi ý bước kế. Cột Cần hỏi gom các điểm vướng: hồ sơ cũ đang ở đâu, bìa ở đâu, hộ còn thiếu giấy, đưa dân ký quá 7 ngày chưa lấy lại (ô chuyển đỏ).",
  "Bước Đã scan tự tính xong khi thư mục Bản scan đã ký trên Drive có file.",
  "Mở vùng để ghi ngày từng bước, ai đang giữ hồ sơ, vị trí cụ thể, danh sách hộ còn thiếu (tick khi đã bổ sung), và chụp bản cứng đã ký tải thẳng lên Drive.",
  "Dán ghi chú nhanh: dán nguyên tin nhắn dạng \"Tên vùng: tình trạng\" mỗi dòng, bấm Xem trước để máy nhận vùng và bước (đủ bìa, in, đưa dân ký 5/11, chưa lấy lại, hồ sơ cũ đâu, bổ sung ông A), rồi bấm Ghi. Dòng không khớp vùng sẽ báo đỏ để ghi tay."]},
 {k:"zone",t:"Theo dõi tiến độ mã vùng trồng",s:[
  "Mỗi vùng đi qua 9 bước (0 đến 8): mở quan hệ xã, gom dân, khảo sát lô, thu giấy tờ, tập huấn và ký hồ sơ, xã kiểm tra, nộp hồ sơ chờ mã nội địa, phía Trung Quốc bổ sung, mã GACC và duy trì.",
  "Thanh 9 ô trên mỗi vùng: ô đậm là bước đã xong, ô vàng là bước đang làm. Trạng thái: Đúng tiến độ (lệch ≤ 2 ngày), Trễ nhẹ (3 đến 7 ngày), Trễ nặng (trên 7 ngày), Chờ cơ quan.",
  "Có 3 cổng kiểm soát: Cổng 1 sau bước 1 (chốt hình thức đứng mã trước khi ký giấy tờ), Cổng 2 sau bước 3 (đủ 100% giấy tờ), Cổng 3 sau bước 5 (xã xác nhận, hồ sơ rà chéo không lệch).",
  "Bấm vào vùng để mở chi tiết: tick checklist của bước hiện tại, chuyển bước, ghi việc tiếp theo, vướng mắc, cần ai hỗ trợ, dự kiến có mã, xã đã kiểm tra chưa.",
  "Trong chi tiết vùng có danh sách việc của vùng, nút tạo việc mới cho vùng, và mục \"Liên hệ của vùng\" (cán bộ xã, đối tác).",
  "Bấm \"Đã cập nhật hôm nay\" khi đã rà vùng mà không có thay đổi, để đội biết vùng vẫn đang được theo dõi.",
  "Lọc vùng theo tỉnh, xã, đơn vị, nhóm khách, ưu tiên, bước, người giữ, trạng thái. Nút \"Ưu tiên 1–2\" giúp tập trung vào vùng quan trọng."]},
 {k:"report",t:"Báo cáo nhanh và trang Báo cáo",s:[
  "Gửi: bấm \"Gửi báo cáo nhanh\" (Tổng quan, Nhân sự hoặc trang Báo cáo). 4 ô: hôm nay hoàn thành gì, đang vướng gì, dự kiến hoàn thiện gì, ngày mai làm ở đâu.",
  "Ô \"ngày mai làm ở đâu\" tự điền từ việc thực địa có hạn hôm sau. Đi công tác thì ghi rõ xã, vùng. Ở văn phòng thì ghi Văn phòng.",
  "Sửa được đến hết ngày. Sau 17h nếu chưa gửi, hệ thống tự mở form nhắc một lần.",
  "Trang Báo cáo → \"Hôm nay và hôm qua\": bảng ai đang ở đâu hôm nay, báo cáo của từng người, ai chưa gửi.",
  "Trang Báo cáo → \"Lịch sử\": xem lại mọi báo cáo, lọc theo người, khoảng ngày, tìm theo chữ (tên xã, vướng mắc)."]},
 {k:"support",t:"Hỗ trợ, Lịch, Nghỉ phép, Liên hệ, FAQ",s:[
  "Hỗ trợ: bấm \"Cần hỗ trợ\" trong chi tiết việc hoặc \"Gửi yêu cầu hỗ trợ\" trên trang Hỗ trợ. Ghi rõ cần gì, ai giúp, hạn. Người giúp cập nhật trạng thái và lý do nếu không hỗ trợ.",
  "Lịch: \"Lịch công tác và sự kiện\" để ghi lịch đi xã, họp, tập huấn. Lọc theo loại và thời gian.",
  "Lịch nháp tự tạo: việc có họp dân, tổ chức ký, sự kiện, tập huấn sẽ tự có Sự kiện nháp; việc thực địa (flycam, bẫy, kho thuốc, khảo sát, thu bìa, ký hồ sơ, làm việc với xã) tự có lịch Công tác nháp, gộp theo người, ngày, buổi, xã. Mở tab \"Nháp\" trong Lịch, kiểm tra rồi bấm \"Xác nhận lịch\". Việc dời ngày thì lịch nháp tự đổi theo.",
  "Nghỉ phép: trang Nhân sự → phần nghỉ phép. Gửi đơn nghỉ hoặc về sớm, quản lý duyệt. Bảng ngày công tự tính theo tháng.",
  "Liên hệ: danh bạ cán bộ xã, phường và đối tác. Bấm Gọi hoặc Zalo. Không lưu số điện thoại hay CCCD của nông hộ ở đây.",
  "FAQ: tra câu hỏi thường gặp về quy trình. Gửi câu hỏi mới, quản lý duyệt rồi mới hiện cho mọi người."]},
 {k:"week",t:"Tiến độ tuần: đội và cá nhân",s:[
  "Báo cáo › Thống kê › \"Tiến độ tuần của đội\": đánh giá Đúng nhịp, Hơi chậm hay Chậm, dự báo % hoàn thành đến Chủ Nhật theo tốc độ hiện tại.",
  "Thẻ số: việc trong tuần, đã xong, đến hạn tới hôm nay đã xong, đang trễ, tốc độ thực tế so với tốc độ cần đạt, số lần dời, tỷ lệ báo cáo nhanh.",
  "Biểu đồ: việc còn lại có đường dự báo; nhịp từng ngày (đến hạn so với hoàn thành); tiến độ theo người và theo Epic. Bấm tên người để xem tiến độ cá nhân.",
  "Chẩn đoán và gợi ý: tải không đều, làm dở quá nhiều, việc chưa xếp lịch, việc im lặng, trễ ở ưu tiên 1, người cần ghi nhận. Công cụ nhanh: tin nhắn tiến độ, động viên đội và danh sách cần gỡ cho họp 7h30.",
  "\"Tiến độ tuần cá nhân\": điểm 0 đến 100 (đúng hạn 45%, báo cáo 20%, tốc độ 25%, ít dời lịch 10%), dải từng ngày, điểm mạnh và điểm cần cải thiện.",
  "Quản lý chọn từng người để xem gợi ý hỗ trợ, 4 câu hỏi kèm cặp 1-1 (GROW), lời động viên soạn sẵn và 3 việc ưu tiên ngày mai để sao chép gửi riêng.",
  "Nhân viên tự xem tiến độ của mình và chép \"Kế hoạch 3 việc ngày mai\"."]},
 {k:"mgr",t:"Dành cho quản lý và owner",s:[
  "Báo cáo khách: trang Công ty (mở đơn vị) hoặc Thống kê → Báo cáo khách. Có thể gộp nhiều đơn vị, tải file Word gửi khách. Báo cáo khách không hiện CCCD, sổ đỏ, số điện thoại nông hộ hay chi phí nội bộ.",
  "Nhật ký hoạt động: menu Quản trị › Nhật ký (hoặc bấm tên của bạn → Nhật ký hoạt động). Xem ai đăng nhập, thêm, sửa, xóa gì. Nhật ký không ghi số tiền.",
  "Owner: Tổng quan → \"Xuất dữ liệu\" để tải Excel hoặc JSON: công việc, vùng trồng, tổng hợp và toàn bộ nội dung khác (lịch, báo cáo nhanh, nghỉ phép, hỗ trợ, FAQ, liên hệ, nhân sự, công ty, hợp đồng không số tiền). Bấm \"Chọn tất cả\" để xuất trọn bộ.",
  "Owner: Quản trị › Tài khoản để tạo tài khoản, đổi vai trò, khóa tài khoản, bật quyền Tài chính và quyền Kế hoạch tuần.",
  "Trang Hướng dẫn có nút \"Tải file hướng dẫn (PDF)\" để in hoặc gửi đào tạo nhân sự mới.",
  "Số tiền hợp đồng chỉ hiện với tài khoản có quyền tài chính."]},

function auditPeople(){ const t0=todayStr(), wk=wkStart(t0), we=addDays(wk,6), R={};

    if(t.status!=="done"){ r.open++; if(t.due&&t.due>=wk&&t.due<=we) r.week++; if(t.due&&t.due<t0){ const d=Math.round((new Date(t0)-new Date(t.due))/864e5); r.late.push([id,t,d]); r.days=Math.max(r.days,d); if(t.zone){ r.zones.add(t.zone); if(S.zones[t.zone]?.priority==="1") r.u1++; } else if(t.prio==="1") r.u1++; } }

  let h='<div class="row between"><div><h1>FAQ</h1><div class="sub">Câu hỏi thường gặp đã được duyệt, dùng thống nhất khi trả lời bà con, khách hàng. Ai cũng đặt được câu hỏi và góp câu trả lời; quản lý duyệt bản cuối thì câu hỏi thành FAQ.</div></div><button class="btn pri" id="addFaq">Đặt câu hỏi</button></div>';
  h+='<div class="row" style="margin-top:10px;flex-wrap:wrap" role="tablist">'+[["ok","Đã duyệt"],["open","Chờ trả lời"],["rev","Chờ duyệt"]].map(([k,l])=>'<button class="cp" role="tab" data-ftab="'+k+'" aria-pressed="'+(F.tab===k)+'">'+l+' · '+lists[k].length+'</button>').join("")+'</div>';
  h+='<div class="filters"><input id="fq" type="search" placeholder="Tìm câu hỏi, từ khóa (không cần dấu)" value="'+esc(F.q)+'" style="flex:1 1 220px;min-width:0"><select id="fcat" aria-label="Chủ đề"><option value="">Mọi chủ đề</option>'+Object.entries(FCAT).map(([k,l])=>'<option value="'+k+'"'+(F.cat===k?" selected":"")+'>'+l+'</option>').join("")+'</select><select id="faud" aria-label="Ai hỏi"><option value="">Mọi đối tượng</option>'+Object.entries(FAUD).map(([k,l])=>'<option value="'+k+'"'+(F.aud===k?" selected":"")+'>'+l+'</option>').join("")+'</select></div>';
  const rows=lists[F.tab].filter(([,f])=>faqMatch(f)).sort((a,b)=>F.tab==="ok"?((Object.keys(FCAT).indexOf(a[1].cat||"khac")-Object.keys(FCAT).indexOf(b[1].cat||"khac"))||(a[1].order||99)-(b[1].order||99)||(a[1].q||"").localeCompare(b[1].q||"","vi")):(b[1].createdAt||"").localeCompare(a[1].createdAt||""));
  if(!rows.length) return h+'<div class="empty" style="margin-top:12px">'+(F.q||F.cat||F.aud?'Không có câu hỏi khớp bộ lọc.':F.tab==="ok"?'Chưa có FAQ nào được duyệt.':F.tab==="open"?'Không còn câu hỏi chờ trả lời.':'Không có câu trả lời nào chờ duyệt.')+'</div>';
  h+='<div class="list" style="margin-top:12px">';
  if(F.tab==="ok"){
    rows.forEach(([id,f])=>{ const o=!!ui.open["f_"+id];
      h+='<div class="panel" style="padding:0"><button class="faqq" data-fopen="'+id+'" aria-expanded="'+o+'"><span style="flex:1;min-width:0;text-align:left;font-weight:600">'+esc(f.q)+'</span><span class="pill">'+esc(FCAT[f.cat]||"Khác")+'</span><span aria-hidden="true">'+(o?"−":"+")+'</span></button>'
       +(o?'<div style="padding:0 14px 12px"><div style="white-space:pre-wrap;line-height:1.55">'+esc(f.final||"")+'</div><div class="sub" style="margin-top:8px">'+esc(FAUD[f.aud]||"")+(f.source?' · Nguồn: '+esc(f.source):'')+(f.approvedBy?' · Duyệt: '+esc(pname(f.approvedBy)||"quản lý"):'')+(f.approvedAt?' '+dmy(f.approvedAt.slice(0,10)):'')+(f.pendingEdit?' · <span class="pill warn">có đề xuất sửa chờ duyệt</span>':'')+'</div><div class="row" style="margin-top:8px"><button class="btn sm" data-fcopy="'+id+'">Sao chép</button><button class="btn sm" data-fedit="'+id+'">'+(M?'Sửa, duyệt lại':'Đề xuất sửa')+'</button></div></div>':'')+'</div>'; });
  } else {
    rows.forEach(([id,f])=>{ const n=(f.answers||[]).length;
      h+='<button class="panel faqc" data-fedit="'+id+'"><div style="font-weight:600;text-align:left">'+esc(f.q)+'</div><div class="sub" style="text-align:left;margin-top:4px">'+esc(FCAT[f.cat]||"Khác")+' · '+esc(FAUD[f.aud]||"")+' · '+(f.askedBy?esc(pname(f.askedBy))+' hỏi':'')+(f.createdAt?' '+dmy(f.createdAt.slice(0,10)):'')+' · '+(n?n+' câu trả lời':'chưa có câu trả lời')+(f.pendingEdit?' · đề xuất sửa FAQ đã duyệt':'')+'</div></button>'; });
  }
  return h+'</div>';
}
function openFaq(id){ ui.drawer=()=>drawFaq(id); drawFaq(id); }
function drawFaq(id){
  const M=canManage(); const f=id?S.faqs[id]:null; if(id&&!f){closeDrawer();return;}
  const catSel=v=>'<select id="f_cat">'+Object.entries(FCAT).map(([k,l])=>'<option value="'+k+'"'+(v===k?" selected":"")+'>'+l+'</option>').join("")+'</select>';
  const audSel=v=>'<select id="f_aud">'+Object.entries(FAUD).map(([k,l])=>'<option value="'+k+'"'+(v===k?" selected":"")+'>'+l+'</option>').join("")+'</select>';
  let h='<div class="dh"><div style="min-width:0"><h2>'+(id?'Câu hỏi FAQ':'Đặt câu hỏi mới')+'</h2>'+(id?'<div class="sub">'+({open:"Chờ trả lời",review:"Chờ quản lý duyệt",approved:"Đã duyệt"}[f.status||"open"])+(f.pendingEdit?' · có đề xuất sửa':'')+'</div>':'')+'</div><button class="btn sm" data-close>Đóng</button></div><div class="db">';
  if(!id){
    h+='<form id="fnew" class="grid" style="gap:8px"><div class="f"><label for="f_q">Câu hỏi (viết như bà con, khách hay hỏi)</label><textarea id="f_q" rows="2" required></textarea></div><div class="f2"><div class="f"><label for="f_cat">Chủ đề</label>'+catSel("msvt")+'</div><div class="f"><label for="f_aud">Ai hay hỏi</label>'+audSel("nongdan")+'</div></div><div class="f"><label for="f_a">Câu trả lời gợi ý (không bắt buộc)</label><textarea id="f_a" rows="4" placeholder="Để trống nếu cần người khác trả lời"></textarea></div><div class="alert">Không ghi CCCD, số sổ đỏ, số điện thoại bà con hay chi phí nội bộ vào FAQ.</div><div class="row"><button class="btn pri">Gửi câu hỏi</button></div></form></div>';
    showDrawer(h); return;
  }
  const canEditQ=M||(f.askedBy&&f.askedBy===me);
  h+=(canEditQ?'<div class="f"><label for="f_q">Câu hỏi</label><textarea id="f_q" rows="2">'+esc(f.q||"")+'</textarea></div><div class="f2"><div class="f"><label for="f_cat">Chủ đề</label>'+catSel(f.cat)+'</div><div class="f"><label for="f_aud">Ai hay hỏi</label>'+audSel(f.aud)+'</div></div><div class="row"><button class="btn sm" id="fsaveq">Lưu câu hỏi</button></div>'
       :'<p style="font-weight:600;font-size:16px;margin:0">'+esc(f.q)+'</p><div class="sub">'+esc(FCAT[f.cat]||"")+' · '+esc(FAUD[f.aud]||"")+(f.askedBy?' · '+esc(pname(f.askedBy))+' hỏi':'')+'</div>');
  if(f.status==="approved") h+='<h3 style="margin:14px 0 6px">Bản đang dùng</h3><div class="panel" style="white-space:pre-wrap;line-height:1.55">'+esc(f.final||"")+'</div>';
  const ans=f.answers||[];
  h+='<h3 style="margin:14px 0 6px">'+(f.status==="approved"?'Đề xuất sửa':'Câu trả lời của nhân sự')+' ('+ans.length+')</h3>';
  h+=ans.length?ans.map((a,i)=>'<div class="panel" style="margin-bottom:6px"><div class="sub">'+esc(pname(a.by)||"Ẩn danh")+(a.at?' · '+dmy(a.at.slice(0,10)):'')+'</div><div style="white-space:pre-wrap;margin-top:4px">'+esc(a.text)+'</div><div class="row" style="margin-top:6px">'+(M?'<button class="btn sm" data-fpick="'+i+'">Dùng làm bản cuối</button>':'')+((M||a.by===me)?'<button class="btn sm" data-frm="'+i+'">Xóa</button>':'')+'</div></div>').join(""):'<div class="sub">Chưa có ai trả lời.</div>';
  h+='<div class="f" style="margin-top:8px"><label for="f_new">'+(f.status==="approved"?'Đề xuất nội dung sửa':'Câu trả lời của bạn')+'</label><textarea id="f_new" rows="4" placeholder="'+(me?'Viết ngắn, đúng dữ kiện, không hứa ngày có mã':'Chọn tên của bạn ở góc trên trước')+'"></textarea></div><div class="row"><button class="btn" id="fans">Gửi</button></div>';
  if(M){
    h+='<div class="panel" style="margin-top:14px;border-color:var(--brand)"><h3 style="margin:0 0 6px">Quản lý duyệt</h3><div class="f"><label for="f_final">Nội dung cuối (bà con, khách đọc được)</label><textarea id="f_final" rows="7">'+esc(f.final||(ans.length?ans[ans.length-1].text:""))+'</textarea></div><div class="f"><label for="f_src">Nguồn, căn cứ</label><input id="f_src" value="'+esc(f.source||"")+'" placeholder="Ví dụ: Quy trình v2.0, NQ 36/2026"></div><div class="row" style="flex-wrap:wrap"><button class="btn pri" id="fapp">'+(f.status==="approved"?'Lưu bản đã duyệt':'Duyệt thành FAQ')+'</button>'+(f.status==="approved"?'<button class="btn" id="funpub">Gỡ khỏi FAQ</button>':'')+'<button class="btn" id="fdel">Xóa câu hỏi</button></div></div>';
  }
  h+='</div>'; showDrawer(h);
  const L=$("#layer");
  $("#fsaveq")?.addEventListener("click",async()=>{ const q=$("#f_q").value.trim(); if(!q){toast("Câu hỏi đang trống");return;} if(await upd("faqs",id,{q,cat:$("#f_cat").value,aud:$("#f_aud").value})) toast("Đã lưu câu hỏi"); });
  $("#fans").addEventListener("click",async()=>{ const t=$("#f_new").value.trim(); if(!t) return; if(!me){toast("Chọn tên của bạn ở góc trên trước");return;}
    const cur=S.faqs[id]||f; const a=[...(cur.answers||[]),{by:me,text:t,at:new Date().toISOString()}];
    const patch={answers:a}; if(cur.status==="approved") patch.pendingEdit=true; else patch.status="review";
    if(await upd("faqs",id,patch)) toast(cur.status==="approved"?"Đã gửi đề xuất, chờ quản lý duyệt":"Đã gửi câu trả lời, chờ quản lý duyệt"); });
  L.querySelectorAll("[data-fpick]").forEach(b=>b.addEventListener("click",()=>{ $("#f_final").value=ans[+b.dataset.fpick].text; taFit($("#f_final")); $("#f_final").focus(); }));
  L.querySelectorAll("[data-frm]").forEach(b=>b.addEventListener("click",async()=>{ if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Bấm lần nữa để xóa";return;} const cur=S.faqs[id]||f; const a=[...(cur.answers||[])]; a.splice(+b.dataset.frm,1); const patch={answers:a}; if(cur.status!=="approved"&&!a.length) patch.status="open"; if(cur.status==="approved"&&!a.length) patch.pendingEdit=false; await upd("faqs",id,patch); }));
  $("#fapp")?.addEventListener("click",async()=>{ const fin=$("#f_final").value.trim(); if(!fin){toast("Nội dung cuối đang trống");return;}
    const patch={final:fin,source:$("#f_src").value.trim(),status:"approved",pendingEdit:false,approvedBy:me||"",approvedAt:new Date().toISOString(),answers:[]};
    if($("#f_q")){ const q=$("#f_q").value.trim(); if(q){ patch.q=q; patch.cat=$("#f_cat").value; patch.aud=$("#f_aud").value; } }
    if(await upd("faqs",id,patch)){ toast("Đã duyệt thành FAQ"); closeDrawer(); } });
  $("#funpub")?.addEventListener("click",async()=>{ if(await upd("faqs",id,{status:"review"})) toast("Đã gỡ, chuyển về chờ duyệt"); });
  $("#fdel")?.addEventListener("click",async e=>{ const b=e.currentTarget; if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Bấm lần nữa để xóa";return;} if(await del("faqs",id)){ toast("Đã xóa"); closeDrawer(); } });
}
function newFaq(){ ui.drawer=null; drawFaq(null);
  $("#fnew").addEventListener("submit",async e=>{ e.preventDefault(); const q=$("#f_q").value.trim(); if(!q) return; if(!me){toast("Chọn tên của bạn ở góc trên trước");return;}
    const a=$("#f_a").value.trim(); const now=new Date().toISOString();
    const d={q,cat:$("#f_cat").value,aud:$("#f_aud").value,status:a?"review":"open",answers:a?[{by:me,text:a,at:now}]:[],askedBy:me,createdAt:now,final:"",source:""};
    if(await put("faqs","f"+uid(),d)){ toast(a?"Đã gửi, chờ quản lý duyệt":"Đã gửi câu hỏi, chờ mọi người trả lời"); ui.fq.tab=a?"rev":"open"; saveUi(); closeDrawer(); render(); } });
}
/* ---------- binding ---------- */
function bindView(){
  const A=$("#app");
  A.querySelectorAll("[data-zone]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();openZone(b.dataset.zone)}));
  A.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{ const [k,v]=b.dataset.go.split("="); Object.assign(ui.zf,{q:"",prov:"",ward:"",unit:"",grp:"",pri:"",step:"",owner:"",st:"",hidden:false}); ui.zf[k]=v; saveUi(); location.hash="vung"; }));
  A.querySelectorAll("[data-focus]").forEach(b=>b.addEventListener("click",()=>{ ui.focus=b.dataset.focus==="1"; saveUi(); render(); }));
  if(ui.view==="thong-ke") bindStats(A);
  if(ui.view==="nhat-ky") bindLog(A);
  if(ui.view==="api") bindApi(A);
  if(ui.view==="thu-chi") bindExp(A);
  if(ui.view==="doi-soat") bindRecon(A);
  if(ui.view==="tai-khoan"){ $("#accAdd")?.addEventListener("click",()=>openAcc(null)); $("#accBulk")?.addEventListener("click",openBulk); A.querySelectorAll("[data-acc]").forEach(r=>r.addEventListener("click",()=>openAcc(r.dataset.acc))); $("#impJson")?.addEventListener("change",e=>{ const f=e.target.files[0]; e.target.value=""; if(f) importJson(f); }); }
  if(ui.view==="ho-tro") bindSupport(A);
  if(ui.view==="bao-cao") bindReports(A);
  if(ui.view==="ke-hoach") bindPlan(A);
  if(ui.view==="huong-dan") bindGuide(A);
  if(ui.view==="nhan-su") bindAtt(A);
  if(ui.view==="lien-he") bindContacts(A);
  if(ui.view==="faq"){
    $("#addFaq")?.addEventListener("click",newFaq);
    A.querySelectorAll("[data-ftab]").forEach(b=>b.addEventListener("click",()=>{ ui.fq.tab=b.dataset.ftab; saveUi(); render(); }));
    A.querySelectorAll("[data-fopen]").forEach(b=>b.addEventListener("click",()=>{ const k="f_"+b.dataset.fopen; ui.open[k]=!ui.open[k]; render(); }));
    A.querySelectorAll("[data-fedit]").forEach(b=>b.addEventListener("click",()=>openFaq(b.dataset.fedit)));
    A.querySelectorAll("[data-fcopy]").forEach(b=>b.addEventListener("click",async()=>{ const f=S.faqs[b.dataset.fcopy]; try{ await navigator.clipboard.writeText(f.q+"\n"+f.final); toast("Đã sao chép, dán vào Zalo được"); }catch(e){ toast("Trình duyệt chặn sao chép"); } }));
    $("#fq")?.addEventListener("input",e=>{ ui.fq.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#fq"); n.focus(); try{n.setSelectionRange(pos,pos)}catch(_){} });
    $("#fcat")?.addEventListener("change",e=>{ ui.fq.cat=e.target.value; saveUi(); render(); });
    $("#faud")?.addEventListener("change",e=>{ ui.fq.aud=e.target.value; saveUi(); render(); });
  }
  $("#expAll")?.addEventListener("click",async()=>{ const blob=new Blob([JSON.stringify({app:"bvi-dieu-hanh",exportedAt:new Date().toISOString(),collections:S})],{type:"application/json"}); const fn="bvi-du-lieu-"+todayStr()+".json";
    if(dlNs){ try{ await dlNs.save({filename:fn,data:blob}); toast("Đã lưu file dữ liệu"); }catch(e){ if(e?.code!=="declined") toast("Không lưu được: "+(e?.message||e?.code||"")); } return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fn; a.click(); });
  if(ui.view==="cong-ty"){ $("#addU")?.addEventListener("click",()=>openUnit(null)); A.querySelectorAll("[data-u]").forEach(r=>r.addEventListener("click",()=>openUnit(r.dataset.u))); }
  if(ui.view==="vung"){
    $("#pickBtn")?.addEventListener("click",()=>{ ui.pick=!ui.pick; render(); });
    A.querySelectorAll("[data-setpri]").forEach(b=>b.addEventListener("click",async e=>{ e.stopPropagation(); const [zid,v]=b.dataset.setpri.split("|"); await upd("zones",zid,{priority:v,...stamp()}); }));
    const map={zq:"q",zprov:"prov",zward:"ward",zunit:"unit",zgrp:"grp",zpri:"pri",zstep:"step",zowner:"owner",zst:"st"};
    Object.entries(map).forEach(([id,k])=>{ const el=$("#"+id); el?.addEventListener(id==="zq"?"input":"change",()=>{ ui.zf[k]=el.value; saveUi(); const pos=el.selectionStart; render(); if(id==="zq"){const n=$("#zq");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}} }); });
    $("#zhid")?.addEventListener("change",e=>{ui.zf.hidden=e.target.checked;saveUi();render();});
    $("#zclear")?.addEventListener("click",()=>{Object.assign(ui.zf,{q:"",prov:"",ward:"",unit:"",grp:"",pri:"",step:"",owner:"",st:"",hidden:false});saveUi();render();});
    $("#addZone")?.addEventListener("click",newZone);
    $("#impZ")?.addEventListener("change",async e=>{ const f=e.target.files[0]; e.target.value=""; if(f) await startImport(f); });
  }
  if(ui.view==="cong-viec"){
    $("#tmine")?.addEventListener("change",e=>{ui.tf.mine=e.target.checked;render();});
    $("#tst")?.addEventListener("change",e=>{ui.tf.st=e.target.value;render();});
    $("#tteam")?.addEventListener("change",e=>{ui.tf.team=e.target.value;render();});
    $("#tpr")?.addEventListener("change",e=>{ui.tf.pr=e.target.value;render();});
    $("#tfR")?.addEventListener("change",e=>{ui.tf.r=e.target.value;render();});
    $("#tday")?.addEventListener("change",e=>{ui.tf.day=e.target.value; if(ui.tf.day) ui.tf.st="all"; render();});
    $("#tpl")?.addEventListener("change",e=>{ui.tf.pl=e.target.value; render();});
    $("#chartBtn")?.addEventListener("click",openCharts);
    $("#addEpic")?.addEventListener("click",()=>openTask(null,{kind:"epic"}));
    $("#raciBtn")?.addEventListener("click",raciMatrix);
    A.querySelectorAll("[data-epic-toggle]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.epicToggle; ui.epicOpen[k]=ui.epicOpen[k]===false; render();}));
    A.querySelectorAll("[data-edit-task]").forEach(b=>b.addEventListener("click",()=>openTask(b.dataset.editTask)));
    A.querySelectorAll("[data-add-child]").forEach(b=>b.addEventListener("click",()=>{ const p=S.tasks[b.dataset.addChild]; openTask(null,{parent:b.dataset.addChild,kind:p.kind==="epic"?"task":"sub",zone:p.zone||null}); }));
    A.querySelectorAll("[data-done]").forEach(c=>c.addEventListener("change",()=>upd("tasks",c.dataset.done,{status:c.checked?"done":"doing",doneAt:c.checked?new Date().toISOString():null,...stamp()})));
  }
  if(ui.view==="hop-dong"){ $("#addC")?.addEventListener("click",()=>openContract(null)); A.querySelectorAll("[data-c]").forEach(r=>r.addEventListener("click",()=>openContract(r.dataset.c))); }
  if(ui.view==="nhan-su"){
    $("#addP")?.addEventListener("click",()=>openPerson(null));
    A.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>openPerson(b.dataset.p)));
    $("#dday")?.addEventListener("change",e=>{ui.dday=e.target.value;render();});
  }
  A.querySelectorAll("[data-quick]").forEach(b=>b.addEventListener("click",openQuick));
  if(ui.view==="tong-quan"){ bindTaskLinks(A); maybeNudge(); bindExpFile(A); }
  A.querySelectorAll("[data-newleave]").forEach(b=>b.addEventListener("click",openLeave));
  A.querySelectorAll("[data-ldec]").forEach(b=>b.addEventListener("click",async()=>{ if(!canLeave()){ toast("Bạn chưa được giao quyền duyệt nghỉ"); return; } const [lid,st]=b.dataset.ldec.split("|"); if(await upd("leaves",lid,{status:st,decidedBy:me||"",decidedAt:new Date().toISOString()})) toast(LST[st]); }));
  A.querySelectorAll("[data-ldel]").forEach(b=>b.addEventListener("click",async()=>{ if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Bấm lần nữa để rút";return;} if(await del("leaves",b.dataset.ldel)) toast("Đã rút đơn"); }));
  A.querySelectorAll("[data-ev]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();openEvent(b.dataset.ev);}));
  if(ui.view==="lich"){
    A.querySelectorAll("[data-newev]").forEach(b=>b.addEventListener("click",()=>openEvent(null,{kind:b.dataset.newev})));
    A.querySelectorAll("[data-ewhen]").forEach(b=>b.addEventListener("click",()=>{ui.ef.when=b.dataset.ewhen;render();}));
    $("#ekind")?.addEventListener("change",e=>{ui.ef.kind=e.target.value;render();});
    $("#emine")?.addEventListener("change",e=>{ui.ef.mine=e.target.checked;render();});
  }
  if(ui.view==="khach"){
    $("#docxRep")?.addEventListener("click",exportCustDocx); bindShare();
    $("#custSel")?.addEventListener("change",e=>{ui.cust=e.target.value;render();});
    document.querySelectorAll("[data-custadd]").forEach(c=>c.addEventListener("change",()=>{ const k=c.dataset.custadd; const a=new Set(ui.custAdd||[]); c.checked?a.add(k):a.delete(k); ui.custAdd=[...a]; render(); }));
    $("#copyRep")?.addEventListener("click",()=>{ const t=custSummary(); navigator.clipboard.writeText(t).then(()=>toast("Đã sao chép tóm tắt"),()=>{ showDrawer('<div class="dh"><h2>Tóm tắt gửi khách</h2><button class="btn sm" data-close>Đóng</button></div><div class="db"><textarea rows="18" style="width:100%">'+esc(t)+'</textarea><div class="sub">Chọn toàn bộ rồi sao chép.</div></div>'); ui.drawer=()=>{}; }); });
  }
}
boot();
