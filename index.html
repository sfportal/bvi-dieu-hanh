<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>BVI Điều hành</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar + tabs on desktop, bottom nav on phone; content as working lists, drawer for detail. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece5; --line:#d5dbd1; --fg:#17201a; --muted:#5b6a5f;
  --brand:#1f5b3c; --brand-ink:#ffffff; --done:#1f5b3c; --doing:#e2a516; --todo:#ffffff;
  --good:#2f7d4f; --warn:#b7791f; --bad:#b83a2e; --info:#2f5f8a; --chip:#eef2ea;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201b; --sunk:#0d120f; --line:#2b362f; --fg:#e7ede8; --muted:#9aaa9f;
  --brand:#5fb184; --brand-ink:#0d1a12; --done:#5fb184; --doing:#e8b53a; --todo:#18201b;
  --good:#5fb184; --warn:#e0a33f; --bad:#e2685b; --info:#7fb0dc; --chip:#202a23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201b; --sunk:#0d120f; --line:#2b362f; --fg:#e7ede8; --muted:#9aaa9f;
  --brand:#5fb184; --brand-ink:#0d1a12; --done:#5fb184; --doing:#e8b53a; --todo:#18201b;
  --good:#5fb184; --warn:#e0a33f; --bad:#e2685b; --info:#7fb0dc; --chip:#202a23; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--doing);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;padding-block:10px;max-width:1280px;margin:0 auto}
.logo{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{display:inline-grid;grid-template-columns:repeat(3,6px);gap:2px}
.logo i b{width:6px;height:6px;border-radius:1px;background:var(--done)}
.logo i b.y{background:var(--doing)} .logo i b.w{background:var(--todo);outline:1px solid var(--line)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
nav.tabs a{padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--chip);color:var(--fg)}
.me{display:flex;align-items:center;gap:8px;white-space:nowrap}
.me select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;max-width:150px}
main{max-width:1280px;margin:0 auto;padding-block:16px 96px}
h1{font-size:20px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
button.tile:hover{border-color:var(--brand)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:12px;letter-spacing:.02em}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)} .tile.good .v{color:var(--good)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.cols{display:grid;gap:12px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.funnel{display:grid;gap:6px}
.frow{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:13px;background:none;border:0;padding:2px 0;text-align:left}
.frow:hover .fname{color:var(--brand)}
.fbar{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.fbar span{display:block;height:100%}
.n{font-variant-numeric:tabular-nums;text-align:right}
.bar9{display:inline-grid;grid-template-columns:repeat(9,14px);gap:2px;vertical-align:middle}
.bar9 b{height:14px;border-radius:2px;background:var(--todo);outline:1px solid var(--line);outline-offset:-1px;font-size:9px;line-height:14px;text-align:center;color:var(--muted);font-weight:500}
.bar9 b.d{background:var(--done);outline-color:var(--done);color:var(--brand-ink)}
.bar9 b.c{background:var(--doing);outline-color:var(--doing);color:#2a1d00}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--chip);white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--info)}
.pill.grp{font-weight:700;min-width:22px;justify-content:center}
.pill.A{background:var(--brand);color:var(--brand-ink)} .pill.B{background:var(--chip);color:var(--brand);outline:1px solid var(--brand);outline-offset:-1px} .pill.C{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filters input,.filters select,.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.list{display:flex;flex-direction:column;gap:6px}
.zone{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.zone:hover{border-color:var(--brand)}
.zone .nm{font-weight:600;overflow-wrap:anywhere}
.zone .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.zone .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media (max-width:640px){.zone{grid-template-columns:28px minmax(0,1fr)}.zone .rt{grid-column:2;align-items:flex-start}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.alert{padding:10px 12px;border-radius:8px;background:var(--chip);font-size:13px}
.alert.bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.tw{overflow-x:auto}
.mono{font-family:var(--f-mono);font-size:12px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.db{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.f{display:grid;gap:4px}
.f label{font-size:12px;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.f2{grid-template-columns:1fr}}
.steps{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font-weight:600;font-variant-numeric:tabular-nums}
.steps button.d{background:var(--done);color:var(--brand-ink);border-color:var(--done)}
.steps button.c{background:var(--doing);color:#2a1d00;border-color:var(--doing)}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.chk input{margin-top:3px}
.gate{border:1.5px solid var(--doing);border-radius:8px;padding:8px 10px;background:var(--surface)}
.mil{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;font-size:13px}
.mil .past{color:var(--muted)}
/* tasks */
.epic{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.epic>.eh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;width:100%;background:none;border:0;text-align:left}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:120px}
.prog span{display:block;height:100%;background:var(--done)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.trow.sub{padding-left:36px;background:var(--bg)}
.trow .t{display:flex;gap:8px;align-items:center;min-width:0}
.trow .t span.tt{overflow-wrap:anywhere}
.raci{display:inline-flex;gap:3px;flex-wrap:wrap}
.raci b{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--chip)}
.raci b.R{background:var(--brand);color:var(--brand-ink)} .raci b.A{outline:1px solid var(--brand);outline-offset:-1px;color:var(--brand)}
.st{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;background:var(--surface)}
.st.done{color:var(--good)} .st.doing{color:var(--warn)} .st.wait{color:var(--info)} .st.late{color:var(--bad)}
.matrix th,.matrix td{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi label{display:flex;gap:4px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surface)}
/* bottom nav */
nav.bot{display:none}
@media (max-width:760px){
  nav.tabs{display:none}
  nav.bot{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(40px,1fr);overflow-x:auto;scrollbar-width:none;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  nav.bot a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:9.5px;white-space:nowrap;letter-spacing:-.2px;color:var(--muted);text-decoration:none;min-height:52px;justify-content:center}
  nav.bot a[aria-current="page"]{color:var(--brand);font-weight:600}
  nav.bot svg{width:20px;height:20px}
  .me .lbl{display:none}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60;font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block;outline:1px solid var(--line);outline-offset:-1px}
.custhead{border-left:4px solid var(--brand);padding-left:12px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}
.focusbar{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.focusbar button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.focusbar button[aria-pressed=true]{background:var(--fg);color:var(--surface)}
.pickrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pickrow>.zone{flex:1 1 300px}
.pchips{display:flex;gap:4px}
.pchips button{min-width:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;font-size:13px}
.pchips button[aria-pressed=true]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.ev .dt{display:flex;flex-direction:column;align-items:center;border-radius:8px;background:var(--sunk);padding:4px 0;font-size:11px;color:var(--muted)}
.ev .dt b{font-size:18px;color:var(--fg);line-height:1.1}
.ev .nm{font-weight:600;overflow-wrap:anywhere}
.ev .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.dayh{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumbs figure{margin:0;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.thumbs img{display:block;width:100%;height:96px;object-fit:cover}
.thumbs .doc{display:flex;align-items:center;justify-content:center;height:96px;font-size:12px;padding:6px;text-align:center;overflow-wrap:anywhere}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:var(--surface);font-size:11px;padding:2px 6px}
.qr{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.docrow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px 8px;padding:9px 0;border-top:1px solid var(--line)}
.docrow .no{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);padding-top:2px}
.docrow .ctl{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dst{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dst button{border:0;background:var(--surface);padding:6px 10px;font-size:12.5px;font-weight:500;color:var(--muted)}
.dst button+button{border-left:1px solid var(--line)}
.dst button[aria-pressed=true].ok{background:var(--good);color:#fff}
.dst button[aria-pressed=true].fix{background:var(--warn);color:#fff}
.dst button[aria-pressed=true].none{background:var(--sunk);color:var(--fg);font-weight:600}
.cp{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chart{width:100%;min-width:520px;height:auto;display:block}.stv td:first-child{min-width:140px}.chart text{fill:var(--muted);font-size:11px}.chart .lbl{fill:var(--fg);font-weight:600}.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.kv i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
[hidden]{display:none!important}
.dqg{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;margin-top:6px}
.dq{position:relative;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:8px;padding:7px 0;font:600 13px/1 ui-monospace,monospace;cursor:pointer;min-height:34px}
.dq.ok{background:var(--good);border-color:var(--good);color:#fff}.dq.fix{background:var(--warn);border-color:var(--warn);color:#fff}
.dq i{position:absolute;top:1px;right:3px;font:700 9px/1 sans-serif;font-style:normal;opacity:.85}
label:has(> input[data-drive]){display:none}
a.btn{color:inherit;text-decoration:none}
.faqq{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.faqc{display:block;width:100%;cursor:pointer;font:inherit;color:inherit}
.cp[aria-pressed=true]{border-color:var(--brand);color:var(--brand);font-weight:600;background:var(--chip)}
.docbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);margin:6px 0 2px}
.docbar span{display:block;height:100%}
.chk-list{display:grid;gap:4px;margin-top:6px}
.chk-i{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;font-size:13px;align-items:start}
.chk-i .ic{font-weight:700;text-align:center}
.chk-i.ok .ic{color:var(--good)} .chk-i.warn .ic{color:var(--warn)} .chk-i.bad .ic{color:var(--bad)}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.ai-box{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:13px}
.trow .t{flex-wrap:wrap}
.trow .t .btn{flex:1 1 200px;min-width:0}
@media (max-width:760px){
  .trow{grid-template-columns:minmax(0,1fr)}
  .trow>.row{flex-wrap:wrap;gap:6px;padding-left:26px}
  .trow.sub{padding-left:24px}
}
</style>

</head><body>
<header class="top"><div class="topin wrap">
  <div class="logo"><i><b></b><b></b><b></b><b></b><b class="y"></b><b class="w"></b><b class="w"></b><b class="w"></b><b class="w"></b></i>BVI Điều hành</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="me" id="meBox"><button class="btn sm" id="meBtn" style="max-width:220px;overflow:hidden;text-overflow:ellipsis">Tài khoản</button><select id="meSel" hidden></select></div>
</div></header>
<main class="wrap" id="app"><div class="empty">Đang tải dữ liệu chung của đội…</div></main>
<nav class="bot" id="bot"></nav>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ---------- constants from Quy trình v2.0 ---------- */
const STEPS=[
 {n:0,name:"Mở quan hệ xã",ck:["Có công văn giới thiệu (HHSR hoặc công ty) gửi xã","Đã tổ chức sự kiện, buổi giới thiệu tại địa phương","Đã họp dân, có biên bản và ảnh","Đã lập nhóm Zalo chung của vùng"]},
 {n:1,name:"Gom dân, chốt hình thức",ck:["Có đại diện mã, thống nhất vai trò và chi phí","Tổng diện tích dự kiến từ 10 ha","Đã chốt hình thức đứng mã (1, 2 hoặc 3) trong biên bản","Hình thức 1: đơn vị đứng mã đã trả trước 50%","Đã loại lô tranh chấp, đất thuê không giấy tờ"]},

/* ---------- zone logic ---------- */
function grp(z){ if(!z.unitId&&!z.unit) return "C"; return z.ordered?"A":"B"; }
function nextMil(z){
  const st=z.step;
  if(st===null||st===undefined) return {label:"Xác định bước hiện tại",date:null};
  if(st>=7) return {label:st===7?"Chờ phía Trung Quốc":"Duy trì, hậu kiểm",date:null,wait:true};
  if(!z.T) return {label:"Chốt mốc T",date:null};
  if(st<=1) return {label:"Chốt danh sách, hình thức đứng mã",date:z.T};
  if(st===2) return {label:"Khảo sát xong",date:addDays(z.T,10)};
  if(st===3) return {label:"Chốt sổ lần 1",date:addDays(z.T,15)};
  if(st===4) return {label:"Tập huấn, ký hồ sơ xong",date:addDays(z.T,23)};
  if(st===5) return {label:"Xã kiểm tra",date:addDays(z.T,27)};
  if(st===6){ if(z.submitted) return {label:"Có mã nội địa (dự kiến)",date:addDays(z.submitted,15),wait:true}; return {label:"Nộp Cổng DVC",date:addDays(z.T,30)}; }
  return {label:"",date:null};
}
function zstatus(z){
  const m=nextMil(z);
  if(z.step===null||z.step===undefined) return {k:"unk",t:"Chưa rõ bước",c:"info",late:0,m};
  if(z.step>=7) return {k:"wait",t:z.step===7?"Chờ phía TQ":"Duy trì mã",c:"good",late:0,m};
  if(!m.date) return {k:"unk",t:"Chưa có mốc T",c:"info",late:0,m};
  const late=diffDays(todayStr(),m.date);
  if(m.wait) return {k:"wait",t:"Chờ cơ quan",c:"info",late:0,m};
  if(late<=2) return {k:"ok",t:late>0?"Đúng tiến độ (+"+late+"n)":"Đúng tiến độ",c:"good",late,m};
  if(late<=7) return {k:"warn",t:"Trễ nhẹ "+late+" ngày",c:"warn",late,m};
  return {k:"bad",t:"Trễ nặng "+late+" ngày",c:"bad",late,m};
}

  const ch=SB.channel("bvi-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    const r=p.new&&p.new.col?p.new:p.old; if(!r||!r.col) return; const o={...(RAW[r.col]||{})};
    if(p.eventType==="DELETE") delete o[r.id]; else o[r.id]=p.new.data; RAW[r.col]=o; rebuild(r.col); softRender(); });
  if(canFin()) ch.on("postgres_changes",{event:"*",schema:"public",table:"contract_fin"},p=>{ if(p.eventType==="DELETE") delete FIN[p.old.id]; else FIN[p.new.id]=p.new.data; rebuild("contracts"); softRender(); });
  ch.subscribe();
}

async function importJson(file){

  const C=j.collections||{}; const rows=[], fins=[];
  COLS.forEach(col=>Object.entries(C[col]||{}).forEach(([id,d])=>{ if(!d||typeof d!=="object") return; if(col==="contracts"){ const {pub,fin}=finSplit(d); rows.push({col,id,data:pub}); fins.push({id,data:fin}); } else rows.push({col,id,data:d}); }));
  if(!rows.length){ m.textContent="File không có dữ liệu."; return; }
  for(let i=0;i<rows.length;i+=200){ m.textContent="Đang ghi "+Math.min(i+200,rows.length)+"/"+rows.length+"…"; const {error}=await SB.rpc("import_docs",{p_rows:rows.slice(i,i+200)}); if(error){ m.textContent="Lỗi: "+error.message; return; } }
  if(fins.length){ const {error}=await SB.from("contract_fin").upsert(fins); if(error){ m.textContent="Đã ghi dữ liệu, nhưng lỗi phần tài chính: "+error.message; return; } }
  await logEv("import","nhập dữ liệu từ file "+file.name+": "+rows.length+" bản ghi"); await loadAll(); m.textContent="Đã chuyển "+rows.length+" bản ghi."; render();
}

const SILENT_DAYS=3;
function tTouch(t){ return dOf(t.updatedAt)||dOf(t.createdAt)||todayStr(); }
function tOpenKids(id){ return Object.values(S.tasks).some(x=>x.parent===id&&x.status!=="done"); }
function tSilent(t){ if(t.status==="done"||t.kind==="epic") return false; const idle=diffDays(todayStr(),tTouch(t)); return idle>=SILENT_DAYS&&(t.status==="doing"||tLate(t)||(t.due&&diffDays(t.due,todayStr())<=7)); }
function myOpen(pid){ return Object.entries(S.tasks).filter(([id,t])=>t.kind!=="epic"&&t.status!=="done"&&t.R===pid&&!tOpenKids(id)).sort((a,b)=>(tLate(b[1])?1:0)-(tLate(a[1])?1:0)||prRank(a[1])-prRank(b[1])||(a[1].due||"9").localeCompare(b[1].due||"9")); }
function workdaysBack(n){ const out=[]; let d=addDays(todayStr(),-1); while(out.length<n){ if(new Date(d+"T00:00:00").getDay()!==0) out.push(d); d=addDays(d,-1); } return out; }
function isReporter(pid){ const p=S.people[pid]; return p&&p.team!=="thuengoai"&&p.team!=="lead"&&p.active!==false; }
function todayPanel(){ if(!me||!S.people[me]) return '';

  const row=([id,t],i)=>'<div class="trow" style="padding-inline:0"><span class="t"><span class="pill" style="min-width:22px;justify-content:center">'+(i+1)+'</span><input type="checkbox" aria-label="Xong" data-tdone="'+id+'"><button class="btn sm" style="border:0;padding:0;background:none;text-align:left;font-weight:600" data-otask="'+id+'"><span class="tt">'+esc(t.title)+'</span></button>'+(t.zone&&S.zones[t.zone]?'<span class="pill">'+esc(zShort(S.zones[t.zone].name))+'</span>':'')+'</span><span class="row">'+prBadge(t)+(t.due?'<span class="sub mono">'+dm(t.due)+'</span>':'')+(t.status==="doing"?stBadge(t):'<button class="btn sm" data-tdoing="'+id+'">Bắt đầu</button>')+'</span></div>';
  let h='<div class="panel" style="margin-top:12px;border-left:4px solid var(--brand)"><div class="row between"><h2>Việc của '+esc(pname(me))+' hôm nay</h2><span class="row" style="gap:6px">'+(late?'<span class="pill bad">'+late+' quá hạn</span>':'')+'<span class="pill">'+L.length+' việc đang mở</span></span></div>';
  h+=top.length?'<div class="sub" style="margin:2px 0 4px">Làm theo thứ tự 1 → 3. Xong việc nào tick ngay việc đó.</div>'+top.map(row).join(""):'<div class="sub">Bạn chưa có việc nào đang mở.</div>';
  if(L.length>3) h+='<div class="sub" style="margin-top:4px">Còn '+(L.length-3)+' việc khác ở trang <a href="#cong-viec">Công việc</a>.</div>';
  if(sil.length) h+='<div class="alert warn" style="margin-top:8px">'+sil.length+' việc của bạn đã '+SILENT_DAYS+' ngày trở lên chưa cập nhật: '+sil.slice(0,4).map(([id,t])=>'<a href="#" data-otask="'+id+'">'+esc(t.title.slice(0,50))+'</a>').join(", ")+(sil.length>4?'…':'')+'. Mở việc, ghi tiến độ hoặc đổi trạng thái.</div>';
  if(!L.length&&!isReporter(me)) return '';
  return h+'</div>'; }
function teamWatchData(){ const days=workdaysBack(6), t0=todayStr();
  return Object.entries(S.people).filter(([k])=>isReporter(k)).map(([k,p])=>{ const L=myOpen(k); return {k,p,open:L.length,late:L.filter(([,t])=>tLate(t)),sil:L.filter(([,t])=>tSilent(t)),rep:!!S.daily[t0+"_"+k],miss:days.filter(d=>!S.daily[d+"_"+k]&&!Object.values(S.leaves).some(l=>l.person===k&&leaveOn(l,d)&&l.status!=="rejected")).length,doneWk:Object.values(S.tasks).filter(t=>t.R===k&&t.status==="done"&&tDone(t)>=addDays(t0,-6)).length}; })

function openWatch(k){ const r=teamWatchData().find(x=>x.k===k); if(!r) return; ui.drawer=()=>openWatch(k);
  const li=(arr,why)=>arr.map(([id,t])=>'<div class="trow" style="padding-inline:0"><span class="t"><button class="btn sm" style="border:0;padding:0;background:none;text-align:left" data-otask="'+id+'"><span class="tt">'+esc(t.title)+'</span></button></span><span class="row"><span class="sub">'+why(t)+'</span></span></div>').join("");
  const reps=workdaysBack(6).map(d=>'<span class="pill '+(S.daily[d+"_"+k]?"good":"")+'">'+dm(d)+'</span>').join("");
  const msg="Chào "+r.p.name+", em cập nhật giúp anh/chị: "+[r.late.length?r.late.length+" việc quá hạn":"",r.sil.length?r.sil.length+" việc "+SILENT_DAYS+" ngày chưa cập nhật":"",!r.rep?"báo cáo cuối ngày hôm nay":""].filter(Boolean).join(", ")+". Mở web BVI Điều hành, mục Tổng quan có sẵn danh sách.";
  showDrawer('<div class="dh"><div><h2>'+esc(r.p.name)+'</h2><div class="sub">'+r.open+' việc đang mở · '+r.doneWk+' việc xong trong 7 ngày</div></div><button class="btn sm" data-close>Đóng</button></div><div class="db">'
    +'<div class="panel"><h2>Báo cáo 6 ngày làm việc gần nhất</h2><div class="row" style="flex-wrap:wrap;gap:4px">'+reps+'</div></div>'
    +'<div class="panel"><h2>Quá hạn ('+r.late.length+')</h2>'+(li(r.late,t=>"Hạn "+dm(t.due))||'<div class="sub">Không có.</div>')+'</div>'
    +'<div class="panel"><h2>Im lặng ≥'+SILENT_DAYS+' ngày ('+r.sil.length+')</h2>'+(li(r.sil,t=>diffDays(todayStr(),tTouch(t))+" ngày chưa cập nhật")||'<div class="sub">Không có.</div>')+'</div>'
    +'<div class="panel"><h2>Tin nhắc nhanh</h2><textarea id="wmsg" rows="3" style="width:100%">'+esc(msg)+'</textarea><button class="btn sm" id="wcopy" style="margin-top:6px">Sao chép để gửi Zalo</button></div></div>');
  $("#wcopy").addEventListener("click",()=>{ navigator.clipboard?.writeText($("#wmsg").value).then(()=>toast("Đã sao chép"),()=>toast("Chọn và sao chép thủ công")); });
  bindTaskLinks($("#layer")); }
function bindTaskLinks(A){
  A.querySelectorAll("[data-otask]").forEach(b=>b.addEventListener("click",e=>{ e.preventDefault(); openTask(b.dataset.otask); }));
  A.querySelectorAll("[data-tdone]").forEach(c=>c.addEventListener("change",async()=>{ if(await upd("tasks",c.dataset.tdone,{status:c.checked?"done":"doing",doneAt:c.checked?new Date().toISOString():null,...stamp()})) toast(c.checked?"Đã xong, sẽ tự vào báo cáo cuối ngày":"Đã mở lại"); }));
  A.querySelectorAll("[data-tdoing]").forEach(b=>b.addEventListener("click",async()=>{ if(await upd("tasks",b.dataset.tdoing,{status:"doing",...stamp()})) toast("Đã chuyển sang Đang làm"); }));
  A.querySelectorAll("[data-watch]").forEach(r=>r.addEventListener("click",()=>openWatch(r.dataset.watch)));
}
function quickPrefill(){ const t0=todayStr();
  const done=Object.entries(S.tasks).filter(([id,t])=>t.kind!=="epic"&&t.R===me&&t.status==="done"&&tDone(t)===t0).map(([,t])=>t).map(t=>"• "+t.title);
  const doing=Object.entries(S.tasks).filter(([id,t])=>t.kind!=="epic"&&!tOpenKids(id)&&t.R===me&&t.status==="doing"&&dOf(t.updatedAt)===t0).map(([,t])=>t).map(t=>"• Đang làm: "+t.title);
  const next=myOpen(me).slice(0,3).map(([,t])=>"• "+t.title+(t.due?" (hạn "+dm(t.due)+")":""));
  const late=myOpen(me).filter(([,t])=>tLate(t)).map(([,t])=>"• Quá hạn: "+t.title+" (hạn "+dm(t.due)+"). Lý do: ");
  return {done:[...done,...doing].join("\n"),next:next.join("\n"),block:late.slice(0,3).join("\n")}; }
function maybeNudge(){ try{ if(!me||!isReporter(me)||S.daily[todayStr()+"_"+me]||ui.drawer) return; if(new Date().getHours()<17) return; const k="bvi_nudge_"+todayStr()+"_"+me; if(localStorage.getItem(k)) return; localStorage.setItem(k,"1"); setTimeout(()=>{ if(!S.daily[todayStr()+"_"+me]&&!ui.drawer) openQuick(); },800); }catch(e){} }

function vOverview(){
  const zs=focusZones().map(([id,z])=>({id,z,s:zstatus(z)}));

  const ha=zs.reduce((a,x)=>a+(+x.z.ha||0),0);
  const cnt=k=>zs.filter(x=>x.s.k===k).length;
  const coded=zs.filter(x=>x.z.code&&!/^(DANGTHUCHIEN|TEST|YANNING)/.test(x.z.code)||x.z.step>=7).length;

  { const sp=spMine().length; if(sp) h+='<div class="row" style="margin-top:8px"><a class="pill warn" href="#ho-tro">'+sp+' yêu cầu hỗ trợ đang chờ bạn</a></div>'; }
  h+=todayPanel()+teamWatch();
  { const fp=faqPending().length; if(fp&&canManage()) h+='<div class="row" style="margin-top:8px"><a class="pill warn" href="#faq">'+fp+' FAQ chờ duyệt</a></div>'; }
  h+='<div class="grid kpis" style="margin-top:12px">'
   +tile("Tổng vùng",zs.length,fmtHa(ha)+" ha","","")
   +tile("Đã có mã",coded,"nội địa hoặc GACC","good","st=wait")
   +tile("Đúng tiến độ",cnt("ok"),"lệch ≤ 2 ngày","good","st=ok")
   +tile("Trễ nhẹ",cnt("warn"),"3–7 ngày","warn","st=warn")
   +tile("Trễ nặng",cnt("bad"),"> 7 ngày","bad","st=bad")
   +tile("Chưa có mốc",cnt("unk"),"cần chốt bước, mốc T","","st=unk")
   +'</div>';
  // funnel
  const maxN=Math.max(1,...STEPS.map(s=>zs.filter(x=>x.z.step===s.n).length), zs.filter(x=>x.z.step==null).length);
  let f='<div class="funnel">';
  STEPS.forEach(s=>{ const xs=zs.filter(x=>x.z.step===s.n); const n=xs.length; const ok=xs.filter(x=>x.s.k==="ok"||x.s.k==="wait").length, w=xs.filter(x=>x.s.k==="warn").length, b=xs.filter(x=>x.s.k==="bad").length, u=n-ok-w-b;
    f+='<button class="frow" data-go="step='+s.n+'"><span class="fname">'+s.n+' · '+esc(s.name)+'</span><span class="fbar">'+seg(ok,maxN,"var(--good)")+seg(w,maxN,"var(--warn)")+seg(b,maxN,"var(--bad)")+seg(u,maxN,"var(--info)")+'</span><span class="n">'+n+'</span></button>'; });
  const nu=zs.filter(x=>x.z.step==null).length;
  f+='<button class="frow" data-go="step=none"><span class="fname">Chưa rõ bước</span><span class="fbar">'+seg(nu,maxN,"var(--line)")+'</span><span class="n">'+nu+'</span></button></div>';
  f+='<div class="legend" style="margin-top:8px"><span><i class="sw" style="background:var(--good)"></i>Đúng / chờ cơ quan</span><span><i class="sw" style="background:var(--warn)"></i>Trễ nhẹ</span><span><i class="sw" style="background:var(--bad)"></i>Trễ nặng</span><span><i class="sw" style="background:var(--info)"></i>Chưa có mốc</span></div>';
  // attention
  const att=[];
  zs.forEach(x=>{ if(x.s.k==="bad") att.push([3+x.s.late/100,x,"Trễ nặng "+x.s.late+" ngày · "+x.s.m.label]);
    else if(x.s.k==="warn") att.push([2,x,"Trễ nhẹ · "+x.s.m.label]);
    else if(x.s.m.date && x.s.k==="ok" && diffDays(x.s.m.date,todayStr())<=3 && diffDays(x.s.m.date,todayStr())>=0) att.push([1.5,x,"Đến hạn "+dm(x.s.m.date)+" · "+x.s.m.label]);
    if((x.z.priority==="1"||x.z.priority==="2") && !x.z.owner) att.push([1.2,x,"Chưa có người chịu trách nhiệm"]);
    if((x.z.priority==="1"||x.z.priority==="2") && zoneStale(x.z)) att.push([1.1,x,"2 ngày chưa cập nhật"]);
  });
  att.sort((a,b)=>b[0]-a[0]);
  let a='<div class="list">'+(att.slice(0,10).map(([,x,why])=>zoneRow(x.id,x.z,why)).join("")||'<div class="empty">'+(ui.focus&&!zs.length?'Chưa có vùng nào được chọn ưu tiên 1 hoặc 2. Vào Vùng trồng, bấm "Chọn ưu tiên nhanh".':'Không có vùng nào cần xử lý gấp.')+'</div>')+'</div>';
  // groups & tasks
  const myT=Object.entries(S.tasks).filter(([,t])=>t.kind!=="epic"&&t.status!=="done"&&me&&(t.R===me||t.A===me));
  const lateT=Object.values(S.tasks).filter(t=>t.kind!=="epic"&&tLate(t)).length;
  let gtxt='<div class="grid" style="grid-template-columns:repeat(3,1fr)">'
    +tile("Nhóm A",g.A,"liên kết + đã đặt hàng","","grp=A")+tile("Nhóm B",g.B,"đã liên kết, chưa đặt","","grp=B")+tile("Nhóm C",g.C,"chưa liên kết","","grp=C")+'</div>';
  // upcoming
  const up=zs.filter(x=>x.s.m.date&&!x.s.m.wait&&diffDays(x.s.m.date,todayStr())>=0&&diffDays(x.s.m.date,todayStr())<=7).sort((p,q)=>p.s.m.date.localeCompare(q.s.m.date));
  let u='<table><tbody>'+(up.map(x=>'<tr><td class="mono">'+dm(x.s.m.date)+'</td><td><a href="#vung" data-zone="'+x.id+'">'+esc(x.z.name)+'</a></td><td class="sub">'+esc(x.s.m.label)+'</td></tr>').join("")||'<tr><td class="sub">Không có mốc nào trong 7 ngày tới.</td></tr>')+'</tbody></table>';
  h+='<div class="cols" style="margin-top:12px"><div class="grid"><div class="panel"><h2>Cần xử lý ngay</h2>'+a+'</div></div><div class="grid">'
    +'<div class="panel"><h2>Vùng đang ở bước nào</h2>'+f+'</div>'
    +'<div class="panel"><h2>Ưu tiên theo liên kết</h2>'+gtxt+'</div>'
    +'<div class="panel"><h2>Mốc trong 7 ngày tới</h2><div class="tw">'+u+'</div></div>'
    +calPanel()
    +'<div class="panel"><div class="row between"><h2>Công việc</h2><a class="btn sm" href="#cong-viec">Mở</a></div><div class="row"><span class="pill">'+myT.length+' việc của tôi đang mở</span><span class="pill bad">'+lateT+' việc quá hạn</span></div></div>'
    +'</div></div>';
  return h;
}
function seg(n,max,c){ return n?'<span style="width:'+(n/max*100)+'%;background:'+c+'"></span>':""; }
function tile(l,v,sub,cls,go){ return '<'+(go?'button data-go="'+go+'"':'div')+' class="tile '+cls+'"><span class="l">'+esc(l)+'</span><span class="v">'+v+'</span><span class="sub">'+esc(sub)+'</span></'+(go?'button':'div')+'>'; }
function zoneRow(id,z,why){

function vZones(){
  const f=ui.zf; const all=Object.entries(S.zones);
  const provs=[...new Set(all.map(([,z])=>z.province).filter(Boolean))].sort();
  const units=unitList().map(([k,u])=>[k,u.name]);
  let zs=all.filter(([,z])=>f.hidden?z.active===false:z.active!==false);
  if(!f.hidden&&ui.focus&&!ui.pick) zs=zs.filter(([,z])=>isFocus(z));
  const q=norm(f.q);
  const wards=[...new Set(all.filter(([,z])=>z.active!==false&&(!f.prov||z.province===f.prov)).map(([,z])=>z.ward).filter(Boolean))].sort((a,b)=>norm(a).localeCompare(norm(b)));
  zs=zs.filter(([,z])=>{ const s=zstatus(z);
    if(q&&!norm(z.name+" "+(z.unit||"")+" "+(z.ward||"")+" "+(z.code||"")+" "+(z.province||"")).includes(q)) return false;
    if(f.ward&&z.ward!==f.ward) return false;
    if(f.prov&&z.province!==f.prov) return false; if(f.unit==="none"&&z.unitId) return false; if(f.unit&&f.unit!=="none"&&z.unitId!==f.unit) return false;
    if(f.grp&&grp(z)!==f.grp) return false; if(f.pri&&z.priority!==f.pri) return false;
    if(f.step==="none"&&z.step!=null) return false; if(f.step&&f.step!=="none"&&String(z.step)!==f.step) return false;
    if(f.owner==="none"&&z.owner) return false; if(f.owner&&f.owner!=="none"&&z.owner!==f.owner) return false;
    if(f.st&&s.k!==f.st) return false; return true; });
  const rank={A:0,B:1,C:2}, prk={"1":0,"2":1,"GACC":3,"3":2};
  zs.sort((a,b)=>rank[grp(a[1])]-rank[grp(b[1])]||(prk[a[1].priority]??4)-(prk[b[1].priority]??4)||(b[1].step??-1)-(a[1].step??-1)||a[1].name.localeCompare(b[1].name,"vi"));
  const ha=zs.reduce((a,[,z])=>a+(+z.ha||0),0);
  const opt=(arr,val,lab)=>arr.map(([v,l])=>'<option value="'+esc(v)+'"'+(String(val)===String(v)?" selected":"")+'>'+esc(l)+'</option>').join("");
  let h='<div class="row between"><div><h1>Vùng trồng</h1><div class="sub">'+zs.length+' vùng · '+fmtHa(ha)+' ha · xếp theo nhóm liên kết A → B → C, rồi ưu tiên và bước</div></div><div class="row">'+(ui.pick?'':focusBar())+'<button class="btn'+(ui.pick?' pri':'')+'" id="pickBtn">'+(ui.pick?'Xong chọn ưu tiên':'Chọn ưu tiên nhanh')+'</button><button class="btn" id="addZone">Thêm vùng</button>'+(isOwner()?'<label class="btn" style="cursor:pointer">Nhập từ FarmBase<input type="file" id="impZ" accept=".xlsx" hidden></label>':'')+'</div></div>'+(ui.pick?'<div class="alert" style="margin-top:8px">Bấm 1 hoặc 2 cho vùng cần xử lý trước; bấm 3 để đưa về sau. Vùng ưu tiên 1–2 là phần xem chính ở Tổng quan và Vùng trồng.</div>':'');
  h+='<div class="filters">'
   +'<input type="search" id="zq" placeholder="Tìm tên vùng, xã phường, đơn vị, mã (gõ không dấu được)" value="'+esc(f.q)+'" aria-label="Tìm vùng">'
   +'<select id="zprov" aria-label="Tỉnh"><option value="">Mọi tỉnh</option>'+opt(provs.map(p=>[p,p]),f.prov)+'</select>'
   +'<select id="zward" aria-label="Xã, phường"><option value="">Mọi xã, phường</option>'+opt(wards.map(w=>[w,w+" ("+all.filter(([,z])=>z.ward===w&&z.active!==false).length+")"]),f.ward)+'</select>'
   +'<select id="zunit" aria-label="Đơn vị liên kết"><option value="">Mọi đơn vị</option>'+opt([["none","Chưa liên kết"],...units],f.unit)+'</select>'
   +'<select id="zgrp" aria-label="Nhóm"><option value="">Nhóm A, B, C</option>'+opt([["A","A · liên kết + đặt hàng"],["B","B · đã liên kết"],["C","C · chưa liên kết"]],f.grp)+'</select>'
   +'<select id="zpri" aria-label="Ưu tiên"><option value="">Mọi ưu tiên</option>'+opt(Object.entries(PRI),f.pri)+'</select>'
   +'<select id="zstep" aria-label="Bước"><option value="">Mọi bước</option>'+opt([["none","Chưa rõ bước"],...STEPS.map(s=>[String(s.n),s.n+" · "+s.name])],f.step)+'</select>'
   +'<select id="zowner" aria-label="Người phụ trách"><option value="">Mọi người</option><option value="none"'+(f.owner==="none"?" selected":"")+'>Chưa giao</option>'+opt(Object.entries(S.people).map(([k,p])=>[k,p.name]),f.owner)+'</select>'
   +'<select id="zst" aria-label="Trạng thái"><option value="">Mọi trạng thái</option>'+opt([["ok","Đúng tiến độ"],["warn","Trễ nhẹ"],["bad","Trễ nặng"],["unk","Chưa có mốc / bước"],["wait","Chờ cơ quan, có mã"]],f.st)+'</select>'
   +'<label class="row sub"><input type="checkbox" id="zhid"'+(f.hidden?" checked":"")+'> Vùng đã ẩn</label>'

  h+='<div class="legend" style="margin-bottom:8px"><span><i class="sw" style="background:var(--done)"></i>Bước đã xong</span><span><i class="sw" style="background:var(--doing)"></i>Bước đang làm</span><span><i class="sw" style="background:var(--todo)"></i>Chưa tới</span></div>';

  h+='<div class="list">'+(zs.map(([id,z])=>ui.pick?pk(id,z):zoneRow(id,z,z.flag?"⚑ "+z.flag:"")).join("")||'<div class="empty">Không có vùng khớp bộ lọc.</div>')+'</div>';
  return h;
}

function drawZone(id){
  const z=S.zones[id]; if(!z){closeDrawer();return;}
  const s=zstatus(z), g=grp(z), st=z.step;
  const ppl=Object.entries(S.people).sort((a,b)=>a[1].name.localeCompare(b[1].name,"vi"));
  const sel=(fld,val,opts)=>'<select data-zf="'+fld+'">'+opts.map(([v,l])=>'<option value="'+esc(v)+'"'+(String(val??"")===String(v)?" selected":"")+'>'+esc(l)+'</option>').join("")+'</select>';
  let h='<div class="dh"><div style="min-width:0"><div class="row"><span class="pill grp '+g+'">'+g+'</span><span class="pill '+s.c+'"><i class="dot"></i>'+esc(s.t)+'</span></div><h2 style="margin-top:6px;overflow-wrap:anywhere">'+esc(z.name)+'</h2><div class="sub">'+esc(z.unit||"Chưa liên kết")+' · '+fmtHa(z.ha)+' ha · '+(z.hh||0)+' hộ · '+(z.plots||0)+' lô'+(z.code?' · <span class="mono">'+esc(z.code)+'</span>':'')+'</div></div><button class="btn sm" data-close>Đóng</button></div><div class="db">';

/* ---------- góp ý SMART · RACI ---------- */
const VAGUE=["hỗ trợ","theo dõi","xử lý","tìm hiểu","phối hợp","làm việc","kiểm tra lại","rà soát","cập nhật","chuẩn bị"];
function reviewTask(d,id){
  const out=[], add=(k,lv,msg)=>out.push({k,lv,msg}); const t=d.title||"", words=t.split(/\s+/).filter(Boolean);
  const kids=id?tKids(id).length:0; const par=d.parent&&S.tasks[d.parent]?S.tasks[d.parent]:null;
  // S
  const vague=VAGUE.find(v=>t.toLowerCase().startsWith(v)) ;
  if(!t) add("S · Cụ thể","bad","Chưa có tên việc.");
  else if(words.length<4) add("S · Cụ thể","warn","Tên việc ngắn quá. Viết theo dạng động từ + kết quả + phạm vi, ví dụ \"Nộp DVC vùng Sình Thời\".");
  else if(vague&&!d.smart.s) add("S · Cụ thể","warn","Tên bắt đầu bằng \""+vague+"\" dễ hiểu nhiều cách. Ghi rõ kết quả cần có ở ô S.");
  else if(!d.smart.s&&words.length<7) add("S · Cụ thể","warn","Nên ghi ô S: làm ra cái gì, cho vùng hay đơn vị nào.");
  else add("S · Cụ thể","ok","Rõ việc cần làm.");
  // M
  if(!d.smart.m) add("M · Đo được","bad","Chưa ghi khi nào là đạt. Dùng con số: số hộ, số lô, %, số trang hồ sơ, có mã hồ sơ…");
  else if(!/\d|%|đủ|100|tất cả|toàn bộ|có mã|biên bản|xác nhận/i.test(d.smart.m)) add("M · Đo được","warn","Tiêu chí chưa có con số hay dấu hiệu xong rõ ràng.");
  else add("M · Đo được","ok","Có tiêu chí đo.");
  // A
  const load=d.R?Object.entries(S.tasks).filter(([k,x])=>k!==id&&x.kind!=="epic"&&x.status!=="done"&&x.R===d.R).length:0;
  if(!d.smart.a&&d.kind!=="sub") add("A · Khả thi","warn","Chưa ghi cần gì, ai hỗ trợ để làm được.");
  else if(load>=8) add("A · Khả thi","warn",pname(d.R)+" đang thực hiện "+load+" việc mở. Cân nhắc giãn hạn hoặc giao người khác.");
  else add("A · Khả thi","ok",d.R?pname(d.R)+" đang có "+load+" việc mở.":"Đã ghi điều kiện thực hiện.");
  // R
  if(!d.smart.r&&!d.parent&&!d.zone) add("R · Liên quan","warn","Chưa ghi vì sao cần, và chưa gắn epic hay vùng.");
  else add("R · Liên quan","ok",d.zone?"Gắn với vùng "+(S.zones[d.zone]?.name||""):d.parent?"Thuộc "+(par?.title||"việc cha"):"Đã ghi lý do.");
  // T
  const today=todayStr();
  if(!d.due) add("T · Có hạn","bad","Chưa chọn hạn hoàn thành.");
  else if(d.due<today&&!id) add("T · Có hạn","bad","Hạn đã qua.");
  else if(par?.due&&d.due>par.due) add("T · Có hạn","warn","Hạn ("+dmy(d.due)+") trễ hơn hạn của việc cha ("+dmy(par.due)+").");
  else if(d.kind!=="epic"&&diffDays(d.due,today)>30&&!kids) add("T · Có hạn","warn","Hạn xa hơn 30 ngày. Nên chia thành việc con có hạn ngắn hơn.");
  else add("T · Có hạn","ok","Hạn "+dmy(d.due)+".");
  // RACI
  if(!d.R) add("RACI · R","bad","Chưa có người thực hiện.");
  else add("RACI · R","ok",pname(d.R)+" thực hiện.");
  if(!d.A) add("RACI · A","bad","Chưa có một người chịu trách nhiệm cuối.");
  else if(d.kind==="epic"&&d.A===d.R) add("RACI · A","warn","Epic nên có A là cấp quản lý khác với người thực hiện.");
  else add("RACI · A","ok",pname(d.A)+" chịu trách nhiệm cuối"+(d.A===d.R?" (cũng là người làm, hợp lệ với việc nhỏ)":"")+".");
  const dup=[...d.C,...d.I].filter(x=>x===d.R||x===d.A);
  if(dup.length) add("RACI · C, I","warn",dup.map(pname).join(", ")+" đã là R hoặc A, bỏ khỏi C, I cho gọn.");
  else if(!d.I.length&&d.kind!=="sub") add("RACI · C, I","warn","Chưa có ai được thông báo (I). Thường là điều phối hoặc người nhận bàn giao.");
  else if(d.C.length+d.I.length>5) add("RACI · C, I","warn","Quá nhiều người C, I. Chỉ giữ người thật sự cần.");
  else add("RACI · C, I","ok","Hợp lý.");
  // clarity
  const note=d.note||"";
  if(d.kind==="epic") add("Độ rõ","ok","Epic dùng S, M ở trên làm mục tiêu chung.");
  else if(note.length<25&&!(d.smart.s&&d.smart.m)) add("Độ rõ","bad","Người được giao khó hiểu đủ. Ghi mô tả: làm gì, đầu ra là gì, lưu ở đâu, cần ai.");
  else if(!/(drive|farmbase|lưu|gửi|bàn giao|nộp|file|biên bản|danh sách|in|scan|zalo)/i.test(note+" "+d.smart.s+" "+d.smart.m)) add("Độ rõ","warn","Chưa nói đầu ra giao cho ai hoặc lưu ở đâu.");
  else add("Độ rõ","ok","Có đầu ra và nơi giao, lưu.");
  return out;
}

function cCalc(c){
  const items=c.items||[]; const total=items.reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0);
  const zs=Object.entries(S.zones).filter(([,z])=>z.contract===c._id && z.active!==false);
  const haZ=zs.reduce((a,[,z])=>a+(+z.ha||0),0);
  const haC=Math.max(0,...items.map(i=>+i.qty||0));
  const reach=(min)=>zs.filter(([,z])=>(z.step??-1)>=min).length;
  const paid=(c.payments||[]).reduce((a,p)=>a+(p.paid?total*(+p.pct||0)/100:0),0);
  return {total,zs,haZ,haC,reach,paid};
}

function leaveDaySes(l,d){ const end=l.to||l.from; if(!l.from||d<l.from||d>end) return []; const s=d===l.from?(l.fromSes||"sang"):"sang", e=d===end?(l.toSes||"chieu"):"chieu"; return s===e?[s]:(s==="sang"&&e==="chieu"?["sang","chieu"]:[]); }
function attKind(l){ const st=l.status||"pending"; if(st==="rejected") return null; if(st==="pending") return "pend"; if(st==="approved_unpaid"||(st==="approved"&&l.pay==="unpaid")) return "K"; return "P"; }
function stdSes(d){ const wd=new Date(d+"T00:00:00").getDay(); if(wd===0) return []; if(wd===6){ const m=ui.att?.sat||"full"; return m==="off"?[]:m==="am"?["sang"]:["sang","chieu"]; } return ["sang","chieu"]; }
function attMonth(pid,ym){
  const days=[]; let d=ym+"-01"; while(d.slice(0,7)===ym){ days.push(d); d=addDays(d,1); }
  const ls=Object.values(S.leaves).filter(l=>l.person===pid); const t=todayStr();
  let std=0,P=0,K=0,pend=0,early=0,rep=0; const cells=days.map(day=>{ const ss=stdSes(day); std+=ss.length; const c={day,std:ss,mark:{}};

const CGRP={gacc:"Đã có mã nội địa",ut1:"Ưu tiên 1",ut2:"Ưu tiên 2",tbd:"Chưa xác định"};
const CGRP_CRIT={gacc:"Đã có mã nội địa, chờ phía TQ cấp mã GACC",ut1:"Xã đã kiểm tra, duyệt hồ sơ; sắp ra mã",ut2:"Đã đủ hoặc sắp đủ hồ sơ sổ đỏ",tbd:"Còn vướng hồ sơ đất hoặc chưa thu đủ giấy tờ"};
function realCode(z){ return z.code&&!/^(DANGTHUCHIEN|TEST|YANNING)/.test(z.code)?z.code:""; }
function cGrp(z){ if((z.step??-1)>=7||realCode(z)) return "gacc"; if(!z.eta) return "tbd"; return z.priority==="1"?"ut1":"ut2"; }
function custIds(){ const ids=[ui.cust,...(ui.custAdd||[])].filter((k,i,a)=>k&&S.units[k]&&a.indexOf(k)===i); return ids; }
function custZones(){ const ids=custIds(); const ord={gacc:0,ut1:1,ut2:2,tbd:3};
  return activeZones().filter(([,z])=>ids.includes(z.unitId)).sort((a,b)=>ord[cGrp(a[1])]-ord[cGrp(b[1])]||ids.indexOf(a[1].unitId)-ids.indexOf(b[1].unitId)||(b[1].step??-1)-(a[1].step??-1)||a[1].name.localeCompare(b[1].name,"vi")); }
function custName(){ return custIds().map(k=>S.units[k].name).join(" · "); }
function custLegal(){ const ids=custIds(); return ids.length===1?(S.units[ids[0]].legal||S.units[ids[0]].name):custName(); }
function grpEta(list){ const c={}; list.forEach(([,z])=>{ if(z.eta) c[z.eta]=(c[z.eta]||0)+1; }); return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||""; }
function etaShort(e){ return String(e||"").replace(/\/\d{4}$/,""); }
function zShort(n){ let x=String(n||"").replace(/^\s*vùng\s+(trồng\s+)?sầu\s+riêng\s+/i,"").trim()||String(n||""); if(x===x.toLocaleUpperCase("vi")&&/[A-ZÀ-Ỹ]/.test(x)) x=x.toLocaleLowerCase("vi").replace(/(^|[\s('’])(\S)/g,(m,a,c)=>a+c.toLocaleUpperCase("vi")); return x; }
function tTitle(t,z){ const i=t.title.indexOf(":"); if(i>1&&i<60){ const p=t.title.slice(0,i).toLocaleLowerCase("vi").trim(); const zn=(z?.name||"").toLocaleLowerCase("vi"); if(p&&zn.includes(p)){ const r=t.title.slice(i+1).trim(); return r.charAt(0).toLocaleUpperCase("vi")+r.slice(1); } } return t.title; }
function zSubs(id,o){ o=o||{}; return Object.values(S.tasks).filter(t=>t.zone===id&&t.kind==="sub"&&t.status!=="done"&&(o.field?t.fieldVisit:!t.fieldVisit)).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")); }
function zRemain(id){ const z=S.zones[id]; return zSubs(id).map(t=>tTitle(t,z)+(t.party?" ("+t.party+")":"")+(t.due?": "+dmy(t.due):"")); }
function zFieldDone(id){ const f=Object.values(S.tasks).filter(t=>t.zone===id&&t.fieldVisit); return f.length?f.every(t=>t.status==="done"):null; }
function zPlace(z,multi){ return [z.ward,multi?unitName(z.unitId):""].filter(Boolean).join(" · "); }
function custData(){ const zs=custZones(); const G={gacc:[],ut1:[],ut2:[],tbd:[]}; zs.forEach(e=>G[cGrp(e[1])].push(e));
  const ha=l=>l.reduce((a,[,z])=>a+(+z.ha||0),0); return {zs,G,ha,multi:custIds().length>1}; }

    h+='<tr><td style="min-width:140px"><b>'+esc(zShort(z.name))+'</b><div class="sub">'+esc(zPlace(z,multi))+'</div></td><td class="n">'+fmtHa(z.ha)+'</td><td>'+CGRP[g]+(g==="gacc"&&realCode(z)?'<div class="sub mono">'+esc(realCode(z))+'</div>':z.eta?'<div class="sub">'+esc(z.eta)+'</div>':'')+'</td><td style="min-width:200px">'+esc(z.custNote||"")+'</td><td style="min-width:180px">'+esc(z.blocker||"")+'</td><td style="min-width:240px">'+(rm.length?rm.map(x=>'<div>• '+esc(x)+'</div>').join(""):(g==="tbd"&&z.next?esc(z.next):'<span class="sub">—</span>'))+'</td></tr>'; });

/* ---------- calendar: công tác + sự kiện ---------- */
const EKIND={congtac:"Công tác",sukien:"Sự kiện"};
const ESTAT={plan:"Kế hoạch",done:"Đã xong",cancel:"Hủy"};
const WD=["CN","T2","T3","T4","T5","T6","T7"];
function evMissing(e){ if(e.kind!=="sukien"||e.status==="cancel") return []; const m=[]; if(!(e.photos||[]).length) m.push("ảnh"); if(!(e.signs||[]).length) m.push("danh sách ký"); if(!(e.report?.summary)) m.push("tóm tắt"); return m; }
function evNeedsReport(e){ return e.status!=="cancel" && (e.date||"")<=todayStr() && (e.kind==="sukien"?evMissing(e).length>0:!(e.report?.summary)); }
function evRow(id,e){
  const d=e.date?new Date(e.date+"T00:00:00"):null; const ppl=(e.people||[]).map(pname).filter(Boolean);
  const miss=evNeedsReport(e);
  return '<button class="ev" data-ev="'+id+'"><span class="dt">'+(d?WD[d.getDay()]:"")+'<b>'+(e.date?e.date.slice(8,10):"?")+'</b>'+(e.date?e.date.slice(5,7):"")+'</span><span style="min-width:0"><div class="nm">'+esc(e.title||"(chưa có tên)")+'</div><div class="meta"><span>'+esc(EKIND[e.kind]||"")+'</span>'+(e.time?'<span>'+esc(e.time)+'</span>':'')+(e.place?'<span>'+esc(e.place)+'</span>':'')+(ppl.length?'<span>'+esc(ppl.join(", "))+'</span>':'')+(e.unitId?'<span>'+esc(unitName(e.unitId))+'</span>':'')+'</div></span><span class="rt">'+(miss?'<span class="pill bad">Thiếu báo cáo</span>':'<span class="pill '+(e.status==="done"?"good":e.status==="cancel"?"":"info")+'">'+esc(ESTAT[e.status||"plan"])+'</span>')+'</span></button>';
}
function calPanel(){
  const t=todayStr(), end=addDays(t,7);
  const up=Object.entries(S.events).filter(([,e])=>e.date>=t&&e.date<=end&&e.status!=="cancel").sort((a,b)=>(a[1].date+(a[1].time||"")).localeCompare(b[1].date+(b[1].time||"")));
  const miss=Object.values(S.events).filter(evNeedsReport).length;
  return '<div class="panel"><div class="row between"><h2>Lịch 7 ngày tới</h2><a class="btn sm" href="#lich">Mở lịch</a></div>'+(miss?'<div class="alert bad" style="margin-bottom:8px">'+miss+' lịch đã qua chưa có báo cáo</div>':'')+'<div class="list">'+(up.slice(0,6).map(([k,e])=>evRow(k,e)).join("")||'<div class="sub">Chưa có lịch nào.</div>')+'</div></div>';
}
function vCal(){
  const f=ui.ef, t=todayStr();
  let es=Object.entries(S.events);
  if(f.kind) es=es.filter(([,e])=>e.kind===f.kind);
  if(f.mine&&me) es=es.filter(([,e])=>(e.people||[]).includes(me)||e.lead===me);
  if(f.when==="up") es=es.filter(([,e])=>(e.date||"")>=t);
  else if(f.when==="past") es=es.filter(([,e])=>(e.date||"")<t);
  else if(f.when==="miss") es=es.filter(([,e])=>evNeedsReport(e));

function stRange(){ const P=ui.st, t=todayStr(); let f=t,to=t,lb="Hôm nay";

  else if(P.p==="2w"){ f=addDays(t,-13); lb="14 ngày gần nhất"; }
  else if(P.p==="month"){ f=t.slice(0,8)+"01"; lb="Tháng "+t.slice(5,7)+"/"+t.slice(0,4); }
  else if(P.p==="30"){ f=addDays(t,-29); lb="30 ngày gần nhất"; }
  else if(P.p==="custom"){ f=P.from||addDays(t,-6); to=P.to||t; if(f>to){ const x=f; f=to; to=x; } lb=dmy(f)+" → "+dmy(to); }
  return {f,to,lb}; }
function inR(d,r){ return !!d && d.slice(0,10)>=r.f && d.slice(0,10)<=r.to; }
function workDays(r){ let n=0,d=r.f,g=0; while(d<=r.to&&g++<400){ if(new Date(d+"T00:00:00").getDay()!==0) n++; d=addDays(d,1);} return n; }
function tDone(t){ return t.status==="done"?(t.doneAt||t.updatedAt||"").slice(0,10):""; }
function pct(a,b){ return b?Math.round(a*100/b):null; }
function pctTxt(v){ return v===null?"—":v+"%"; }
function stCalc(r){
  const T=Object.entries(S.tasks).filter(([,t])=>t.kind!=="epic"), td=todayStr();
  const doneIn=T.filter(([,t])=>inR(tDone(t),r)), withDue=doneIn.filter(([,t])=>t.due), onTime=withDue.filter(([,t])=>tDone(t)<=t.due);

function svgBars(days,series,h){ // series:[{k,label,color,vals[]}]

/* ---------- Nhập vùng từ FarmBase ---------- */
const IMP_COLS={"Tên":"name","Mã":"code","Giống cây trồng":"variety","Tỉnh thành":"province","Phường xã":"ward","Tiêu chuẩn áp dụng":"standard","Tổng diện tích":"ha","Tổng lô đất":"plots","Tổng nông hộ":"hh","Tổng số cây":"trees","SL dự kiến":"yPlan","SL thực tế":"yReal","Mùa vụ hiện tại":"season","Tên pháp lý":"legal"};
const IMP_LBL={code:"Mã",variety:"Giống",province:"Tỉnh",ward:"Xã/phường",standard:"Tiêu chuẩn",ha:"Diện tích (ha)",plots:"Số lô",hh:"Số hộ",trees:"Số cây",yPlan:"SL dự kiến",yReal:"SL thực tế",season:"Mùa vụ",unitId:"Đơn vị"};
async function readXlsx(file){
  if(!window.JSZip) throw new Error("Chưa tải được thư viện đọc Excel, tải lại trang.");
  const zip=await JSZip.loadAsync(await file.arrayBuffer()); const P=new DOMParser();
  const ss=[]; const sf=zip.file("xl/sharedStrings.xml"); if(sf){ const d=P.parseFromString(await sf.async("string"),"application/xml"); [...d.getElementsByTagName("si")].forEach(si=>ss.push([...si.getElementsByTagName("t")].map(t=>t.textContent).join(""))); }
  let sheet="xl/worksheets/sheet1.xml"; if(!zip.file(sheet)){ const k=Object.keys(zip.files).find(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)); if(!k) throw new Error("Không thấy trang tính trong file."); sheet=k; }
  const d=P.parseFromString(await zip.file(sheet).async("string"),"application/xml"); const rows=[];
  [...d.getElementsByTagName("row")].forEach(rw=>{ const arr=[]; [...rw.getElementsByTagName("c")].forEach(c=>{ const ref=c.getAttribute("r")||""; const col=ref.replace(/\d+/g,"").split("").reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1; const t=c.getAttribute("t"); let v="";
    if(t==="s"){ const x=c.getElementsByTagName("v")[0]; v=x?ss[+x.textContent]||"":""; } else if(t==="inlineStr"){ v=[...c.getElementsByTagName("t")].map(x=>x.textContent).join(""); } else { const x=c.getElementsByTagName("v")[0]; v=x?x.textContent:""; }
    if(col>=0) arr[col]=v; }); rows.push(arr); });
  return rows; }
function zkey(s){ return norm(s||"").replace(/^(vung trong sau rieng|vung trong|vung sau rieng|vung)\s+/,"").trim(); }
const provN=s=>String(s||"").replace(/^(Tỉnh|Thành phố|TP\.?)\s+/i,"").trim();
async function startImport(file){ if(!isOwner()){ toast("Chỉ owner được nhập từ FarmBase"); return; }
  let rows; try{ rows=await readXlsx(file); }catch(e){ toast("Không đọc được file: "+(e.message||e)); return; }
  const head=(rows[0]||[]).map(x=>String(x||"").trim()); const idx={}; head.forEach((hd,i)=>{ if(IMP_COLS[hd]) idx[IMP_COLS[hd]]=i; });
  if(idx.name===undefined){ toast("File không có cột \"Tên\", không đúng mẫu báo cáo vùng trồng FarmBase."); return; }
  const zs=Object.entries(S.zones); const used=new Set();
  const items=rows.slice(1).filter(r=>r&&String(r[idx.name]||"").trim()).map((r,i)=>{
    const g=k=>idx[k]===undefined?"":String(r[idx[k]]??"").trim(); const num=k=>{ const v=g(k); return v===""?null:(isNaN(+v)?null:+v); };
    const src={name:g("name"),code:g("code"),variety:g("variety"),province:provN(g("province")),ward:g("ward"),standard:g("standard"),ha:num("ha"),plots:num("plots"),hh:num("hh"),trees:num("trees"),yPlan:num("yPlan"),yReal:num("yReal"),season:g("season"),legal:g("legal")};
    let m=zs.filter(([,z])=>z.fbName&&z.fbName===src.name); if(!m.length) m=zs.filter(([,z])=>zkey(z.name)===zkey(src.name)||(z.fbName&&zkey(z.fbName)===zkey(src.name)));
    const it={i,src,matches:m.map(x=>x[0]),target:m.length===1?m[0][0]:"",amb:m.length>1};
    if(it.target) used.add(it.target); return it; });
  const unitByLegal=s=>{ if(!s) return ""; const n=norm(s); const u=unitList().filter(([,u])=>norm(u.legal||"")===n||norm(u.name||"")===n); return u.length===1?u[0][0]:""; };
  items.forEach(it=>{ it.unit=unitByLegal(it.src.legal); diffImport(it); it.on=!!it.target&&it.safe.length>0; });
  ui.imp={file:file.name,items,missing:zs.filter(([k,z])=>z.active!==false&&!used.has(k)).map(([k])=>k),filter:"change"};

function diffImport(it){
  it.safe=[]; it.manual=[]; it.create=false; if(!it.target) return; const z=S.zones[it.target]||{}, s=it.src;
  ["ha","plots","hh","trees","yPlan","yReal"].forEach(k=>{ if(s[k]===null) return; const o=z[k]; if(o===undefined||o===null||o===""||Math.abs((+o||0)-s[k])>0.004) it.safe.push([k,o,s[k]]); });
  ["variety","standard","season"].forEach(k=>{ if(s[k]&&s[k]!==(z[k]||"")) it.safe.push([k,z[k]||"",s[k]]); });
  [["province",provN],["ward",x=>norm(x)]].forEach(([k,fn])=>{ if(!s[k]) return; if(!z[k]) it.safe.push([k,"",s[k]]); else if(fn(z[k])!==fn(s[k])) it.manual.push([k,z[k],s[k]]); });
  if(s.code){ if(!z.code) it.safe.push(["code","",s.code]); else if(z.code!==s.code) it.manual.push(["code",z.code,s.code]); }
  if(it.unit){ if(!z.unitId) it.safe.push(["unitId","",it.unit]); else if(z.unitId!==it.unit) it.manual.push(["unitId",z.unitId,it.unit]); }
  else if(s.legal&&!z.unitId) it.manual.push(["unitId","","Chưa có công ty khớp \""+s.legal+"\""]);
}

function chBurn(L){ if(!L.length) return '<div class="empty">Không có việc nào trong phạm vi này.</div>';

  const ti=days.indexOf(t0); if(ti>=0) g+='<line x1="'+X(ti)+'" x2="'+X(ti)+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="var(--info)" stroke-dasharray="3 3"/><text x="'+X(ti)+'" y="'+(pt-2)+'" text-anchor="middle" fill="var(--info)">Hôm nay</text>';

  const ia=ti>=0?ti:act.filter(v=>v!=null).length-1, gap=(act[ia]??0)-(plan[ia]??0);

function chWeek(L){ const t0=todayStr(); const wk=d=>{ const x=new Date(d+"T00:00:00"); const dw=(x.getDay()+6)%7; return addDays(d,-dw); };
  const B={}; L.forEach(([,t])=>{ if(!t.due) return; const k=wk(t.due); B[k]=B[k]||{done:0,open:0,late:0}; B[k][t.status==="done"?"done":tLate(t)?"late":"open"]++; });

}
function newFaq(){ ui.drawer=null; drawFaq(null);
  $("#fnew").addEventListener("submit",async e=>{ e.preventDefault(); const q=$("#f_q").value.trim(); if(!q) return; if(!me){toast("Chọn tên của bạn ở góc trên trước");return;}
    const a=$("#f_a").value.trim(); const now=new Date().toISOString();
    const d={q,cat:$("#f_cat").value,aud:$("#f_aud").value,status:a?"review":"open",answers:a?[{by:me,text:a,at:now}]:[],askedBy:me,createdAt:now,final:"",source:""};
    if(await put("faqs","f"+uid(),d)){ toast(a?"Đã gửi, chờ quản lý duyệt":"Đã gửi câu hỏi, chờ mọi người trả lời"); ui.fq.tab=a?"rev":"open"; saveUi(); closeDrawer(); render(); } });
}
/* ---------- binding ---------- */
function bindView(){
  const A=$("#app");
  A.querySelectorAll("[data-zone]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();openZone(b.dataset.zone)}));
  A.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{ const [k,v]=b.dataset.go.split("="); Object.assign(ui.zf,{q:"",prov:"",ward:"",unit:"",grp:"",pri:"",step:"",owner:"",st:"",hidden:false}); ui.zf[k]=v; saveUi(); location.hash="vung"; }));
  A.querySelectorAll("[data-focus]").forEach(b=>b.addEventListener("click",()=>{ ui.focus=b.dataset.focus==="1"; saveUi(); render(); }));
  if(ui.view==="thong-ke") bindStats(A);
  if(ui.view==="nhat-ky") bindLog(A);
  if(ui.view==="tai-khoan"){ $("#accAdd")?.addEventListener("click",()=>openAcc(null)); $("#accBulk")?.addEventListener("click",openBulk); A.querySelectorAll("[data-acc]").forEach(r=>r.addEventListener("click",()=>openAcc(r.dataset.acc))); $("#impJson")?.addEventListener("change",e=>{ const f=e.target.files[0]; e.target.value=""; if(f) importJson(f); }); }
  if(ui.view==="ho-tro") bindSupport(A);
  if(ui.view==="bao-cao") bindReports(A);
  if(ui.view==="nhan-su") bindAtt(A);
  if(ui.view==="lien-he") bindContacts(A);
  if(ui.view==="faq"){
    $("#addFaq")?.addEventListener("click",newFaq);
    A.querySelectorAll("[data-ftab]").forEach(b=>b.addEventListener("click",()=>{ ui.fq.tab=b.dataset.ftab; saveUi(); render(); }));
    A.querySelectorAll("[data-fopen]").forEach(b=>b.addEventListener("click",()=>{ const k="f_"+b.dataset.fopen; ui.open[k]=!ui.open[k]; render(); }));
    A.querySelectorAll("[data-fedit]").forEach(b=>b.addEventListener("click",()=>openFaq(b.dataset.fedit)));
    A.querySelectorAll("[data-fcopy]").forEach(b=>b.addEventListener("click",async()=>{ const f=S.faqs[b.dataset.fcopy]; try{ await navigator.clipboard.writeText(f.q+"\n"+f.final); toast("Đã sao chép, dán vào Zalo được"); }catch(e){ toast("Trình duyệt chặn sao chép"); } }));
    $("#fq")?.addEventListener("input",e=>{ ui.fq.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#fq"); n.focus(); try{n.setSelectionRange(pos,pos)}catch(_){} });
    $("#fcat")?.addEventListener("change",e=>{ ui.fq.cat=e.target.value; saveUi(); render(); });
    $("#faud")?.addEventListener("change",e=>{ ui.fq.aud=e.target.value; saveUi(); render(); });
  }
  $("#expAll")?.addEventListener("click",async()=>{ const blob=new Blob([JSON.stringify({app:"bvi-dieu-hanh",exportedAt:new Date().toISOString(),collections:S})],{type:"application/json"}); const fn="bvi-du-lieu-"+todayStr()+".json";
    if(dlNs){ try{ await dlNs.save({filename:fn,data:blob}); toast("Đã lưu file dữ liệu"); }catch(e){ if(e?.code!=="declined") toast("Không lưu được: "+(e?.message||e?.code||"")); } return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fn; a.click(); });
  if(ui.view==="cong-ty"){ $("#addU")?.addEventListener("click",()=>openUnit(null)); A.querySelectorAll("[data-u]").forEach(r=>r.addEventListener("click",()=>openUnit(r.dataset.u))); }
  if(ui.view==="vung"){
    $("#pickBtn")?.addEventListener("click",()=>{ ui.pick=!ui.pick; render(); });
    A.querySelectorAll("[data-setpri]").forEach(b=>b.addEventListener("click",async e=>{ e.stopPropagation(); const [zid,v]=b.dataset.setpri.split("|"); await upd("zones",zid,{priority:v,...stamp()}); }));
    const map={zq:"q",zprov:"prov",zward:"ward",zunit:"unit",zgrp:"grp",zpri:"pri",zstep:"step",zowner:"owner",zst:"st"};
    Object.entries(map).forEach(([id,k])=>{ const el=$("#"+id); el?.addEventListener(id==="zq"?"input":"change",()=>{ ui.zf[k]=el.value; saveUi(); const pos=el.selectionStart; render(); if(id==="zq"){const n=$("#zq");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}} }); });
    $("#zhid")?.addEventListener("change",e=>{ui.zf.hidden=e.target.checked;saveUi();render();});
    $("#zclear")?.addEventListener("click",()=>{Object.assign(ui.zf,{q:"",prov:"",ward:"",unit:"",grp:"",pri:"",step:"",owner:"",st:"",hidden:false});saveUi();render();});
    $("#addZone")?.addEventListener("click",newZone);
    $("#impZ")?.addEventListener("change",async e=>{ const f=e.target.files[0]; e.target.value=""; if(f) await startImport(f); });
  }
  if(ui.view==="cong-viec"){
    $("#tmine")?.addEventListener("change",e=>{ui.tf.mine=e.target.checked;render();});
    $("#tst")?.addEventListener("change",e=>{ui.tf.st=e.target.value;render();});
    $("#tteam")?.addEventListener("change",e=>{ui.tf.team=e.target.value;render();});
    $("#tpr")?.addEventListener("change",e=>{ui.tf.pr=e.target.value;render();});
    $("#tfR")?.addEventListener("change",e=>{ui.tf.r=e.target.value;render();});
    $("#tday")?.addEventListener("change",e=>{ui.tf.day=e.target.value; if(ui.tf.day) ui.tf.st="all"; render();});
    $("#chartBtn")?.addEventListener("click",openCharts);
    $("#addEpic")?.addEventListener("click",()=>openTask(null,{kind:"epic"}));
    $("#raciBtn")?.addEventListener("click",raciMatrix);
    A.querySelectorAll("[data-epic-toggle]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.epicToggle; ui.epicOpen[k]=ui.epicOpen[k]===false; render();}));
    A.querySelectorAll("[data-edit-task]").forEach(b=>b.addEventListener("click",()=>openTask(b.dataset.editTask)));
    A.querySelectorAll("[data-add-child]").forEach(b=>b.addEventListener("click",()=>{ const p=S.tasks[b.dataset.addChild]; openTask(null,{parent:b.dataset.addChild,kind:p.kind==="epic"?"task":"sub",zone:p.zone||null}); }));
    A.querySelectorAll("[data-done]").forEach(c=>c.addEventListener("change",()=>upd("tasks",c.dataset.done,{status:c.checked?"done":"doing",doneAt:c.checked?new Date().toISOString():null,...stamp()})));
  }
  if(ui.view==="hop-dong"){ $("#addC")?.addEventListener("click",()=>openContract(null)); A.querySelectorAll("[data-c]").forEach(r=>r.addEventListener("click",()=>openContract(r.dataset.c))); }
  if(ui.view==="nhan-su"){
    $("#addP")?.addEventListener("click",()=>openPerson(null));
    A.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>openPerson(b.dataset.p)));
    $("#dday")?.addEventListener("change",e=>{ui.dday=e.target.value;render();});
  }
  A.querySelectorAll("[data-quick]").forEach(b=>b.addEventListener("click",openQuick));
  if(ui.view==="tong-quan"){ bindTaskLinks(A); maybeNudge(); }
  A.querySelectorAll("[data-newleave]").forEach(b=>b.addEventListener("click",openLeave));
  A.querySelectorAll("[data-ldec]").forEach(b=>b.addEventListener("click",async()=>{ if(!canManage()) return; const [lid,st]=b.dataset.ldec.split("|"); if(await upd("leaves",lid,{status:st,decidedBy:me||"",decidedAt:new Date().toISOString()})) toast(LST[st]); }));
  A.querySelectorAll("[data-ldel]").forEach(b=>b.addEventListener("click",async()=>{ if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Bấm lần nữa để rút";return;} if(await del("leaves",b.dataset.ldel)) toast("Đã rút đơn"); }));
  A.querySelectorAll("[data-ev]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();openEvent(b.dataset.ev);}));
  if(ui.view==="lich"){
    A.querySelectorAll("[data-newev]").forEach(b=>b.addEventListener("click",()=>openEvent(null,{kind:b.dataset.newev})));
    A.querySelectorAll("[data-ewhen]").forEach(b=>b.addEventListener("click",()=>{ui.ef.when=b.dataset.ewhen;render();}));
    $("#ekind")?.addEventListener("change",e=>{ui.ef.kind=e.target.value;render();});
    $("#emine")?.addEventListener("change",e=>{ui.ef.mine=e.target.checked;render();});
  }
  if(ui.view==="khach"){
    $("#docxRep")?.addEventListener("click",exportCustDocx);
    $("#custSel")?.addEventListener("change",e=>{ui.cust=e.target.value;render();});
    document.querySelectorAll("[data-custadd]").forEach(c=>c.addEventListener("change",()=>{ const k=c.dataset.custadd; const a=new Set(ui.custAdd||[]); c.checked?a.add(k):a.delete(k); ui.custAdd=[...a]; render(); }));
    $("#copyRep")?.addEventListener("click",()=>{ const t=custSummary(); navigator.clipboard.writeText(t).then(()=>toast("Đã sao chép tóm tắt"),()=>{ showDrawer('<div class="dh"><h2>Tóm tắt gửi khách</h2><button class="btn sm" data-close>Đóng</button></div><div class="db"><textarea rows="18" style="width:100%">'+esc(t)+'</textarea><div class="sub">Chọn toàn bộ rồi sao chép.</div></div>'); ui.drawer=()=>{}; }); });
  }
}
boot();
</script>
</body></html>
