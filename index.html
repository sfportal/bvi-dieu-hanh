<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>BVI Điều hành</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar + tabs on desktop, bottom nav on phone; content as working lists, drawer for detail. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece5; --line:#d5dbd1; --fg:#17201a; --muted:#5b6a5f;
  --brand:#1f5b3c; --brand-ink:#ffffff; --done:#1f5b3c; --doing:#e2a516; --todo:#ffffff;
  --good:#2f7d4f; --warn:#b7791f; --bad:#b83a2e; --info:#2f5f8a; --chip:#eef2ea;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201b; --sunk:#0d120f; --line:#2b362f; --fg:#e7ede8; --muted:#9aaa9f;
  --brand:#5fb184; --brand-ink:#0d1a12; --done:#5fb184; --doing:#e8b53a; --todo:#18201b;
  --good:#5fb184; --warn:#e0a33f; --bad:#e2685b; --info:#7fb0dc; --chip:#202a23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201b; --sunk:#0d120f; --line:#2b362f; --fg:#e7ede8; --muted:#9aaa9f;
  --brand:#5fb184; --brand-ink:#0d1a12; --done:#5fb184; --doing:#e8b53a; --todo:#18201b;
  --good:#5fb184; --warn:#e0a33f; --bad:#e2685b; --info:#7fb0dc; --chip:#202a23; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--doing);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;padding-block:10px;max-width:1280px;margin:0 auto}
.logo{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{display:inline-grid;grid-template-columns:repeat(3,6px);gap:2px}
.logo i b{width:6px;height:6px;border-radius:1px;background:var(--done)}
.logo i b.y{background:var(--doing)} .logo i b.w{background:var(--todo);outline:1px solid var(--line)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
.subnav{display:flex;gap:6px;overflow-x:auto;max-width:1280px;margin:0 auto;padding-bottom:8px;scrollbar-width:none}
.subnav:empty{display:none}
.subnav a{padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
.subnav a[aria-current="page"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
nav.tabs a{padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--chip);color:var(--fg)}
.me{display:flex;align-items:center;gap:8px;white-space:nowrap}
.me select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;max-width:150px}
main{max-width:1280px;margin:0 auto;padding-block:16px 96px}
h1{font-size:20px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
button.tile:hover{border-color:var(--brand)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:12px;letter-spacing:.02em}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)} .tile.good .v{color:var(--good)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.cols{display:grid;gap:12px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.funnel{display:grid;gap:6px}
.frow{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:13px;background:none;border:0;padding:2px 0;text-align:left}
.frow:hover .fname{color:var(--brand)}
.fbar{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.fbar span{display:block;height:100%}
.n{font-variant-numeric:tabular-nums;text-align:right}
.bar9{display:inline-grid;grid-template-columns:repeat(9,14px);gap:2px;vertical-align:middle}
.bar9 b{height:14px;border-radius:2px;background:var(--todo);outline:1px solid var(--line);outline-offset:-1px;font-size:9px;line-height:14px;text-align:center;color:var(--muted);font-weight:500}
.bar9 b.d{background:var(--done);outline-color:var(--done);color:var(--brand-ink)}
.bar9 b.c{background:var(--doing);outline-color:var(--doing);color:#2a1d00}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--chip);white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--info)}
.pill.grp{font-weight:700;min-width:22px;justify-content:center}
.pill.A{background:var(--brand);color:var(--brand-ink)} .pill.B{background:var(--chip);color:var(--brand);outline:1px solid var(--brand);outline-offset:-1px} .pill.C{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
textarea{resize:vertical;line-height:1.45;overflow-wrap:anywhere}
.filters input,.filters select,.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.list{display:flex;flex-direction:column;gap:6px}
.zone{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.zone:hover{border-color:var(--brand)}
.zone .nm{font-weight:600;overflow-wrap:anywhere}
.zone .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.zone .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media (max-width:640px){.zone{grid-template-columns:28px minmax(0,1fr)}.zone .rt{grid-column:2;align-items:flex-start}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.alert{padding:10px 12px;border-radius:8px;background:var(--chip);font-size:13px}
.alert.bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.tw{overflow-x:auto}
.mono{font-family:var(--f-mono);font-size:12px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.db{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.f{display:grid;gap:4px}
.f label{font-size:12px;color:var(--muted)}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.f2>*{min-width:0}
.drawer select{max-width:100%}
.plrv select,.plrv input:not([type=checkbox]){width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.plrv label.row>input:not([type=checkbox]){width:auto;flex:1}
.plrv .panel>.row select{width:auto}
@media (max-width:480px){.f2{grid-template-columns:1fr}}
.steps{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font-weight:600;font-variant-numeric:tabular-nums}
.steps button.d{background:var(--done);color:var(--brand-ink);border-color:var(--done)}
.steps button.c{background:var(--doing);color:#2a1d00;border-color:var(--doing)}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.chk input{margin-top:3px}
.gate{border:1.5px solid var(--doing);border-radius:8px;padding:8px 10px;background:var(--surface)}
.mil{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;font-size:13px}
.mil .past{color:var(--muted)}
/* tasks */
.epic{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.epic>.eh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;width:100%;background:none;border:0;text-align:left}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:120px}
.prog span{display:block;height:100%;background:var(--done)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.trow.sub{padding-left:36px;background:var(--bg)}
.trow .t{display:flex;gap:8px;align-items:center;min-width:0}
.trow .t span.tt{overflow-wrap:anywhere}
.raci{display:inline-flex;gap:3px;flex-wrap:wrap}
.raci b{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--chip)}
.raci b.R{background:var(--brand);color:var(--brand-ink)} .raci b.A{outline:1px solid var(--brand);outline-offset:-1px;color:var(--brand)}
.st{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;background:var(--surface)}
.st.done{color:var(--good)} .st.doing{color:var(--warn)} .st.wait{color:var(--info)} .st.late{color:var(--bad)}
.matrix th,.matrix td{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi label{display:flex;gap:4px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surface)}
/* bottom nav */
nav.bot{display:none}
@media (max-width:760px){
  nav.tabs{display:none}
  nav.bot{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(40px,1fr);overflow-x:auto;scrollbar-width:none;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  nav.bot a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:9.5px;white-space:nowrap;letter-spacing:-.2px;color:var(--muted);text-decoration:none;min-height:52px;justify-content:center}
  nav.bot a[aria-current="page"]{color:var(--brand);font-weight:600}
  nav.bot svg{width:20px;height:20px}
  .me .lbl{display:none}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60;font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block;outline:1px solid var(--line);outline-offset:-1px}
.custhead{border-left:4px solid var(--brand);padding-left:12px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}
.focusbar{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.focusbar button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.focusbar button[aria-pressed=true]{background:var(--fg);color:var(--surface)}
.pickrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pickrow>.zone{flex:1 1 300px}
.pchips{display:flex;gap:4px}
.pchips button{min-width:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;font-size:13px}
.pchips button[aria-pressed=true]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.ev .dt{display:flex;flex-direction:column;align-items:center;border-radius:8px;background:var(--sunk);padding:4px 0;font-size:11px;color:var(--muted)}
.ev .dt b{font-size:18px;color:var(--fg);line-height:1.1}
.ev .nm{font-weight:600;overflow-wrap:anywhere}
.ev .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.dayh{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumbs figure{margin:0;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.thumbs img{display:block;width:100%;height:96px;object-fit:cover}
.thumbs .doc{display:flex;align-items:center;justify-content:center;height:96px;font-size:12px;padding:6px;text-align:center;overflow-wrap:anywhere}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:var(--surface);font-size:11px;padding:2px 6px}
.qr{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.docrow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px 8px;padding:9px 0;border-top:1px solid var(--line)}
.docrow .no{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);padding-top:2px}
.docrow .ctl{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dst{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dst button{border:0;background:var(--surface);padding:6px 10px;font-size:12.5px;font-weight:500;color:var(--muted)}
.dst button+button{border-left:1px solid var(--line)}
.dst button[aria-pressed=true].ok{background:var(--good);color:#fff}
.dst button[aria-pressed=true].fix{background:var(--warn);color:#fff}
.dst button[aria-pressed=true].none{background:var(--sunk);color:var(--fg);font-weight:600}
.cp{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chart{width:100%;min-width:520px;height:auto;display:block}.stv td:first-child{min-width:140px}.chart text{fill:var(--muted);font-size:11px}.chart .lbl{fill:var(--fg);font-weight:600}.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.kv i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
[hidden]{display:none!important}
.dqg{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;margin-top:6px}
.dq{position:relative;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:8px;padding:7px 0;font:600 13px/1 ui-monospace,monospace;cursor:pointer;min-height:34px}
.dq.ok{background:var(--good);border-color:var(--good);color:#fff}.dq.fix{background:var(--warn);border-color:var(--warn);color:#fff}
.dq i{position:absolute;top:1px;right:3px;font:700 9px/1 sans-serif;font-style:normal;opacity:.85}
label:has(> input[data-drive]){display:none}
a.btn{color:inherit;text-decoration:none}
.faqq{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.faqc{display:block;width:100%;cursor:pointer;font:inherit;color:inherit}
.cp[aria-pressed=true]{border-color:var(--brand);color:var(--brand);font-weight:600;background:var(--chip)}
.hsc{display:inline-flex;gap:2px}.hsc i{font:700 10px/1 ui-monospace,monospace;font-style:normal;width:15px;height:15px;display:inline-grid;place-items:center;border-radius:4px;background:var(--sunk);color:var(--muted)}.hsc i.good{background:var(--good);color:#fff}.hsc i.warn{background:var(--warn);color:#fff}
.hsb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px;cursor:pointer;display:grid;gap:3px;justify-items:center;min-width:58px}.hsb:hover{border-color:var(--brand)}.hsh{font-size:10.5px;color:var(--muted);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsg td,.hsg th{padding:6px 5px;vertical-align:middle}.hsg th{font-size:12px;white-space:nowrap}.hsg td:first-child{min-width:150px;position:sticky;left:0;background:var(--surface);z-index:1}.hsg th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.hsrow{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;background:var(--surface)}.hsrow.foc{border-color:var(--brand);box-shadow:0 0 0 2px var(--chip)}.hsrow .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.docbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);margin:6px 0 2px}
.docbar span{display:block;height:100%}
.chk-list{display:grid;gap:4px;margin-top:6px}
.chk-i{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;font-size:13px;align-items:start}
.chk-i .ic{font-weight:700;text-align:center}
.chk-i.ok .ic{color:var(--good)} .chk-i.warn .ic{color:var(--warn)} .chk-i.bad .ic{color:var(--bad)}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.ai-box{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:13px}
.trow .t{flex-wrap:wrap}
.trow .t .btn{flex:1 1 200px;min-width:0}
@media (max-width:760px){
  .trow{grid-template-columns:minmax(0,1fr)}
  .trow>.row{flex-wrap:wrap;gap:6px;padding-left:26px}
  .trow.sub{padding-left:24px}
}
</style>

</head><body>
<header class="top"><div class="topin wrap">
  <div class="logo"><i><b></b><b></b><b></b><b></b><b class="y"></b><b class="w"></b><b class="w"></b><b class="w"></b><b class="w"></b></i>BVI Điều hành</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="me" id="meBox"><button class="btn sm" id="meBtn" style="max-width:220px;overflow:hidden;text-overflow:ellipsis">Tài khoản</button><select id="meSel" hidden></select></div>
</div><nav class="subnav wrap" id="subnav" aria-label="Mục con"></nav></header>
<main class="wrap" id="app"><div class="empty">Đang tải dữ liệu chung của đội…</div></main>

/* ---------- zone logic ---------- */
function grp(z){ if(!z.unitId&&!z.unit) return "C"; return z.ordered?"A":"B"; }
function nextMil(z){
  const st=z.step;
  if(st===null||st===undefined) return {label:"Xác định bước hiện tại",date:null};
  if(st>=7) return {label:st===7?"Chờ phía Trung Quốc":"Duy trì, hậu kiểm",date:null,wait:true};
  if(!z.T) return {label:"Chốt mốc T",date:null};
  if(st<=1) return {label:"Chốt danh sách, hình thức đứng mã",date:z.T};
  if(st===2) return {label:"Khảo sát xong",date:addDays(z.T,10)};
  if(st===3) return {label:"Chốt sổ lần 1",date:addDays(z.T,15)};
  if(st===4) return {label:"Tập huấn, ký hồ sơ xong",date:addDays(z.T,23)};
  if(st===5) return {label:"Xã kiểm tra",date:addDays(z.T,27)};
  if(st===6){ if(z.submitted) return {label:"Có mã nội địa (dự kiến)",date:addDays(z.submitted,15),wait:true}; return {label:"Nộp Cổng DVC",date:addDays(z.T,30)}; }
  return {label:"",date:null};
}
function zstatus(z){
  const m=nextMil(z);
  if(z.step===null||z.step===undefined) return {k:"unk",t:"Chưa rõ bước",c:"info",late:0,m};
  if(z.step>=7) return {k:"wait",t:z.step===7?"Chờ phía TQ":"Duy trì mã",c:"good",late:0,m};
  if(!m.date) return {k:"unk",t:"Chưa có mốc T",c:"info",late:0,m};
  const late=diffDays(todayStr(),m.date);
  if(m.wait) return {k:"wait",t:"Chờ cơ quan",c:"info",late:0,m};
  if(late<=2) return {k:"ok",t:late>0?"Đúng tiến độ (+"+late+"n)":"Đúng tiến độ",c:"good",late,m};
  if(late<=7) return {k:"warn",t:"Trễ nhẹ "+late+" ngày",c:"warn",late,m};
  return {k:"bad",t:"Trễ nặng "+late+" ngày",c:"bad",late,m};
}

async function importJson(file){

  const C=j.collections||{}; const rows=[], fins=[];
  COLS.forEach(col=>Object.entries(C[col]||{}).forEach(([id,d])=>{ if(!d||typeof d!=="object") return; if(col==="contracts"){ const {pub,fin}=finSplit(d); rows.push({col,id,data:pub}); fins.push({id,data:fin}); } else rows.push({col,id,data:d}); }));
  if(!rows.length){ m.textContent="File không có dữ liệu."; return; }
  for(let i=0;i<rows.length;i+=200){ m.textContent="Đang ghi "+Math.min(i+200,rows.length)+"/"+rows.length+"…"; const {error}=await SB.rpc("import_docs",{p_rows:rows.slice(i,i+200)}); if(error){ m.textContent="Lỗi: "+error.message; return; } }
  if(fins.length){ const {error}=await SB.from("contract_fin").upsert(fins); if(error){ m.textContent="Đã ghi dữ liệu, nhưng lỗi phần tài chính: "+error.message; return; } }
  await logEv("import","nhập dữ liệu từ file "+file.name+": "+rows.length+" bản ghi"); await loadAll(); m.textContent="Đã chuyển "+rows.length+" bản ghi."; render();
}

const API_RES={zones:"Vùng trồng",tasks:"Công việc",events:"Lịch công tác",leaves:"Lịch nghỉ",daily:"Báo cáo ngày",units:"Công ty, khách hàng",people:"Nhân sự",faqs:"Hỏi đáp",supports:"Yêu cầu hỗ trợ",contracts:"Hợp đồng (không có số tiền)"};
let APIK=null, APIERR="";
async function callApiAdmin(body){
  try{ const {data}=await SB.auth.getSession(); const res=await fetch(SB_URL+"/functions/v1/api/admin",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+(data.session?.access_token||"")},body:JSON.stringify(body)});
    let j=null; try{ j=await res.json(); }catch(_){} return j||{error:"http_"+res.status}; }catch(e){ return {error:"Không kết nối được máy chủ"}; } }
async function loadApiKeys(){ const r=await callApiAdmin({action:"list"}); if(r.error){ APIERR=r.error==="owner_only"?"Chỉ owner quản lý API.":r.error; APIK=[]; } else { APIERR=""; APIK=r.keys||[]; } if(ui.view==="api") render(); }
function apiTime(x){ if(!x) return '<span class="sub">—</span>'; const d=new Date(x); return d.toLocaleDateString("vi-VN")+' '+String(d.getHours()).padStart(2,"0")+':'+String(d.getMinutes()).padStart(2,"0"); }
function apiState(k){ if(k.revoked_at) return '<span class="pill bad">Đã thu hồi</span>'; if(k.expires_at&&new Date(k.expires_at)<new Date()) return '<span class="pill warn">Hết hạn</span>'; return '<span class="pill good">Đang dùng</span>'; }

   +'<div class="sub" style="margin-top:8px">Tham số: <code>limit</code> (1 đến 1000, mặc định 500), <code>offset</code>, <code>updated_since</code> (ISO 8601, chỉ lấy bản ghi sửa từ thời điểm đó). Kết quả có <code>total</code> và <code>next_offset</code> để lấy trang tiếp. Tối đa 120 lượt mỗi phút cho mỗi khóa.</div>'

}
function apiScopeBoxes(sel){ return '<div class="row" style="flex-wrap:wrap;gap:6px 14px;margin-top:4px">'+Object.entries(API_RES).map(([k,l])=>'<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-apis="'+k+'"'+(sel.includes(k)?" checked":"")+'> '+esc(l)+'</label>').join("")+'</div>'; }

function openApiNew(){
  showDrawer('<div class="dh"><div><h2>Tạo khóa API</h2><div class="sub">Khóa chỉ hiện một lần sau khi tạo. Hãy gửi cho đối tác qua kênh riêng.</div></div><button class="btn sm" data-close>Đóng</button></div><div class="db">'
   +'<label>Tên đối tác hoặc mục đích<input id="apiN" maxlength="80" placeholder="Ví dụ: Yanning Hải Nam, đồng bộ báo cáo"></label>'
   +'<div style="margin-top:10px"><b>Dữ liệu được đọc</b>'+apiScopeBoxes(["zones","tasks","events"])+'</div>'
   +'<label style="margin-top:10px">Thời hạn<select id="apiD"><option value="30">30 ngày</option><option value="90" selected>90 ngày</option><option value="365">1 năm</option><option value="0">Không hạn</option></select></label>'
   +'<div class="row" style="margin-top:14px"><button class="btn pri" id="apiGo">Tạo khóa</button><span class="sub" id="apiMsg"></span></div></div>');
  $("#apiGo").addEventListener("click",async()=>{ const b=$("#apiGo"); const name=$("#apiN").value.trim(), scopes=apiPicked();
    if(!name){ $("#apiMsg").textContent="Cần nhập tên"; return; } if(!scopes.length){ $("#apiMsg").textContent="Chọn ít nhất một loại dữ liệu"; return; }
    b.disabled=true; $("#apiMsg").textContent="Đang tạo…"; const r=await callApiAdmin({action:"create",name,scopes,days:Number($("#apiD").value)});
    if(r.error){ b.disabled=false; $("#apiMsg").textContent=r.error; return; }
    APIK=null; loadApiKeys(); showApiKey(r.key,r.meta); });

function showApiKey(key,m){
  showDrawer('<div class="dh"><div><h2>Khóa API cho '+esc(m.name)+'</h2></div><button class="btn sm" data-close>Đóng</button></div><div class="db">'
   +'<div class="alert bad">Sao chép và lưu khóa ngay. Đóng cửa sổ này là không xem lại được. Mất khóa thì tạo khóa mới và thu hồi khóa cũ.</div>'
   +'<textarea id="apiKeyT" readonly rows="2" class="mono" style="width:100%;margin-top:10px">'+esc(key)+'</textarea>'
   +'<div class="row" style="margin-top:8px"><button class="btn pri" id="apiKeyC">Sao chép khóa</button></div>'
   +'<div class="sub" style="margin-top:10px">Địa chỉ gốc: <span class="mono">'+esc(API_BASE)+'</span></div></div>');
  $("#apiKeyC").addEventListener("click",()=>{ navigator.clipboard?.writeText(key).then(()=>toast("Đã sao chép khóa"),()=>{ $("#apiKeyT").select(); toast("Chọn và sao chép thủ công"); }); });
}
function openApiEdit(id){ const k=(APIK||[]).find(x=>x.id===id); if(!k) return;
  showDrawer('<div class="dh"><div><h2>Sửa quyền khóa</h2><div class="sub mono">'+esc(k.prefix)+'…</div></div><button class="btn sm" data-close>Đóng</button></div><div class="db">'
   +'<label>Tên<input id="apiN" maxlength="80" value="'+esc(k.name)+'"></label><div style="margin-top:10px"><b>Dữ liệu được đọc</b>'+apiScopeBoxes(k.scopes||[])+'</div>'
   +'<div class="row" style="margin-top:14px"><button class="btn pri" id="apiSave">Lưu</button><span class="sub" id="apiMsg"></span></div></div>');
  $("#apiSave").addEventListener("click",async()=>{ const scopes=apiPicked(); if(!scopes.length){ $("#apiMsg").textContent="Chọn ít nhất một loại dữ liệu"; return; }
    $("#apiMsg").textContent="Đang lưu…"; const r=await callApiAdmin({action:"update",id,name:$("#apiN").value.trim(),scopes}); if(r.error){ $("#apiMsg").textContent=r.error; return; }
    closeDrawer(); toast("Đã lưu"); loadApiKeys(); });
}
function bindApi(A){
  $("#apiAdd")?.addEventListener("click",openApiNew);
  $("#apiRe")?.addEventListener("click",()=>{ APIK=null; render(); });
  const cp=t=>navigator.clipboard?.writeText(t).then(()=>toast("Đã sao chép"),()=>toast("Chọn và sao chép thủ công"));
  $("#apiCpBase")?.addEventListener("click",()=>cp(API_BASE)); $("#apiCpMcp")?.addEventListener("click",()=>cp(API_BASE.replace(/\/v1$/,"")+"/mcp")); $("#apiCpDoc")?.addEventListener("click",()=>cp("https://sfportal.github.io/bvi-dieu-hanh/api.html")); $("#apiCpEx")?.addEventListener("click",()=>cp($("#apiEx").value));
  A.querySelectorAll("[data-apied]").forEach(b=>b.addEventListener("click",()=>openApiEdit(b.dataset.apied)));
  const twice=(b,label,fn)=>b.addEventListener("click",async()=>{ if(b.dataset.arm!=="1"){ b.dataset.arm="1"; b.textContent=label; b.classList.add("bad"); setTimeout(()=>{ if(b.isConnected){ b.dataset.arm=""; render(); } },4000); return; } b.disabled=true; await fn(); });
  A.querySelectorAll("[data-apirv]").forEach(b=>twice(b,"Bấm lần nữa để thu hồi",async()=>{ const r=await callApiAdmin({action:"revoke",id:b.dataset.apirv}); toast(r.error||"Đã thu hồi, khóa không dùng được nữa"); loadApiKeys(); }));
  A.querySelectorAll("[data-apidel]").forEach(b=>twice(b,"Bấm lần nữa để xóa",async()=>{ const r=await callApiAdmin({action:"delete",id:b.dataset.apidel}); toast(r.error||"Đã xóa khóa"); loadApiKeys(); }));
}

function shActs(zs){ const ids=new Set(zs.map(([id])=>id)); const zn=id=>zShort(S.zones[id]?.name||""); const now=Date.now(), out=[];
  Object.entries(S.tasks).forEach(([tid,t])=>{ if(!ids.has(t.zone)||t.status!=="done"||!t.doneAt) return; const d=new Date(t.doneAt); if(now-d>30*864e5) return;
    out.push({k:"d:"+tid,kind:"done",date:t.doneAt.slice(0,10),zone:zn(t.zone),text:tTitle(t,S.zones[t.zone])}); });

    const zz=new Set(), tt=[]; if(e.zoneId&&ids.has(e.zoneId)) zz.add(e.zoneId); (e.taskIds||[]).forEach(tid=>{ const t=S.tasks[tid]; if(t&&ids.has(t.zone)){ zz.add(t.zone); const x=tTitle(t,S.zones[t.zone]); if(x&&!tt.includes(x)) tt.push(x); } });

  return out.sort((a,b)=>a.kind===b.kind?(a.kind==="done"?b.date.localeCompare(a.date):a.date.localeCompare(b.date)):a.kind==="plan"?-1:1); }
const shSafe=v=>typeof v==="string"?v.replace(/(?:\+?84)?\d(?:[\s.\-]?\d){8,}/g,"•••"):Array.isArray(v)?v.map(shSafe):v&&typeof v==="object"?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,shSafe(x)])):v;

function exShrink(f){ return new Promise((ok,no)=>{ const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{ try{ const m=1800, s=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s); const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",0.85)); }catch(e){ no(e); } finally{ URL.revokeObjectURL(url); } };
  img.onerror=()=>{ URL.revokeObjectURL(url); no(new Error("Không mở được ảnh")); }; img.src=url; }); }

async function drvShrink(f){ // ảnh lớn thu về cạnh dài 2400px, JPEG 85%, giữ nguyên file khác
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<1.5e6) return {blob:f,name:f.name,type:f.type||"application/octet-stream"};
  try{ const bm=await createImageBitmap(f); const s=Math.min(1,2400/Math.max(bm.width,bm.height)); const c=document.createElement("canvas"); c.width=Math.round(bm.width*s); c.height=Math.round(bm.height*s); c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85)); if(b&&b.size<f.size) return {blob:b,name:f.name.replace(/\.(png|webp|jpe?g)$/i,"")+".jpg",type:"image/jpeg"}; }catch(e){}
  return {blob:f,name:f.name,type:f.type}; }
async function drvUpload(zid,key,files){ files=[...files]; if(!files.length) return; const z=S.zones[zid]; if(!z?.drv?.[key]){ toast(drvErr("no_folder")); return; }
  const st=DUP[zid]={key,total:files.length,done:0,fail:[],busy:true,urls:[]}; drvRedraw();
  let i=0; const work=async()=>{ while(i<files.length){ const f=files[i++]; try{ const p=await drvShrink(f); if(p.blob.size>20.5e6) throw new Error("too_big");
      const r=await drvCall({action:"upload",zone:zid,key,name:p.name,mime:p.type,data:await drvBlobB64(p.blob)}); if(!r||r.error) throw new Error(r?.error||"upload"); if(r.url) st.urls.push(r.url);

function drvProg(zid){ const s=DUP[zid]; if(!s) return ""; const pc=Math.round(100*s.done/(s.total||1));
  return '<div class="sub" style="margin-top:6px">'+(s.busy?'Đang tải '+s.done+'/'+s.total+' file vào '+esc(DRV_SHORT[s.key])+'…':'Xong: '+(s.total-s.fail.length)+'/'+s.total+' file vào '+esc(DRV_SHORT[s.key]))+'</div><div style="height:6px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:4px"><div style="height:100%;width:'+pc+'%;background:'+(s.fail.length?'var(--warn)':'var(--good)')+'"></div></div>'+(s.fail.length?'<div class="sub" style="color:var(--bad);margin-top:4px">'+s.fail.slice(0,5).map(esc).join("<br>")+(s.fail.length>5?'<br>…':'')+'</div>':''); }
async function drvApply(zid,m,at,deep){ const z=S.zones[zid]; if(!z) return; m={...m};
  // Apps Script cũ không đếm thư mục con: không hạ số sổ đỏ, CCCD đã đếm trước đó
  if(!deep) ["sodo","cccd"].forEach(k=>{ const o=(z.drvStat||{})[k]; if(typeof o==="number"&&o>(m[k]||0)) m[k]=o; });
  const patch={drvStat:m,drvScanAt:at};
  const hs={...(z.hs||{})}; let hch=false; Object.entries(DRV_HS).forEach(([k,fs])=>{ if(fs.some(f=>m[f]>0)&&!(hs[k]||{}).drive){ hs[k]={...(hs[k]||{}),drive:true,by:me||"",at}; hch=true; } }); if(hch) patch.hs=hs;
  if(JSON.stringify(z.drvStat||{})===JSON.stringify(m)&&!hch){ z.drvScanAt=at; await upd("zones",zid,{drvScanAt:at}); return; } await upd("zones",zid,patch); }
// quét theo từng đợt nhỏ (4 vùng mỗi lần) để không vượt giới hạn thời gian của máy chủ
async function drvScan(zid,quiet,onProg){ let ids;
  if(zid) ids=Array.isArray(zid)?zid:[zid];
  else { const l=await drvCall({action:"scan",list:true}); ids=l?.ids||Object.keys(S.zones).filter(k=>S.zones[k].drv); }
  // quét lần lượt từng vùng, mỗi vùng một lần gọi, để không bị quá thời gian
  const fail=[]; let done=0, shallow=false;
  for(let i=0;i<ids.length;i++){ const id=ids[i]; if(onProg) onProg(i,ids.length,S.zones[id]?.name||id);
    const r=await drvCall({action:"scan",zone:id});
    if(r?.error==="not_configured"||r?.error==="bad_token"){ toast(drvErr(r.error)); return false; }
    const m=r?.zones?.[id]; if(!r||r.error||!m){ fail.push(id); continue; }
    if(!r.deep) shallow=true; await drvApply(id,m,r.at,r.deep); done++; }
  if(onProg) onProg(done,ids.length);
  window.__drvShallow=shallow;
  if(fail.length) toast("Quét được "+done+"/"+ids.length+" vùng. Lỗi: "+fail.map(id=>S.zones[id]?.name||id).slice(0,4).join(", ")+(fail.length>4?"…":""));
  else if(!quiet) toast((ids.length===1?"Đã quét lại thư mục":"Đã quét "+done+" vùng")+(shallow?". Apps Script chưa cập nhật nên chưa đếm file trong thư mục con":""));
  return !fail.length; }
function drvAt(t){ if(!t) return "Chưa quét"; const d=new Date(t); return esc(dmy(t.slice(0,10)))+" "+esc(d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})); }
async function drvRename(zid){ const r=await drvCall({action:"rename",zone:zid}); if(r?.ok) toast("Đã đổi tên thư mục Drive: "+r.name); else if(r?.error&&r.error!=="not_configured") toast("Chưa đổi được tên thư mục Drive: "+drvErr(r.error)); }

  const ks=keys.filter(k=>z.drv[k]); const lk=DUP[zid]?.key; const d=lk&&ks.includes(lk)?lk:ks.includes(def)?def:ks[0];
  return '<div class="drvup" data-dupz="'+zid+'"><div class="row" style="gap:6px;flex-wrap:wrap;align-items:center"><select data-dupk aria-label="Thư mục nhận file" style="max-width:240px">'+ks.map(k=>{ const L=DRV_LEAF.find(x=>x[0]===k); return '<option value="'+k+'"'+(k===d?" selected":"")+'>'+esc((L[2]!==k?L[3].replace(/^\d+ /,"")+" › ":"")+L[1])+'</option>'; }).join("")+'</select>'
    +'<label class="btn sm pri" style="cursor:pointer">Chọn ảnh, file để tải<input type="file" multiple data-dupf accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,video/*" hidden></label></div><div data-dup="'+zid+'">'+drvProg(zid)+'</div></div>'; }

/* ---------- theo dõi bản cứng: thu bìa, in, đưa dân ký, lấy lại, scan, nộp ---------- */
const BC_ST=[["bia","Đủ bìa"],["in","Đã in"],["ky","Đưa dân ký"],["lay","Đã lấy lại"],["scan","Đã scan"],["nop","Đã nộp"]];
const BC_OVER=7; // đưa dân ký quá số ngày này mà chưa lấy lại thì báo
function bcOf(z){ return z.bc||{}; }
function bcScan(z){ const b=bcOf(z); return !!b.scan||drvN(z,"hs01_scan")>0||drvN(z,"tq_scan")>0; }
function bcDone(z,k){ const b=bcOf(z); if(k==="bia") return b.bia==="du"; if(k==="scan") return bcScan(z); return !!b[k]; }
function bcStage(z){ let s=-1; BC_ST.forEach(([k],i)=>{ if(bcDone(z,k)) s=i; }); return s; }
function bcDays(d){ if(!d||d==="x") return null; return Math.floor((Date.parse(todayStr())-Date.parse(d))/864e5); }
function bcNext(z){ const b=bcOf(z); if(b.bia!=="du") return b.bia==="?"?"Tìm bìa đang ở đâu":"Thu đủ bìa"; if(!b.in) return "In, xuất hồ sơ"; if(!b.ky) return "Đưa dân ký"; if(!b.lay) return "Lấy lại bản đã ký"; if(!bcScan(z)) return "Scan bản ký, tải lên Drive"; if(!b.nop) return "Nộp hồ sơ"; return "Xong"; }
function bcAsk(z){ const b=bcOf(z), q=[]; if(b.locQ) q.push(b.locQ===true?"Hồ sơ đang ở đâu?":b.locQ); if(b.bia==="?") q.push("Bìa đang ở đâu?"); (b.miss||[]).filter(x=>!x.ok).forEach(x=>q.push(x.t)); const d=bcDays(b.ky); if(b.ky&&!b.lay&&d!=null&&d>BC_OVER) q.push("Đưa dân ký "+d+" ngày chưa lấy lại"); return q; }
async function bcSet(id,patch){ const z=S.zones[id]; if(!z) return; return upd("zones",id,{bc:{...bcOf(z),...patch,by:me||"",at:new Date().toISOString()},...stamp()}); }

  if(f.bst!=null&&f.bst!=="") rows=rows.filter(([,z])=>bcStage(z)===+f.bst);

  let h='<div class="panel"><div class="row" style="gap:6px;flex-wrap:wrap;align-items:center"><b>Bản cứng đưa dân ký</b><span class="sub">· bấm ô bước để đánh dấu xong, bấm lại để bỏ</span></div>'
   +'<div class="filters" style="margin:8px 0 0"><select id="bcst" aria-label="Đang ở bước"><option value="">Mọi bước</option><option value="-1"'+(f.bst==="-1"?" selected":"")+'>Chưa đủ bìa</option>'+BC_ST.map(([k,l],i)=>'<option value="'+i+'"'+(f.bst===String(i)?" selected":"")+'>Đã tới: '+esc(l)+'</option>').join("")+'</select>'
   +'<label class="row sub"><input type="checkbox" id="bcask"'+(f.bask?" checked":"")+'> Chỉ vùng cần hỏi, còn vướng ('+nAsk+')</label>'+(canDrv()?'<button class="btn sm" id="bcpaste">Dán ghi chú nhanh</button>':'')+'</div></div>';
  h+='<div class="tw hsg"><table><thead><tr><th>Vùng</th>'+BC_ST.map(([,l])=>'<th>'+esc(l)+'</th>').join("")+'<th>Việc tiếp theo</th><th>Cần hỏi, còn thiếu</th></tr></thead><tbody>'
   +(rows.map(([id,z])=>{ const b=bcOf(z), q=bcAsk(z);
     return '<tr><td><a href="#" data-bcz="'+id+'"><b>'+esc(z.name)+'</b></a><div class="sub">'+esc([z.ward,b.holder?hsHolder(b.holder)+" giữ":"",b.loc].filter(Boolean).join(" · "))+'</div></td>'
      +BC_ST.map(([k],i)=>{ const on=bcDone(z,k); let t=on?"✓":""; if(k==="bia"&&b.bia==="thieu") t="Thiếu"; if(k==="bia"&&b.bia==="?") t="?"; if(k==="ky"&&b.ky&&b.ky!=="x") t=dmy(b.ky).slice(0,5); if(k==="scan"&&on&&!b.scan) t=(drvN(z,"hs01_scan")||0)+(drvN(z,"tq_scan")||0)+" file";
        const od=k==="ky"&&b.ky&&!b.lay&&bcDays(b.ky)>BC_OVER;
        return '<td style="text-align:center"><button type="button" class="hsb pill '+(on?(od?"bad":"good"):(t?"warn":""))+'" data-bcs="'+id+'|'+k+'" title="'+esc(BC_ST[i][1])+'" style="min-width:42px">'+esc(t||"·")+'</button></td>'; }).join("")
      +'<td class="sub">'+esc(bcNext(z))+'</td><td>'+(q.length?q.map(x=>'<span class="pill warn" style="margin:1px">'+esc(x)+'</span>').join(""):'<span class="sub">Không</span>')+(b.note?'<div class="sub">'+esc(b.note)+'</div>':'')+'</td></tr>'; }).join("")||'<tr><td colspan="9" class="sub">Không có vùng khớp bộ lọc.</td></tr>')+'</tbody></table></div>';
  return h; }

   +(bcScan(z)&&!b.scan?'<div class="sub">Drive đã có '+((drvN(z,"hs01_scan")||0)+(drvN(z,"tq_scan")||0))+' file trong thư mục Bản scan đã ký, tính là đã scan.</div>':'')

   +'<div class="ctl"><input data-bct="loc" value="'+esc(b.loc||"")+'" placeholder="Vị trí cụ thể: tủ nào, nhà ai, hồ sơ cũ để đâu" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface)"><button type="button" class="cp" data-bcq aria-pressed="'+(!!b.locQ)+'">'+(b.locQ?"✓ ":"")+'Chưa rõ hồ sơ ở đâu</button></div>'

function bcParse(text){ const zs=Object.entries(S.zones).filter(([,z])=>z.active!==false); const key=s=>norm(s).replace(/vung trong sau rieng|vung trong|sau rieng/g,"").replace(/['’]/g,"").replace(/\s+/g," ").trim();

    const nm=line.slice(0,i), st=line.slice(i+1).trim(); const s=norm(st);
    const names=nm.replace(/\(([^)]*)\)/g,(a,b)=>"|"+b).split(/,|&| và /).map(x=>x.trim()).filter(Boolean);
    const ids=bcMatch(zk,key,names);
    const p={}; const miss=[];
    if(/du bia/.test(s)) p.bia="du"; if(/thieu (anh )?bia/.test(s)) p.bia="thieu"; if(/bia dau/.test(s)) p.bia="?";
    if(/\bin\b|xuat ho so/.test(s)) p.in="x"; if(/chua in/.test(s)) p.in="";
    if(/dua dan k[iy]/.test(s)){ const dm=s.match(/(\d{1,2})\/(\d{1,2})(?!\d)/); if(dm){ p.ky=yr+"-"+dm[2].padStart(2,"0")+"-"+dm[1].padStart(2,"0"); p.in=p.in||"x"; } else if(/chua lay|da dua/.test(s)) p.ky="x"; }
    if(/chua lay lai/.test(s)) p.lay=""; else if(/da lay lai/.test(s)) p.lay="x";
    if(/ho so cu dau|ho so cu o dau/.test(s)) p.locQ="Hồ sơ cũ đang ở đâu?"; else if(/ho so cung dau/.test(s)) p.locQ="Hồ sơ cứng đang ở đâu?"; else if(/ho so dau/.test(s)) p.locQ="Hồ sơ đang ở đâu?";
    const bs=st.match(/bổ sung[^,(]*(\([^)]*\))?/i); if(bs) miss.push(bs[0].trim());
    const tb=st.match(/\(thiếu bìa ([^)]*)\)/i); if(tb){ delete p.bia; p.biaFor=bcMatch(zk,key,tb[1].split(/,|&| và /).map(x=>x.trim()).filter(Boolean)).filter(x=>typeof x==="string"); }

    return {line,nm,st,ids,p,miss}; }); }
function bcMatch(zk,key,names){ const out=[]; const base=key(names[0]||"").replace(/\s*\d+\s*$/,"");
  names.forEach(n=>{ const alts=n.split("|").map(x=>x.trim()).filter(Boolean).reverse(); let got=null, cnt=0;
    for(const a of alts){ let k=key(a); if(/^\d+$/.test(k)) k=base+" "+k; const k2=k.replace(/\s/g,"");
      const m=zk.filter(([,zn])=>zn.includes(k)||zn.replace(/\s/g,"").includes(k2)).filter(([,,z])=>!/khong (co )?bia|khac|khong tham gia/.test(norm(z.name)));
      const ex=m.filter(([,zn])=>zn.endsWith(" "+k)||zn===k); let pick=ex.length?ex:m;
      if(!pick.length&&k2.length>=6){ const lim=Math.max(1,Math.floor(k2.length/6)); pick=zk.filter(([,zn,z])=>!/khong (co )?bia|khac|khong tham gia/.test(norm(z.name))&&bcNear(k2,zn.replace(/\s/g,""))<=lim); }
      cnt=pick.length; if(pick.length===1){ got=pick[0][0]; break; } }
    out.push(got||{n:n.replace(/\|/g," "),c:cnt}); }); return out; }
function bcNear(a,t){ let best=99; for(let L=a.length-1;L<=a.length+1;L++) for(let i=0;i+L<=t.length;i++){ const b=t.slice(i,i+L); const d=[...Array(b.length+1).keys()];
    for(let x=1;x<=a.length;x++){ let p=d[0]; d[0]=x; for(let y=1;y<=b.length;y++){ const q=d[y]; d[y]=Math.min(d[y]+1,d[y-1]+1,p+(a[x-1]===b[y-1]?0:1)); p=q; } } if(d[b.length]<best) best=d[b.length]; } return best; }

function locD(x){ if(!x) return ""; const d=new Date(x); if(isNaN(d)) return ""; return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function plMatch(t,m){ if(!t.planDate) return false; const t0=todayStr(), a=wkStart(t0); return m==="today"?t.planDate===t0:m==="wk"?(t.planDate>=a&&t.planDate<=addDays(a,6)):m==="nwk"?(t.planDate>=addDays(a,7)&&t.planDate<=addDays(a,13)):true; }
function plBadge(t){ if(!t.planDate) return ""; const late=t.status!=="done"&&t.planDate<todayStr(); return '<span class="pill" title="Đã xếp vào Kế hoạch tuần" style="'+(late?'color:var(--bad)':'color:var(--info)')+'">Lịch '+esc(wdName(t.planDate).replace("Thứ ","T").replace("Chủ nhật","CN"))+' '+dm(t.planDate)+(t.planSes?' · '+PSES[t.planSes].toLowerCase():'')+'</span>'; }
function dayMatch(t,m){ const t0=todayStr(), c=locD(t.createdAt), u=locD(t.updatedAt); return m==="new"?c===t0:m==="upd"?(u===t0&&c!==t0):true; }
function vTasks(){
  const f=ui.tf;
  const epics=Object.entries(S.tasks).filter(([,t])=>t.kind==="epic").sort((a,b)=>prRank(a[1])-prRank(b[1])||(a[1].due||"9").localeCompare(b[1].due||"9"));
  const show=t=>{ if(f.mine&&me&&!(t.R===me||t.A===me||(t.C||[]).includes(me))) return false; if(f.pr==="1"&&t.prio!=="1") return false; if(f.pr==="12"&&!t.prio) return false; if(f.r&&t.R!==f.r) return false; if(f.day&&!dayMatch(t,f.day)) return false; if(f.pl&&!plMatch(t,f.pl)) return false; if(f.st==="open"&&t.status==="done") return false; if(f.st==="late"&&!tLate(t)) return false; if(f.st==="done"&&t.status!=="done") return false; if(f.team&&t.team!==f.team) return false; return true; };
  let h='<div class="row between"><div><h1>Công việc</h1><div class="sub">Epic → Công việc → Việc con. Mỗi việc có R (thực hiện) và A (chịu trách nhiệm cuối), C (tham vấn), I (được báo), cùng mục tiêu SMART.</div></div><div class="row"><button class="btn" id="chartBtn">Biểu đồ tiến độ</button><button class="btn" id="raciBtn">Ma trận RACI</button><button class="btn pri" id="addEpic">Thêm Epic</button></div></div>';
  h+='<div class="filters"><label class="row"><input type="checkbox" id="tmine"'+(f.mine?" checked":"")+'> Việc của tôi</label>'
   +'<select id="tst"><option value="open"'+(f.st==="open"?" selected":"")+'>Đang mở</option><option value="late"'+(f.st==="late"?" selected":"")+'>Quá hạn</option><option value="done"'+(f.st==="done"?" selected":"")+'>Đã xong</option><option value="all"'+(f.st==="all"?" selected":"")+'>Tất cả</option></select>'
   +'<select id="tfR" aria-label="Lọc theo người thực hiện"><option value="">Mọi người thực hiện (R)</option>'+Object.entries(S.people).sort((a,b)=>a[1].name.localeCompare(b[1].name,"vi")).map(([k,p])=>{ const n=Object.values(S.tasks).filter(t=>t.R===k&&t.kind!=="epic"&&t.status!=="done").length; return '<option value="'+k+'"'+(f.r===k?" selected":"")+'>R: '+esc(p.name)+' ('+n+' việc mở)</option>'; }).join("")+'</select>'
   +'<select id="tpr"><option value="">Mọi mức ưu tiên</option><option value="1"'+(f.pr==="1"?" selected":"")+'>Chỉ ưu tiên cao</option><option value="12"'+(f.pr==="12"?" selected":"")+'>Ưu tiên cao và vừa</option></select>'
   +(()=>{ const all=Object.values(S.tasks), nU=all.filter(t=>dayMatch(t,"upd")).length, nN=all.filter(t=>dayMatch(t,"new")).length; return '<select id="tday" aria-label="Lọc theo hôm nay"><option value="">Mọi ngày</option><option value="upd"'+(f.day==="upd"?" selected":"")+'>Sửa hôm nay, không tính việc mới ('+nU+')</option><option value="new"'+(f.day==="new"?" selected":"")+'>Tạo hôm nay ('+nN+')</option></select>'; })()
   +(()=>{ const all=Object.values(S.tasks).filter(t=>t.kind!=="epic"), n=k=>all.filter(t=>plMatch(t,k)&&(f.st!=="open"||t.status!=="done")).length; return '<select id="tpl" aria-label="Lọc theo kế hoạch tuần"><option value="">Mọi lịch</option><option value="today"'+(f.pl==="today"?" selected":"")+'>Lịch hôm nay ('+n("today")+')</option><option value="wk"'+(f.pl==="wk"?" selected":"")+'>Lịch tuần này ('+n("wk")+')</option><option value="nwk"'+(f.pl==="nwk"?" selected":"")+'>Lịch tuần sau ('+n("nwk")+')</option><option value="any"'+(f.pl==="any"?" selected":"")+'>Đã xếp lịch, mọi tuần ('+n("any")+')</option></select>'; })()
   +'<select id="tteam"><option value="">Mọi nhóm</option>'+Object.entries(TEAMS).map(([k,l])=>'<option value="'+k+'"'+(f.team===k?" selected":"")+'>'+l+'</option>').join("")+'</select></div>';
  if(!epics.length) return h+'<div class="empty">Chưa có Epic nào. Bấm "Thêm Epic" để tạo nhóm việc đầu tiên.</div>';
  h+='<div class="list">';
  epics.forEach(([eid,e])=>{
    const kids=tKids(eid); const p=Math.round(tProg(eid)*100); const open=ui.epicOpen[eid]!==false;
    const rows=[];
    kids.forEach(([tid,t])=>{ const subs=tKids(tid); const vis=show(t)||subs.some(([,s])=>show(s)); if(!vis) return;
      rows.push(taskRow(tid,t,false,subs.length));
      subs.forEach(([sid,s])=>{ if(show(s)) rows.push(taskRow(sid,s,true,0)); }); });
    if((f.mine||f.pr||f.r||f.day||f.pl||f.st==="done"||f.st==="late")&&!rows.length&&!(f.mine?(e.R===me||e.A===me):show(e))) return;
    h+='<div class="epic"><button class="eh" data-epic-toggle="'+eid+'"><span class="pill" style="background:var(--brand);color:var(--brand-ink)">EPIC</span><span style="min-width:0"><b style="overflow-wrap:anywhere">'+esc(e.title)+'</b><div class="sub row" style="margin-top:2px">'+prBadge(e)+raciChips(e)+(e.due?'<span>Hạn '+dmy(e.due)+'</span>':'')+'<span>'+kids.length+' việc</span>'+stBadge(e)+'</div></span><span class="row"><span class="prog"><span style="width:'+p+'%"></span></span><span class="n sub">'+p+'%</span></span></button>';
    if(open){ h+=rows.join("")+'<div class="trow"><span class="row"><button class="btn sm" data-edit-task="'+eid+'">Sửa Epic</button><button class="btn sm" data-add-child="'+eid+'">Thêm công việc</button></span><span></span></div>'; }
    h+='</div>';
  });
  return h+'</div>';
}
function taskRow(id,t,isSub,nsub){
  return '<div class="trow'+(isSub?" sub":"")+'"><span class="t"><input type="checkbox" aria-label="Xong" data-done="'+id+'"'+(t.status==="done"?" checked":"")+'><button class="btn sm" style="border:0;padding:0;background:none;text-align:left;font-weight:'+(isSub?400:600)+'" data-edit-task="'+id+'"><span class="tt">'+esc(t.title)+'</span></button>'+(nsub?'<span class="sub">'+nsub+' việc con</span>':'')+(t.zone&&S.zones[t.zone]?'<span class="pill">'+esc(S.zones[t.zone].name.replace(/^v[uù]ng tr[oồ]ng s[aầ]u ri[eê]ng /i,""))+'</span>':'')+plBadge(t)+'</span><span class="row">'+prBadge(t)+raciChips(t)+(t.due?'<span class="sub mono">'+dm(t.due)+'</span>':'')+stBadge(t)+(isSub?'':'<button class="btn sm" data-add-child="'+id+'" title="Thêm việc con">+</button>')+'</span></div>';
}
function hTime(t){ if(!t) return ""; const d=new Date(t); return isNaN(d)?"":d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})+" "+d.toLocaleDateString("vi-VN"); }
function histPanel(col,id,t){
  const who=k=>esc(pname(k)||k||"");
  const rows=[]; if(t.createdAt) rows.push('<div><span class="sub">Tạo lúc</span> '+hTime(t.createdAt)+(t.createdBy?' · <b>'+who(t.createdBy)+'</b>':' · <span class="sub" id="histBy">nhập từ hệ thống</span>')+'</div>');
  if(t.updatedAt&&t.updatedAt!==t.createdAt) rows.push('<div><span class="sub">Cập nhật gần nhất</span> '+hTime(t.updatedAt)+(t.updatedBy?' · <b>'+who(t.updatedBy)+'</b>':'')+'</div>');
  if(t.status==="done"&&t.doneAt) rows.push('<div><span class="sub">Hoàn thành lúc</span> '+hTime(t.doneAt)+'</div>');
  return '<div class="panel" id="hist" style="margin-top:12px"><h2>Lịch sử</h2><div style="display:grid;gap:2px;font-size:13px">'+(rows.join("")||'<div class="sub">Chưa có thông tin.</div>')+'</div><div id="histLog" style="margin-top:8px">'+(canManage()?'<div class="sub">Đang tải nhật ký thay đổi…</div>':'<div class="sub">Nhật ký chi tiết từng lần sửa chỉ owner và quản lý xem được.</div>')+'</div></div>'; }
async function loadHist(col,id){ const box=$("#histLog"); if(!box||!canManage()) return;
  try{ const {data,error}=await SB.from("activity_log").select("at,name,email,action,summary,doc_id,col").eq("col",col).eq("doc_id",id).order("at",{ascending:false}).limit(100);
    const L=(data||[]).filter(r=>r.col===col&&r.doc_id===id); if(!$("#histLog")) return;
    if(error){ box.innerHTML='<div class="sub">Không đọc được nhật ký: '+esc(error.message)+'</div>'; return; }
    if(!L.length){ box.innerHTML='<div class="sub">Chưa có lần sửa nào được ghi lại trên web (việc tạo hoặc sửa hàng loạt từ hệ thống không ghi nhật ký).</div>'; return; }
    const cr=L.filter(r=>r.action==="create").pop(); if(cr&&$("#histBy")) $("#histBy").outerHTML='<b>'+esc(cr.name||cr.email||"")+'</b>';
    const AL={create:["Tạo","good"],update:["Sửa","warn"],delete:["Xóa","bad"]};
    box.innerHTML='<div style="display:grid">'+L.map(r=>{ const A=AL[r.action]||[r.action,""]; return '<div class="row" style="gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)"><span class="sub mono" style="flex:0 0 auto;white-space:nowrap">'+hTime(r.at)+'</span><span class="pill '+A[1]+'" style="flex:0 0 auto">'+A[0]+'</span><div style="flex:1;min-width:0;overflow-wrap:anywhere"><b>'+esc(r.name||r.email||"Hệ thống")+'</b> '+esc(r.summary||"")+'</div></div>'; }).join("")+'</div>'+(L.length>=100?'<div class="sub">Hiện 100 lần gần nhất.</div>':'');
  }catch(e){ box.innerHTML='<div class="sub">Không đọc được nhật ký.</div>'; } }
function openTask(id,preset){ ui.drawer=()=>drawTask(id,preset); drawTask(id,preset); }

    +'<div class="f"><label for="tparty">Bên phụ trách (hiện ở báo cáo khách)</label><input id="tparty" value="'+esc(t.party||"")+'" placeholder="Ví dụ: Công ty, nông hộ"></div></div>';

  h+='<div class="panel"><h2>SMART</h2>'
    +'<div class="f"><label for="sS">S · Kết quả cụ thể</label><input id="sS" value="'+esc(sm.s||"")+'" placeholder="Làm ra cái gì"></div>'

    +'<div class="f"><label for="sA">A · Khả thi: cần gì, ai hỗ trợ</label><input id="sA" value="'+esc(sm.a||"")+'"></div>'

  h+='<div class="f"><label for="tnote">Mô tả cho người được giao (làm gì, đầu ra, lưu ở đâu, cần ai)</label><textarea id="tnote" rows="3" placeholder="Ví dụ: Xuất hồ sơ 22 hộ từ FarmBase, in theo thôn, đưa chị Ngọc lưu bản gốc; scan lên Drive HoSo/Sình Thời">'+esc(t.note||"")+'</textarea></div>';

  h+='<div class="row"><button class="btn pri" type="submit">Lưu</button>'+(id?'<button class="btn" type="button" id="tdel">Xóa</button>':'')+'<span class="sub" id="tmsg"></span></div>';
  if(id){ const kids=tKids(id); if(kids.length) h+='<div class="sub">'+kids.length+' việc con bên dưới. Xóa việc này không xóa việc con.</div>'; }
  if(id&&t.zone&&S.zones[t.zone]?.drv&&canDrv()){ const tl=norm(t.title||""); const fv=t.fieldVisit||/flycam|bay|kho thuoc|thung thuoc|thu hoach|thuc dia|ky|scan|chup|anh/.test(tl);
    const dk=/flycam/.test(tl)?"fly":/bay/.test(tl)?"bay":/thu hoach/.test(tl)?"thu":/thung|kho/.test(tl)?"kho":/scan/.test(tl)?"hs01_scan":/ky|bia/.test(tl)?"hs01_anh":"fly";
    h+='<details class="panel"'+(fv?' open':'')+'><summary style="cursor:pointer"><b>Tải ảnh, file thực địa lên Drive</b> <span class="sub">· '+esc(S.zones[t.zone].name)+'</span></summary><div class="sub" style="margin:4px 0 6px">Ảnh vào thẳng thư mục của vùng trên Drive, không cần mở Drive.</div>'+drvUpBox(t.zone,[...DRV_FIELD,"hs01_scan","tq_scan","cccd","sodo"],dk)+'</details>'; }
  h+=(id?histPanel("tasks",id,t):'')+'</form>';

  const readT=()=>{ const pick=n=>[...document.querySelectorAll('input[name="'+n+'"]:checked')].map(x=>x.value);
    return {kind:t.kind,parent:t.parent,title:$("#tt").value.trim(),due:$("#tdue").value,zone:$("#tzone").value,R:$("#tR").value,A:$("#tA").value,C:pick("tC"),I:pick("tI"),smart:{s:$("#sS").value.trim(),m:$("#sM").value.trim(),a:$("#sA").value.trim(),r:$("#sR").value.trim()},note:$("#tnote").value.trim()}; };

}
function raciMatrix(){
  const ppl=Object.entries(S.people).sort((a,b)=>a[1].name.localeCompare(b[1].name,"vi"));
  const rows=Object.entries(S.tasks).filter(([,t])=>t.kind!=="sub"&&t.status!=="done").sort((a,b)=>(a[1].kind==="epic"?0:1)-(b[1].kind==="epic"?0:1)||(a[1].due||"9").localeCompare(b[1].due||"9"));
  const role=(t,k)=>[t.R===k?"R":"",t.A===k?"A":"",(t.C||[]).includes(k)?"C":"",(t.I||[]).includes(k)?"I":""].filter(Boolean).join("/");
  let h='<div class="dh"><div><h2>Ma trận RACI (việc đang mở)</h2><div class="sub">R thực hiện · A chịu trách nhiệm cuối · C tham vấn · I được báo</div></div><button class="btn sm" data-close>Đóng</button></div><div class="db"><div class="tw"><table class="matrix"><thead><tr><th>Việc</th>'+ppl.map(([,p])=>'<th>'+esc(p.name.split(" ").slice(-1)[0])+'</th>').join("")+'</tr></thead><tbody>';
  rows.forEach(([id,t])=>{ h+='<tr><td>'+(t.kind==="epic"?"<b>"+esc(t.title)+"</b>":esc(t.title))+'</td>'+ppl.map(([k])=>'<td>'+role(t,k)+'</td>').join("")+'</tr>'; });
  h+='</tbody></table></div></div>';
  showDrawer(h); ui.drawer=()=>{};
}

/* ---------- góp ý SMART · RACI ---------- */
const VAGUE=["hỗ trợ","theo dõi","xử lý","tìm hiểu","phối hợp","làm việc","kiểm tra lại","rà soát","cập nhật","chuẩn bị"];
function reviewTask(d,id){
  const out=[], add=(k,lv,msg)=>out.push({k,lv,msg}); const t=d.title||"", words=t.split(/\s+/).filter(Boolean);
  const kids=id?tKids(id).length:0; const par=d.parent&&S.tasks[d.parent]?S.tasks[d.parent]:null;
  // S
  const vague=VAGUE.find(v=>t.toLowerCase().startsWith(v)) ;
  if(!t) add("S · Cụ thể","bad","Chưa có tên việc.");
  else if(words.length<4) add("S · Cụ thể","warn","Tên việc ngắn quá. Viết theo dạng động từ + kết quả + phạm vi, ví dụ \"Nộp DVC vùng Sình Thời\".");
  else if(vague&&!d.smart.s) add("S · Cụ thể","warn","Tên bắt đầu bằng \""+vague+"\" dễ hiểu nhiều cách. Ghi rõ kết quả cần có ở ô S.");
  else if(!d.smart.s&&words.length<7) add("S · Cụ thể","warn","Nên ghi ô S: làm ra cái gì, cho vùng hay đơn vị nào.");
  else add("S · Cụ thể","ok","Rõ việc cần làm.");
  // M
  if(!d.smart.m) add("M · Đo được","bad","Chưa ghi khi nào là đạt. Dùng con số: số hộ, số lô, %, số trang hồ sơ, có mã hồ sơ…");
  else if(!/\d|%|đủ|100|tất cả|toàn bộ|có mã|biên bản|xác nhận/i.test(d.smart.m)) add("M · Đo được","warn","Tiêu chí chưa có con số hay dấu hiệu xong rõ ràng.");
  else add("M · Đo được","ok","Có tiêu chí đo.");
  // A
  const load=d.R?Object.entries(S.tasks).filter(([k,x])=>k!==id&&x.kind!=="epic"&&x.status!=="done"&&x.R===d.R).length:0;
  if(!d.smart.a&&d.kind!=="sub") add("A · Khả thi","warn","Chưa ghi cần gì, ai hỗ trợ để làm được.");
  else if(load>=8) add("A · Khả thi","warn",pname(d.R)+" đang thực hiện "+load+" việc mở. Cân nhắc giãn hạn hoặc giao người khác.");
  else add("A · Khả thi","ok",d.R?pname(d.R)+" đang có "+load+" việc mở.":"Đã ghi điều kiện thực hiện.");
  // R
  if(!d.smart.r&&!d.parent&&!d.zone) add("R · Liên quan","warn","Chưa ghi vì sao cần, và chưa gắn epic hay vùng.");
  else add("R · Liên quan","ok",d.zone?"Gắn với vùng "+(S.zones[d.zone]?.name||""):d.parent?"Thuộc "+(par?.title||"việc cha"):"Đã ghi lý do.");
  // T
  const today=todayStr();
  if(!d.due) add("T · Có hạn","bad","Chưa chọn hạn hoàn thành.");
  else if(d.due<today&&!id) add("T · Có hạn","bad","Hạn đã qua.");
  else if(par?.due&&d.due>par.due) add("T · Có hạn","warn","Hạn ("+dmy(d.due)+") trễ hơn hạn của việc cha ("+dmy(par.due)+").");
  else if(d.kind!=="epic"&&diffDays(d.due,today)>30&&!kids) add("T · Có hạn","warn","Hạn xa hơn 30 ngày. Nên chia thành việc con có hạn ngắn hơn.");
  else add("T · Có hạn","ok","Hạn "+dmy(d.due)+".");
  // RACI
  if(!d.R) add("RACI · R","bad","Chưa có người thực hiện.");
  else add("RACI · R","ok",pname(d.R)+" thực hiện.");
  if(!d.A) add("RACI · A","bad","Chưa có một người chịu trách nhiệm cuối.");
  else if(d.kind==="epic"&&d.A===d.R) add("RACI · A","warn","Epic nên có A là cấp quản lý khác với người thực hiện.");
  else add("RACI · A","ok",pname(d.A)+" chịu trách nhiệm cuối"+(d.A===d.R?" (cũng là người làm, hợp lệ với việc nhỏ)":"")+".");
  const dup=[...d.C,...d.I].filter(x=>x===d.R||x===d.A);
  if(dup.length) add("RACI · C, I","warn",dup.map(pname).join(", ")+" đã là R hoặc A, bỏ khỏi C, I cho gọn.");
  else if(!d.I.length&&d.kind!=="sub") add("RACI · C, I","warn","Chưa có ai được thông báo (I). Thường là điều phối hoặc người nhận bàn giao.");
  else if(d.C.length+d.I.length>5) add("RACI · C, I","warn","Quá nhiều người C, I. Chỉ giữ người thật sự cần.");
  else add("RACI · C, I","ok","Hợp lý.");
  // clarity
  const note=d.note||"";
  if(d.kind==="epic") add("Độ rõ","ok","Epic dùng S, M ở trên làm mục tiêu chung.");
  else if(note.length<25&&!(d.smart.s&&d.smart.m)) add("Độ rõ","bad","Người được giao khó hiểu đủ. Ghi mô tả: làm gì, đầu ra là gì, lưu ở đâu, cần ai.");
  else if(!/(drive|farmbase|lưu|gửi|bàn giao|nộp|file|biên bản|danh sách|in|scan|zalo)/i.test(note+" "+d.smart.s+" "+d.smart.m)) add("Độ rõ","warn","Chưa nói đầu ra giao cho ai hoặc lưu ở đâu.");
  else add("Độ rõ","ok","Có đầu ra và nơi giao, lưu.");
  return out;
}

/* ---------- contracts ---------- */
function cCalc(c){
  const items=c.items||[]; const total=items.reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0);
  const zs=Object.entries(S.zones).filter(([,z])=>z.contract===c._id && z.active!==false);
  const haZ=zs.reduce((a,[,z])=>a+(+z.ha||0),0);
  const haC=Math.max(0,...items.map(i=>+i.qty||0));
  const reach=(min)=>zs.filter(([,z])=>(z.step??-1)>=min).length;
  const paid=(c.payments||[]).reduce((a,p)=>a+(p.paid?total*(+p.pct||0)/100:0),0);
  return {total,zs,haZ,haC,reach,paid};
}

function leaveDaySes(l,d){ const end=l.to||l.from; if(!l.from||d<l.from||d>end) return []; const s=d===l.from?(l.fromSes||"sang"):"sang", e=d===end?(l.toSes||"chieu"):"chieu"; return s===e?[s]:(s==="sang"&&e==="chieu"?["sang","chieu"]:[]); }

function attMonth(pid,ym){

  let std=0,P=0,K=0,pend=0,early=0,rep=0; const cells=days.map(day=>{ const ss=stdSes(day); std+=ss.length; const c={day,std:ss,mark:{}};
    ls.forEach(l=>{ const k=attKind(l); if(!k) return; if(l.type==="early"){ if(l.from===day&&k!=="pend"){ c.early=l.time||"?"; early++; } return; } leaveDaySes(l,day).forEach(s=>{ if(ss.includes(s)&&!c.mark[s]){ c.mark[s]=k; if(k==="P")P++; else if(k==="K")K++; else pend++; } }); });
    if(S.daily[day+"_"+pid]) { c.rep=true; rep++; } c.future=day>t; return c; });
  return {days:cells,std,P,K,pend,early,rep,work:std-P-K,paidDays:(std-K)/2};
}

const CGRP={gacc:"Đã có mã nội địa",ut1:"Ưu tiên 1",ut2:"Ưu tiên 2",tbd:"Chưa xác định"};
const CGRP_CRIT={gacc:"Đã có mã nội địa, chờ phía TQ cấp mã GACC",ut1:"Xã đã kiểm tra, duyệt hồ sơ; sắp ra mã",ut2:"Đã đủ hoặc sắp đủ hồ sơ sổ đỏ",tbd:"Còn vướng hồ sơ đất hoặc chưa thu đủ giấy tờ"};
function realCode(z){ return z.code&&!/^(DANGTHUCHIEN|TEST|YANNING)/.test(z.code)?z.code:""; }
function cGrp(z){ if((z.step??-1)>=7||realCode(z)) return "gacc"; if(!z.eta) return "tbd"; return z.priority==="1"?"ut1":"ut2"; }
function custIds(){ const ids=[ui.cust,...(ui.custAdd||[])].filter((k,i,a)=>k&&S.units[k]&&a.indexOf(k)===i); return ids; }
function custZones(){ const ids=custIds(); const ord={gacc:0,ut1:1,ut2:2,tbd:3};
  return activeZones().filter(([,z])=>ids.includes(z.unitId)).sort((a,b)=>ord[cGrp(a[1])]-ord[cGrp(b[1])]||ids.indexOf(a[1].unitId)-ids.indexOf(b[1].unitId)||(b[1].step??-1)-(a[1].step??-1)||a[1].name.localeCompare(b[1].name,"vi")); }
function custName(){ return custIds().map(k=>S.units[k].name).join(" · "); }
function custLegal(){ const ids=custIds(); return ids.length===1?(S.units[ids[0]].legal||S.units[ids[0]].name):custName(); }
function grpEta(list){ const c={}; list.forEach(([,z])=>{ if(z.eta) c[z.eta]=(c[z.eta]||0)+1; }); return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||""; }
function etaShort(e){ return String(e||"").replace(/\/\d{4}$/,""); }
function zShort(n){ let x=String(n||"").replace(/^\s*vùng\s+(trồng\s+)?sầu\s+riêng\s+/i,"").trim()||String(n||""); if(x===x.toLocaleUpperCase("vi")&&/[A-ZÀ-Ỹ]/.test(x)) x=x.toLocaleLowerCase("vi").replace(/(^|[\s('’])(\S)/g,(m,a,c)=>a+c.toLocaleUpperCase("vi")); return x; }
function tTitle(t,z){ const i=t.title.indexOf(":"); if(i>1&&i<60){ const p=t.title.slice(0,i).toLocaleLowerCase("vi").trim(); const zn=(z?.name||"").toLocaleLowerCase("vi"); if(p&&zn.includes(p)){ const r=t.title.slice(i+1).trim(); return r.charAt(0).toLocaleUpperCase("vi")+r.slice(1); } } return t.title; }
function zSubs(id,o){ o=o||{}; return Object.values(S.tasks).filter(t=>t.zone===id&&t.kind==="sub"&&t.status!=="done"&&(o.field?t.fieldVisit:!t.fieldVisit)).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")); }
function zRemain(id){ const z=S.zones[id]; return zSubs(id).map(t=>tTitle(t,z)+(t.party?" ("+t.party+")":"")+(t.due?": "+dmy(t.due):"")); }
function zFieldDone(id){ const f=Object.values(S.tasks).filter(t=>t.zone===id&&t.fieldVisit); return f.length?f.every(t=>t.status==="done"):null; }
function zPlace(z,multi){ return [z.ward,multi?unitName(z.unitId):""].filter(Boolean).join(" · "); }
function custData(){ const zs=custZones(); const G={gacc:[],ut1:[],ut2:[],tbd:[]}; zs.forEach(e=>G[cGrp(e[1])].push(e));
  const ha=l=>l.reduce((a,[,z])=>a+(+z.ha||0),0); return {zs,G,ha,multi:custIds().length>1}; }

    +Object.keys(CGRP).filter(g=>G[g].length).map(g=>'<tr><td style="min-width:130px"><b>'+CGRP[g]+'</b><div class="sub">'+CGRP_CRIT[g]+'</div></td><td class="n">'+G[g].length+'</td><td class="n">'+fmtHa(ha(G[g]))+'</td><td>'+(g==="gacc"?"Đã có":g==="tbd"?"Chưa xác định":esc(grpEta(G[g])))+'</td><td style="min-width:220px">'+G[g].map(([,z])=>esc(zShort(z.name))).join(", ")+'</td></tr>').join("")+'</tbody></table></div>';

  zs.forEach(([id,z])=>{ const g=cGrp(z), rm=zRemain(id);
    h+='<tr><td style="min-width:140px"><b>'+esc(zShort(z.name))+'</b><div class="sub">'+esc(zPlace(z,multi))+'</div></td><td class="n">'+fmtHa(z.ha)+'</td><td>'+CGRP[g]+(g==="gacc"&&realCode(z)?'<div class="sub mono">'+esc(realCode(z))+'</div>':z.eta?'<div class="sub">'+esc(z.eta)+'</div>':'')+'</td><td style="min-width:200px">'+esc(z.custNote||"")+'</td><td style="min-width:180px">'+esc(z.blocker||"")+'</td><td style="min-width:240px">'+(rm.length?rm.map(x=>'<div>• '+esc(x)+'</div>').join(""):(g==="tbd"&&z.next?esc(z.next):'<span class="sub">—</span>'))+'</td></tr>'; });
  h+='</tbody></table></div>';
  h+='<div class="sub" style="margin-top:10px">Việc còn lại lấy từ việc con chưa xong có ghi "Bên phụ trách". Ngày dự kiến sửa ở ô "Dự kiến có mã nội địa" trong hồ sơ vùng. Các mốc là dự kiến, mã nội địa do cơ quan nhà nước xét duyệt, mã GACC do phía Trung Quốc phê duyệt.</div>';
  return h;
}

function nextWorkday(d){ let x=addDays(d,1); while(new Date(x+"T00:00:00").getDay()===0) x=addDays(x,1); return x; }
function prevWorkday(d){ let x=addDays(d,-1); while(new Date(x+"T00:00:00").getDay()===0) x=addDays(x,-1); return x; }
function wdName(d){ return ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"][new Date(d+"T00:00:00").getDay()]; }
function fieldPlan(pid,d){ return Object.entries(S.tasks).filter(([,t])=>t.R===pid&&(t.planDate===d||(!t.planDate&&t.fieldVisit&&t.due===d&&t.status!=="done"))&&t.zone).map(([id,t])=>{ const z=S.zones[t.zone]; return {id,t,where:z?(zShort(z.name)+(z.ward?" ("+z.ward+")":"")):t.title}; }); }
function onLeave(pid,d){ return Object.values(S.leaves).some(l=>l.person===pid&&l.type!=="early"&&attKind(l)&&attKind(l)!=="pend"&&leaveDaySes(l,d).length); }
function repWhere(pid,d){ const prev=S.daily[prevWorkday(d)+"_"+pid]; const fp=fieldPlan(pid,d);
  if(onLeave(pid,d)) return {txt:"Nghỉ phép",c:"warn"};
  if(prev&&prev.loc) return {txt:prev.loc,c:/văn phòng|vp\b/i.test(prev.loc)?"":"info",src:"theo báo cáo hôm trước"};
  if(fp.length) return {txt:"Thực địa: "+fp.map(x=>x.where).join(", "),c:"info",src:"theo lịch việc thực địa"};
  return null; }
function repCard(pid,r,showWhere,d){ const p=S.people[pid]; const w=showWhere?repWhere(pid,d):null;
  return '<div class="panel" style="padding:12px;margin:0"><div class="row between" style="align-items:flex-start;gap:8px"><div style="min-width:0"><b>'+esc(p?.name||pid)+'</b> <span class="sub">'+esc(TEAMS[p?.team]||"")+'</span></div>'+(r?'<span class="sub mono">'+lgTimeSafe(r.at)+'</span>':'<span class="pill bad">Chưa gửi</span>')+'</div>'
   +(w?'<div style="margin-top:6px"><span class="pill '+w.c+'">📍 '+esc(w.txt)+'</span>'+(w.src?' <span class="sub">'+w.src+'</span>':'')+'</div>':'')
   +(r?'<div style="margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere"><span class="sub">Hoàn thành:</span> '+esc(r.done||"")+'</div>'+(r.block?'<div style="white-space:pre-wrap;color:var(--bad);overflow-wrap:anywhere"><span class="sub">Vướng:</span> '+esc(r.block)+'</div>':'')+(r.next?'<div style="white-space:pre-wrap;overflow-wrap:anywhere"><span class="sub">Dự kiến:</span> '+esc(r.next)+'</div>':'')+(r.loc?'<div style="overflow-wrap:anywhere"><span class="sub">'+wdName(nextWorkday(r.date||d))+' làm ở:</span> <b>'+esc(r.loc)+'</b></div>':''):'')
   +'</div>'; }
function lgTimeSafe(t){ if(!t) return ""; const x=new Date(t); return isNaN(x)?"":x.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"}); }
function repDay(d,title,showWhere){ const ps=Object.entries(S.people).filter(([k])=>isReporter(k)).sort((a,b)=>(a[1].order||99)-(b[1].order||99));
  const sent=ps.filter(([k])=>S.daily[d+"_"+k]), miss=ps.filter(([k])=>!S.daily[d+"_"+k]&&!onLeave(k,d));
  const extra=Object.entries(S.daily).filter(([k,r])=>k.startsWith(d+"_")&&!ps.some(([p])=>p===r.person));
  return '<div style="margin-top:14px"><div class="row between" style="flex-wrap:wrap;gap:6px"><h2 style="margin:0">'+title+' · '+wdName(d)+' '+dmy(d)+'</h2><span class="sub">'+sent.length+'/'+ps.length+' đã gửi'+(miss.length?' · chưa gửi: '+miss.map(([,p])=>esc(p.name)).join(", "):'')+'</span></div>'

function whereBoard(d){ const ps=Object.entries(S.people).filter(([k])=>isReporter(k)).sort((a,b)=>(a[1].order||99)-(b[1].order||99));
