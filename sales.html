<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5b3c">
<title>BVI Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Trang sales: một cột, thanh tab dưới, khung ghi tương tác trượt từ dưới lên. */
:root{--bg:#f3f5f1;--surface:#fff;--sunk:#e8ece5;--line:#d5dbd1;--fg:#17201a;--muted:#5b6a5f;--brand:#1f5b3c;--brand-ink:#fff;
 --good:#2f7d4f;--warn:#b7791f;--bad:#b83a2e;--info:#2f5f8a;--chip:#eef2ea;--hot:#c2410c;--warm:#b7791f;--cold:#2f5f8a;
 --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111613;--surface:#18201b;--sunk:#0d120f;--line:#2b362f;--fg:#e7ede8;--muted:#9aaa9f;--brand:#5fb184;--brand-ink:#0d1a12;
 --good:#5fb184;--warn:#e0a33f;--bad:#e2685b;--info:#7fb0dc;--chip:#202a23;--hot:#f08a5d;--warm:#e0a33f;--cold:#7fb0dc;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f);padding-bottom:calc(68px + env(safe-area-inset-bottom))}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top b{font-size:16px}.top .sp{flex:1}
.goal{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.goal i{display:inline-block;height:6px;width:46px;background:rgba(255,255,255,.3);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden;position:relative}
.goal i s{position:absolute;inset:0 auto 0 0;background:#fff;border-radius:3px}
.me{font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
@media (max-width:420px){.me{display:none}}
main{max-width:720px;margin:0 auto;padding:12px}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bot a{flex:1;text-align:center;padding:9px 4px 8px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.bot a span{display:block;font-size:19px;line-height:1.1}
.bot a.on{color:var(--brand)}
h2{font-size:15px;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--chip);border-radius:999px;padding:0 8px;font-size:12px;color:var(--muted)}
h2.bad{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.sub{color:var(--muted);font-size:12.5px}
.lrow{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;min-width:0}
.lrow .nm{font-weight:600;overflow-wrap:anywhere}
.lw{position:relative}.lw .lrow{padding-right:92px}.lw .ug{position:absolute;top:8px;right:8px}
.ug{border:1px solid var(--bad);color:var(--bad);background:var(--surface);border-radius:999px;padding:4px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.ug:hover{background:rgba(184,58,46,.08)}.ug.on{background:var(--bad);color:#fff;cursor:default}.ug:disabled:not(.on){opacity:.6}
.lrow .mt{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px;color:var(--muted);font-size:12.5px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:var(--chip);color:var(--fg);white-space:nowrap}
.pill.hot{background:var(--hot);color:#fff}.pill.warm{background:var(--warm);color:#fff}.pill.cold{background:var(--cold);color:#fff}
.pill.od{background:var(--bad);color:#fff}.pill.cs-bad{background:rgba(184,58,46,.12);color:var(--bad)}.pill.pa{background:var(--fg);color:var(--bg)}
.empty{color:var(--muted);font-size:13px;padding:4px 2px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .card{padding:10px;text-align:center}.stats b{display:block;font-size:20px}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
textarea.in{min-height:64px;resize:vertical}
.f{margin-bottom:10px}.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.acts .btn{flex-direction:column;padding:8px 2px;font-size:12px;gap:2px}.acts .btn span{font-size:18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}.kv div{overflow-wrap:anywhere;min-width:0}
.next{border-left:4px solid var(--brand);margin:10px 0}.next.od{border-left-color:var(--bad)}
.tl{margin-top:6px}.ti{border-left:2px solid var(--line);padding:0 0 12px 12px;position:relative;overflow-wrap:anywhere}
.ti:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.ti .when{font-size:12px;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;overflow-x:hidden;
 padding:12px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s;max-width:720px;margin:0 auto}
#sheet.open{transform:none}#sheet.open+.sheet-bg,.sheet-bg.on{display:block}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.sh-h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{margin:8px 0}.grp>div:first-child{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip.hot.on{background:var(--hot);border-color:var(--hot);color:#fff}.chip.warm.on{background:var(--warm);border-color:var(--warm);color:#fff}.chip.cold.on{background:var(--cold);border-color:var(--cold);color:#fff}
.row2{display:flex;gap:8px;align-items:center}.row2>*{min-width:0}
.msg{margin:8px 0;padding:8px 10px;border-radius:10px;font-size:13px}.msg.bad{background:rgba(184,58,46,.12);color:var(--bad)}.msg.ok{background:rgba(47,125,79,.12);color:var(--good)}.msg.warn{background:rgba(183,121,31,.14);color:var(--warn)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:20;display:none;max-width:90vw}
#lgSave{position:sticky;bottom:0;box-shadow:0 -8px 12px var(--surface)}
#lgSave:disabled{opacity:1;background:var(--sunk);color:var(--muted);border-color:var(--line)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.pick{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.auth{max-width:380px;margin:40px auto}
.more{display:block;text-align:center;margin:8px 0}
/* tổng quan, bộ lọc, bảng lead */
.ov{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px}
.ov button{flex:0 0 auto;min-width:88px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:left;cursor:pointer;min-width:0}
.ov button b{display:block;font-size:17px;line-height:1.2}.ov button span{font-size:12px;color:var(--muted);white-space:nowrap}
.ov button.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.stg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.stg button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.stg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.flt{margin-bottom:8px}.flt summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 2px;list-style:none}
.flt summary::-webkit-details-marker{display:none}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.fg .in{padding:8px 10px}
.ci{display:inline-flex;gap:3px}.ci i{font-style:normal;font-size:11px;border-radius:6px;padding:0 5px;border:1px solid var(--good);color:var(--good);white-space:nowrap}
.ci i.no{border:1px dashed var(--line);color:var(--muted);text-decoration:line-through}
.ltab{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.ltab th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.ltab td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ltab tbody tr{cursor:pointer}.ltab tbody tr:hover{background:var(--chip)}
.ltab td a{text-decoration:none;font-weight:600}.ltab .sub{font-size:12px}
.topnav{display:none}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 6px}.vbar .btn{padding:6px 10px;font-size:13px}
.shw{overflow:auto;max-height:calc(100vh - 230px);min-height:260px;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
.sht{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.sht th{position:sticky;top:0;z-index:2;background:var(--sunk);text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
.sht td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;background:var(--surface);vertical-align:middle}
.sht th:first-child,.sht td:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}.sht th:first-child{z-index:3}
.sht .cx{display:block;width:100%;min-width:var(--w,120px);border:0;background:transparent;color:inherit;font:inherit;padding:7px 8px;outline:none;border-radius:0}
.sht .cx:focus{background:rgba(31,91,60,.08);box-shadow:inset 0 0 0 2px var(--brand)}
.sht td.ok{animation:okf 1.2s}.sht td.err{background:rgba(184,58,46,.12)}.sht td.busy .cx{opacity:.5}
@keyframes okf{from{background:rgba(47,125,79,.25)}to{background:var(--surface)}}
@media (max-width:600px){.sht{font-size:12.5px}}
.sht .cx,.sht .ro{width:var(--w,120px);min-width:var(--w,120px);max-width:var(--w,120px);overflow:hidden;text-overflow:ellipsis}
.rz{position:absolute;top:0;right:0;bottom:0;width:10px;cursor:col-resize;touch-action:none;z-index:5}.rz::after{content:"";position:absolute;top:6px;bottom:6px;right:0;width:2px;border-radius:2px;background:var(--line)}.rz:hover::after,.rz.on::after{background:var(--brand);top:0;bottom:0}
.shrz{cursor:col-resize;user-select:none}
.sht .lst{white-space:nowrap}
.sht .ro{padding:7px 8px;white-space:nowrap;color:var(--muted)}.sht .nm{display:flex;align-items:center}.sht .nm a{padding:0 8px;text-decoration:none;font-size:15px}
@media (min-width:900px){
 main{padding:18px}main.wide{max-width:1280px}.ov button{min-width:150px;padding:9px 12px}
 body{padding-bottom:0}.bot{display:none!important}
 .topnav{display:flex;gap:4px;margin-left:14px}.topnav a{color:inherit;text-decoration:none;padding:5px 12px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:.85}
 .topnav a.on{background:rgba(255,255,255,.2);opacity:1}
 .flt summary{display:none}.fg{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
 #sheet{left:auto;top:0;width:460px;max-height:none;border-radius:16px 0 0 16px;transform:translateX(105%)}
 #toast{bottom:24px}
 .tdg{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
}
</style>
</head>
<body>
<header class="top" id="top" style="display:none"><b>BVI Sales</b><nav class="topnav"><a href="#hom-nay" data-r="hom-nay">Hôm nay</a><a href="#lead" data-r="lead">Lead</a><a href="#them" data-r="them">Thêm lead</a><a href="bao-gia.html">Báo giá</a></nav><span class="sp"></span><span class="goal" id="goal"></span><span class="me" id="meBtn"></span><button class="out" id="bLogout" type="button">Đăng xuất</button></header>
<main id="app"><div class="sub" style="padding:30px;text-align:center">Đang tải…</div></main>
<nav class="bot" id="bot" style="display:none">
 <a href="#hom-nay" data-r="hom-nay"><span>☀</span>Hôm nay</a>
 <a href="#lead" data-r="lead"><span>☰</span>Lead</a>
 <a href="#them" data-r="them"><span>＋</span>Thêm</a>
 <a href="bao-gia.html"><span>📄</span>Báo giá</a>
</nav>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Ghi tương tác"></div><div class="sheet-bg" id="sheetBg"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="sales-core.js"></script>
<script>
const SB_URL="https://pkckduidwfcncipwzdxa.supabase.co", SB_KEY="sb_publishable_ZHvz0flMvyIsxmT-tKS_Hw_q_Vz_7RF";
let SB, ME=null, LEADS=[], MYACTS=[], PEOPLE={}, PROLE={}, TAB="mine", Q="", STF="", F={prov:"",pri:"",seg:"",ct:"",own:"",cs:"",src:"",sort:"next"}, LIMIT=150, CALL=null, SH=null, REMIND=null, SHEET=(()=>{ try{ return localStorage.getItem("sl_sheet")==="1"; }catch(e){ return false; } })();
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isStaff=()=>ME&&["owner","manager","staff"].includes(ME.role);
const pname=id=>id?(PEOPLE[id]||"Người khác"):"";
const dmy=ymd=>ymd?ymd.slice(8,10)+"/"+ymd.slice(5,7):"";
const tday=()=>SC.vnToday(new Date(Date.now()));
const lead=id=>LEADS.find(l=>l.id===id);
function toast(t){ const e=$("#toast"); e.textContent=t; e.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display="none",2200); }
function shell(on){ $("#top").style.display=on?"":"none"; $("#bot").style.display=on?"":"none"; }
function phonesOf(l){ return SC.normPhones([l.contact_phone,l.contact_zalo,l.org_phone].filter(Boolean).join(", ")); }

// ---------- đăng nhập ----------
function showLogin(msg){
 shell(false);
 $("#app").innerHTML='<div class="auth card"><h1 style="margin:0 0 4px;font-size:20px">BVI Sales</h1><div class="sub" style="margin-bottom:12px">Đăng nhập bằng tài khoản được cấp</div>'
  +(msg?'<div class="msg bad">'+esc(msg)+'</div>':'')
  +'<form id="lf"><div class="f"><label for="lem">Email</label><input class="in" id="lem" type="email" autocomplete="username" required></div>'
  +'<div class="f"><label for="lpw">Mật khẩu</label><input class="in" id="lpw" type="password" autocomplete="current-password" required></div>'
  +'<button class="btn pri full">Đăng nhập</button><div class="sub" id="lmsg" style="margin-top:8px"></div></form>'
  +'<div class="sub" style="margin-top:10px">Quên mật khẩu: nhờ quản lý đặt lại.</div></div>';
 $("#lf").addEventListener("submit",async e=>{ e.preventDefault(); $("#lmsg").textContent="Đang đăng nhập…";
  const {error}=await SB.auth.signInWithPassword({email:$("#lem").value.trim(),password:$("#lpw").value});
  if(error){ $("#lmsg").textContent=/invalid/i.test(error.message)?"Sai email hoặc mật khẩu.":/banned/i.test(error.message)?"Tài khoản đã bị khóa.":error.message; return; }
  start(); });
}
function block(msg){ shell(false); $("#app").innerHTML='<div class="auth card"><h1 style="margin:0 0 6px;font-size:18px">BVI Sales</h1><div class="msg warn">'+esc(msg)+'</div><button class="btn full" id="bOut">Đăng xuất</button></div>'; $("#bOut").onclick=logout; }
async function logout(){ try{ await SB.auth.signOut({scope:"local"}); }catch(e){} try{ Object.keys(localStorage).filter(k=>/^sb-.*-auth-token$/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){} ME=null; LEADS=[]; MYACTS=[]; closeSheet(); location.hash=""; showLogin(); }
function showChangePw(){
 shell(false);
 $("#app").innerHTML='<div class="auth card"><h1 style="margin:0 0 6px;font-size:18px">Đổi mật khẩu lần đầu</h1><form id="pf"><div class="f"><label for="p1">Mật khẩu mới (từ 8 ký tự)</label><input class="in" id="p1" type="password" minlength="8" autocomplete="new-password" required></div><div class="f"><label for="p2">Nhập lại</label><input class="in" id="p2" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn pri full">Lưu mật khẩu</button><div class="sub" id="pmsg" style="margin-top:8px"></div></form></div>';
 $("#pf").addEventListener("submit",async e=>{ e.preventDefault(); if($("#p1").value!==$("#p2").value){ $("#pmsg").textContent="Hai mật khẩu chưa khớp."; return; }
  const {error}=await SB.auth.updateUser({password:$("#p1").value}); if(error){ $("#pmsg").textContent=error.message; return; }
  await SB.from("profiles").update({must_change_pw:false}).eq("id",ME.id); ME.must_change_pw=false; toast("Đã đổi mật khẩu"); start(); });
}
async function start(){
 const {data:{session}}=await SB.auth.getSession(); if(!session){ showLogin(); return; }
 const {data:prof,error}=await SB.from("profiles").select("id,name,email,role,active,must_change_pw").eq("id",session.user.id).single();
 if(error||!prof){ block("Không đọc được tài khoản. Thử tải lại trang."); return; }
 ME=prof;
 if(!prof.active){ block("Tài khoản đã bị khóa."); return; }
 if(prof.role==="viewer"){ block("Tài khoản người xem không dùng trang sales. Mở trang quản trị để xem số liệu."); return; }
 if(prof.must_change_pw){ showChangePw(); return; }
 TAB=isStaff()?"mine":"all";
 shell(true); $("#meBtn").textContent=prof.name||prof.email||"Tôi";
 $("#app").innerHTML='<div class="sub" style="padding:30px;text-align:center">Đang tải lead…</div>';
 const ok=await loadAll(); if(!ok){ $("#app").innerHTML='<div class="msg bad">Chưa tải được dữ liệu. Kiểm tra mạng rồi tải lại trang.</div>'; return; }
 route();
}
async function loadAll(){
 const all=[]; for(let from=0;;from+=1000){ const {data,error}=await SB.from("sales_leads").select("*").order("name").range(from,from+999); if(error) return false; all.push(...data); if(data.length<1000) break; }
 LEADS=all;
 const st=new Date(tday()+"T00:00:00+07:00").toISOString();
 const a=await SB.from("sales_acts").select("id,lead_id,channel,result,kind,at").eq("by",ME.id).gte("at",st); MYACTS=(a.data||[]).filter(x=>x.kind==="act");

 if(a.kind==="claim") return '<div class="ti"><div class="when">'+w+'</div>Nhận từ kho chung (quản lý duyệt)</div>';
 const t=[SC.lab(SC.CHANNELS,a.channel),SC.lab(SC.RESULTS,a.result)].filter(Boolean).join(" · ")+(a.minutes?" · "+a.minutes+" phút":"");
 const tags=[a.temp_after?'<span class="pill '+a.temp_after+'">'+SC.lab(SC.TEMPS,a.temp_after)+'</span>':'',a.fit_after?'<span class="pill">Tiềm năng '+SC.lab(SC.FITS,a.fit_after).toLowerCase()+'</span>':'',a.stage_after!=null?'<span class="pill">'+SC.lab(SC.STAGES,a.stage_after)+'</span>':'',(a.needs_after||[]).map(k=>'<span class="pill">'+SC.lab(SC.NEEDS,k)+'</span>').join("")].join("");
 let geo=""; if(a.lat!=null){ geo='<div class="sub">📍 <a href="https://www.google.com/maps?q='+a.lat+','+a.lng+'" target="_blank" rel="noopener">Xem vị trí</a>'+(l&&l.lat!=null&&(l.lat!==a.lat||l.lng!==a.lng)?' · cách vị trí khách khoảng '+Math.round(SC.distM(l.lat,l.lng,a.lat,a.lng)/10)*10+' m':'')+'</div>'; }
 else if(a.channel==="meet") geo='<div class="sub">Không có vị trí</div>';
 const ph=(a.photos||[]).length?'<div class="ph" data-photos="'+esc((a.photos||[]).join("|"))+'"></div>':'';
 return '<div class="ti"><div class="when">'+w+' · '+esc(pname(a.by)||"")+'</div><b>'+esc(t)+'</b>'+(tags?'<div class="chips" style="gap:4px;margin-top:3px">'+tags+'</div>':'')+(a.note?'<div>'+esc(a.note)+'</div>':'')
  +(a.next_at||a.next_type?'<div class="sub">Hẹn: '+esc(SC.lab(SC.NEXT,a.next_type)||"liên hệ")+(a.next_at?' '+dmy(a.next_at):'')+(a.next_note?' · '+esc(a.next_note):'')+'</div>':'')+geo+ph+'</div>';
}
async function refreshLead(id){ const {data}=await SB.from("sales_leads").select("*").eq("id",id).single(); if(data){ const i=LEADS.findIndex(x=>x.id===id); if(i>=0) LEADS[i]=data; else LEADS.push(data); } return data; }

// ---------- Ghi tương tác ----------
async function saveAct(leadId,act){
 const row=Object.assign({lead_id:leadId,kind:"act"},act);
 const {error}=await SB.from("sales_acts").insert(row);
 if(error) return false;
 MYACTS.push({lead_id:leadId,channel:row.channel,result:row.result,kind:"act",at:new Date().toISOString()});
 await refreshLead(leadId); return true;
}
window.saveAct=saveAct;
function chips(group,arr,sel,cls){ return '<div class="chips">'+arr.map(([k,t])=>'<button type="button" class="chip'+(cls?" "+k:"")+(sel===k||(Array.isArray(sel)&&sel.includes(k))?" on":"")+'" data-'+group+'="'+k+'">'+esc(t)+'</button>').join("")+'</div>'; }
function openSheet(leadId,preset){
 const l=lead(leadId); if(!l) return; preset=preset||{};
 SH={lead:leadId,ch:preset.ch||null,rs:preset.rs||null,pr:SC.prioOf(l)||null,ft:l.fit||null,nd:[...(l.needs||[])],st:null,nt:null,nx:null,lost:null};
 const sheet=$("#sheet");
 sheet.innerHTML='<div class="sh-h"><b>'+esc(l.name)+'</b><button class="btn" id="lgX" aria-label="Đóng" style="padding:6px 10px">✕</button></div>'
  +(preset.checkin?'<div class="grp"><div>Ảnh gặp khách (tối đa 3)</div><label class="btn" for="ciFile">📷 Chụp hoặc chọn ảnh</label><input id="ciFile" type="file" accept="image/*" capture="environment" multiple style="position:absolute;width:1px;height:1px;opacity:0"><div class="thumbs" id="ciThumbs"></div><div class="sub" id="ciMsg"></div><div class="sub" id="ciGeo">📍 Đang lấy vị trí…</div></div>':'')
  +'<div class="grp"><div>Kênh *</div>'+chips("ch",SC.CHANNELS,SH.ch)+'</div>'
  +'<div class="grp"><div>Kết quả *</div>'+chips("rs",SC.RESULTS,SH.rs)+'</div>'
  +'<div class="grp" id="gLost" style="display:none"><div>Lý do không theo</div>'+chips("lost",SC.LOST.map(x=>[x,x]),null)+'</div>'
  +'<div class="grp"><div>Độ ưu tiên</div>'+chips("pr",SC.PRIOS,SH.pr)+'</div>'
  +'<div class="grp"><div>Tiềm năng</div>'+chips("ft",SC.FITS,SH.ft)+'</div>'
  +'<div class="grp"><div>Nhu cầu</div>'+chips("nd",SC.NEEDS,SH.nd)+'</div>'
  +'<div class="grp"><div>Chuyển giai đoạn (nếu có)</div>'+chips("st",SC.STAGES.filter(s=>[3,4,5,8,6,9,7].includes(s[0])),null)+'</div>'
  +'<div class="grp"><div>Ghi chú</div><textarea class="in" id="lgNote" placeholder="Khách nói gì, cần gì"></textarea></div>'
  +'<div class="grp"><div>Bước tiếp</div>'+chips("nt",SC.NEXT,null)+'<div class="row2" style="margin-top:6px">'+chips("nx",[["1d","Mai"],["3d","3 ngày"],["1w","1 tuần"]],null)+'<input class="in" type="date" id="lgDate" style="width:auto;flex:1" aria-label="Ngày hẹn"></div><div class="sub" id="lgAuto" style="margin-top:4px"></div></div>'
  +'<div class="grp row2"><div style="margin:0">Thời gian (phút)</div><input class="in" id="lgMin" type="number" min="0" max="600" inputmode="numeric" style="width:90px" value="'+(preset.min!=null?preset.min:"")+'"></div>'
  +'<div id="lgMsg"></div><button class="btn pri full" id="lgSave">Lưu</button>';
 sheet.classList.add("open"); $("#sheetBg").classList.add("on");
 if(preset.checkin){ SH.checkin=true; SH.files=[]; const me=SH;
  SH.posP=getPos(10000).then(pos=>{ me.pos=pos; if(SH===me&&$("#ciGeo")) $("#ciGeo").textContent=pos?"📍 "+pos.lat.toFixed(5)+", "+pos.lng.toFixed(5)+" (±"+Math.round(pos.acc||0)+" m)":"📍 Không có vị trí (chưa cho phép hoặc không bắt được GPS). Vẫn lưu được."; return pos; });
  $("#ciFile").onchange=e=>{ const fs=[...e.target.files]; const room=3-me.files.length; me.files.push(...fs.slice(0,Math.max(0,room)));
   $("#ciMsg").textContent=fs.length>room?"Tối đa 3 ảnh, đã lấy "+me.files.length+" ảnh đầu.":"";
   $("#ciThumbs").innerHTML=me.files.map(f=>'<img alt="" src="'+URL.createObjectURL(f)+'">').join(""); e.target.value=""; }; }
 const upd=()=>{ $("#lgSave").disabled=!(SH.ch&&SH.rs); $("#gLost").style.display=SH.rs==="refused"||SH.st==="7"?"":"none"; };
 const onNt=()=>sheet.querySelectorAll("[data-nt]").forEach(x=>x.classList.toggle("on",x.dataset.nt===SH.nt));
 const auto=()=>{ if(SH.manual) return; const n=SC.remindDays(REMIND,{result:SH.rs,stage:SH.st!=null?+SH.st:l.stage}), h=$("#lgAuto");
  if(n>0){ $("#lgDate").value=SC.addDays(tday(),n); SH.autoDate=true; if(!SH.nt){ SH.nt="call"; SH.autoNt=true; onNt(); } h.textContent="Tự nhắc gọi lại sau "+n+" ngày. Đổi ngày nếu cần."; }
  else { if(SH.autoDate){ $("#lgDate").value=""; SH.autoDate=false; } if(SH.autoNt){ SH.nt=null; SH.autoNt=false; onNt(); } h.textContent=SH.rs?"Không đặt nhắc gọi lại.":""; } };
 sheet.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
  const g=Object.keys(b.dataset)[0], v=b.dataset[g];
  if(g==="nd"){ SH.nd=SH.nd.includes(v)?SH.nd.filter(x=>x!==v):[...SH.nd,v]; b.classList.toggle("on"); return; }
  const req=g==="ch"||g==="rs", cur=SH[g];
  SH[g]=(cur===v&&!req)?null:v;
  sheet.querySelectorAll('[data-'+g+']').forEach(x=>x.classList.toggle("on",x.dataset[g]===SH[g]));
  if(g==="nx"){ $("#lgDate").value=SH.nx?SC.nextPreset(SH.nx,tday()):""; SH.manual=true; $("#lgAuto").textContent=""; }
  if(g==="nt") SH.autoNt=false;
  if(g==="rs"||g==="st") auto();
  upd(); });
 $("#lgDate").onchange=()=>{ SH.nx=null; SH.manual=true; $("#lgAuto").textContent=""; sheet.querySelectorAll("[data-nx]").forEach(x=>x.classList.remove("on")); };
 if(SH.rs) auto();
 $("#lgX").onclick=closeSheet; $("#sheetBg").onclick=closeSheet;
 $("#lgSave").onclick=async()=>{
  const note=$("#lgNote").value.trim(), m=$("#lgMin").value;
  const act={channel:SH.ch,result:SH.rs,note:(SH.lost?"Lý do: "+SH.lost+(note?". ":""):"")+note||null,minutes:m===""?null:Math.max(0,parseInt(m,10)||0),
   fit_after:SH.ft,needs_after:SH.nd,stage_after:SH.st==null?null:+SH.st,next_type:SH.nt,next_at:$("#lgDate").value||null};
  if(!act.note) act.note=null;
  $("#lgSave").disabled=true; $("#lgSave").textContent="Đang lưu…"; const me=SH;
  if(me.checkin){
   const pos=me.pos!==undefined?me.pos:await me.posP; act.lat=pos?pos.lat:null; act.lng=pos?pos.lng:null; act.acc=pos?pos.acc:null;
   if(me.files.length){ $("#lgSave").textContent="Đang tải ảnh…"; const ph=await uploadPhotos(me.lead,me.files);
    if(!ph){ $("#lgSave").textContent="Lưu"; $("#lgSave").disabled=false; $("#lgMsg").innerHTML='<div class="msg bad">Chưa tải được ảnh. Kiểm tra mạng rồi bấm Lưu lại.</div>'; return; }
    act.photos=ph; } }
  const ok=await saveAct(me.lead,act);
  $("#lgSave").textContent="Lưu"; $("#lgSave").disabled=false;
  if(!ok){ $("#lgMsg").innerHTML='<div class="msg bad">Chưa lưu được. Kiểm tra mạng rồi bấm Lưu lại, ghi chú vẫn còn.</div>'; return; }
  let msg="Đã lưu tương tác"; const ld=lead(me.lead);
  if(ld&&(me.pr||"")!==SC.prioOf(ld)){ const {error}=await SB.from("sales_leads").update({priority:me.pr}).eq("id",me.lead);
   if(error) msg="Đã lưu tương tác, chưa đổi được ưu tiên"; else await refreshLead(me.lead); }
  closeSheet(); toast(msg); route(); };
 upd();
}
// ---------- Check-in: vị trí, nén ảnh, tải ảnh ----------
function getPos(timeoutMs=10000){
 return new Promise(res=>{ if(!navigator.geolocation) return res(null); let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
  setTimeout(()=>fin(null),timeoutMs+500);
  try{ navigator.geolocation.getCurrentPosition(p=>fin({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),()=>fin(null),{enableHighAccuracy:true,timeout:timeoutMs,maximumAge:0}); }catch(e){ fin(null); } });
}
async function shrink(file,max=1600){
 try{
  const img=await new Promise((ok,no)=>{ const u=URL.createObjectURL(file), i=new Image(); i.onload=()=>{ URL.revokeObjectURL(u); ok(i); }; i.onerror=()=>{ URL.revokeObjectURL(u); no(); }; i.src=u; });
  if(!img.naturalWidth) return file; const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const b=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.8)); return b&&b.size?b:file;
 }catch(e){ return file; }
}
async function uploadPhotos(leadId,files){
 const out=[];
 for(let i=0;i<files.length;i++){ const f=files[i], b=await shrink(f), ext=b===f?(((f.name||"").split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg"):"jpg";
  const path=ME.id+"/"+leadId+"/"+Date.now()+"_"+i+"."+ext;
  const {error}=await SB.storage.from("sales").upload(path,b,{contentType:b.type||"image/jpeg",upsert:false}); if(error) return null; out.push(path); }
 return out;
}
window.getPos=getPos; window.shrink=shrink; window.uploadPhotos=uploadPhotos;
function closeSheet(){ $("#sheet").classList.remove("open"); $("#sheetBg").classList.remove("on"); SH=null; }
document.addEventListener("visibilitychange",()=>{
 if(!CALL) return;
 if(document.visibilityState==="hidden"){ if(!CALL.left) CALL.left=Date.now(); return; }
 if(!CALL.left) return;
 const c=CALL; CALL=null; const m=SC.callMinutes(c.left,Date.now());
 openSheet(c.lead,{ch:c.ch,min:m==null?"":m,rs:m===0?"noans":null});
});

function vAdd(){
 $("#app").innerHTML='<h2 style="margin-top:4px">Thêm lead</h2><div class="card"><form id="nf">'
  +'<div class="f"><label for="nName">Tên tổ chức hoặc người *</label><input class="in" id="nName" required></div>'
  +'<div class="f"><label for="nContact">Người liên hệ</label><input class="in" id="nContact"></div>'
  +'<div class="f"><label for="nPhone">Số điện thoại / Zalo</label><input class="in" id="nPhone" type="tel" inputmode="tel"></div>'
  +'<div class="f"><label for="nEmail">Email</label><input class="in" id="nEmail" type="email"></div>'
  +'<div class="sub" style="margin:-4px 0 10px">Cần tên và ít nhất số điện thoại hoặc email.</div>'
  +'<div class="f"><label for="nProv">Tỉnh</label><input class="in" id="nProv"></div>'
  +'<div class="f"><label for="nAddr">Địa chỉ</label><input class="in" id="nAddr"></div>'
  +'<div class="f"><label for="nTax">Mã số thuế (nếu có)</label><input class="in" id="nTax" inputmode="numeric"></div>'
  +'<div class="f"><label for="nNeed">Nhu cầu, ghi chú</label><textarea class="in" id="nNeed"></textarea></div>'
  +(!isStaff()?'<div class="f"><label for="nRef">Người giới thiệu (nếu có)</label><input class="in" id="nRef"></div>':'')
  +'<div id="nMsg"></div><button class="btn pri full" id="nSave" type="submit" disabled>Lưu lead</button></form></div>';
 const v=id=>($(id)?$(id).value.trim():"");
 const chk=()=>{ $("#nSave").disabled=!(v("#nName")&&(SC.normPhones(v("#nPhone")).length||/@/.test(v("#nEmail")))); };
 ["#nName","#nPhone","#nEmail"].forEach(s=>$(s).addEventListener("input",()=>{ chk(); $("#nMsg").innerHTML=""; }));
 $("#nf").addEventListener("submit",async e=>{ e.preventDefault(); if($("#nSave").disabled) return;
  $("#nSave").disabled=true; $("#nMsg").innerHTML='<div class="sub">Đang kiểm tra trùng…</div>';
  const d=await SB.rpc("sales_dup",{p_phone:v("#nPhone"),p_tax:v("#nTax"),p_name:v("#nName")});
  if(d.error){ $("#nMsg").innerHTML='<div class="msg bad">Chưa kiểm tra được trùng. Thử lại.</div>'; chk(); return; }
  const r=String(d.data||"none");
  if(r!=="none"){
   if(r.startsWith("pool:")){ const pid=r.slice(5);
    $("#nMsg").innerHTML='<div class="msg warn">Lead đã có trong hệ thống, đang ở kho chung chưa ai phụ trách.</div><button type="button" class="btn full" id="nClaim" style="margin-bottom:8px">'+(isStaff()?"Nhận lead này":"Gửi yêu cầu nhận")+'</button>';
    $("#nClaim").onclick=async()=>{ $("#nClaim").disabled=true;
     if(isStaff()){ const {error}=await SB.from("sales_leads").update({owner_id:ME.id}).eq("id",pid).is("owner_id",null); if(error){ $("#nClaim").disabled=false; toast("Chưa nhận được"); return; } await refreshLead(pid); location.hash="#lead/"+pid; return; }
     const {error}=await SB.rpc("sales_claim",{p_lead:pid});
     $("#nMsg").innerHTML=error?'<div class="msg bad">Chưa gửi được yêu cầu: '+esc(error.message)+'</div>':'<div class="msg ok">Đã gửi yêu cầu. Quản lý duyệt xong, lead sẽ hiện trong danh sách của bạn.</div>'; };
   } else if(r==="mine"){ $("#nMsg").innerHTML='<div class="msg warn">Lead đã có trong hệ thống, đang nằm trong danh sách của bạn.</div>'; }
   else { $("#nMsg").innerHTML='<div class="msg warn">Lead đã có trong hệ thống và đã có người phụ trách. Báo quản lý nếu bạn đang làm việc với khách này.</div>'; }
   chk(); return; }
  const ph=v("#nPhone");
  const row={name:v("#nName"),contact_name:v("#nContact")||null,contact_phone:ph||null,contact_email:v("#nEmail")||null,province:v("#nProv")||null,address:v("#nAddr")||null,

  if(error||!data){ $("#nMsg").innerHTML='<div class="msg bad">Chưa lưu được'+(error?": "+esc(error.message):"")+'</div>'; chk(); return; }
  LEADS.push(data); toast("Đã thêm lead"); location.hash="#lead/"+data.id; });
}
